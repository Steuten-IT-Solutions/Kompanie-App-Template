# Vorschau einer Kompanie: App bauen, Bildschirmfotos, Pakete (unsigniert) als Ergebnis zum Ansehen.
# Wird aus jedem Kompanie-Repo aufgerufen (vorlage/.github/workflows/build.yml), auch für Pull Requests.
# Bekommt bewusst keine Geheimnisse: Signiert und veröffentlicht wird nur im Kern-Repo
# (publish-kompanie.yml).
name: Kompanie-Vorschau

on:
  workflow_call:
    inputs:
      core-ref:
        description: Stand des Kerns (Standard main, wie bei der Veröffentlichung)
        type: string
        default: main

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Kompanie-Repo holen
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: kompanie
          persist-credentials: false

      - name: Kern holen
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Steuten-IT-Solutions/Kompanie-App-Template
          ref: ${{ inputs.core-ref }}
          path: core
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, gd, sodium, zip, mbstring, curl, openssl, simplexml, intl
          tools: composer

      # PHPMailer (Issue #172): kommt mit composer install aus composer.lock und ins Paket der eigenständigen Version.
      - name: PHP-Abhängigkeiten (PHPMailer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=core

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: App bauen (Branding aus kompanie.json und Logo)
        working-directory: core
        env:
          KOMPANIE_CONFIG: ${{ github.workspace }}/kompanie/kompanie.json
          KOMPANIE_ASSETS: ${{ github.workspace }}/kompanie/assets
        run: scripts/build-frontend.sh

      - name: Bildschirmfotos (hell und dunkel)
        working-directory: core
        env:
          KOMPANIE_CONFIG: ${{ github.workspace }}/kompanie/kompanie.json
        run: |
          npx playwright install --with-deps chromium
          scripts/screenshots.sh "$GITHUB_WORKSPACE/out/screenshots"

      - name: Pakete bauen (unsigniert, nur zum Ansehen)
        working-directory: core
        env:
          WS: ${{ github.workspace }}
          REPO: ${{ github.repository }}
        run: php scripts/package.php --config="$WS/kompanie/kompanie.json" --version="$(tr -d '[:space:]' < VERSION).0" --out="$WS/out/release" --kompanie="$REPO"

      - name: Ergebnis zum Ansehen
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vorschau
          path: out

# Eine Version einer Kompanie für alle freigeben (promote) oder zurückziehen (withdraw), oder bei allen
# Kompanien die neueste Version mit geprüftem Programmcode freigeben (promote-checked, Datei STABLE_CORE).
# Nur im Kern-Repo, hinter der Environment „veroeffentlichen“; starten dürfen nur Personen mit
# Schreibrecht auf das Kern-Repo. Zurückgezogene Versionen spielen
# die Installationen automatisch auf die zuletzt freigegebene Version zurück.
name: Versionen steuern

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Kompanie-Repo (Steuten-IT-Solutions/Name); leer = alle Kompanien (nur mit promote-checked)
        type: string
        required: false
      action:
        description: Was soll passieren? (promote-checked = geprüfte Version laut STABLE_CORE freigeben)
        type: choice
        options: [promote-checked, promote, withdraw]
      version:
        description: Version, z. B. 1.4.0.3 (nur für promote und withdraw)
        type: string
        required: false

permissions:
  contents: read

jobs:
  ziele:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.ziele.outputs.repos }}
    steps:
      - name: Eingaben prüfen und Kompanien bestimmen
        id: ziele
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$ACTION" != promote-checked ]; then
            [ -n "$REPO" ] || { echo "::error::Für $ACTION bitte ein Kompanie-Repo angeben."; exit 1; }
            [ -n "$VERSION" ] || { echo "::error::Für $ACTION bitte eine Version angeben."; exit 1; }
          elif [ -n "$VERSION" ]; then
            echo "::error::promote-checked bestimmt die Version selbst; das Feld Version bitte leer lassen."; exit 1
          fi
          if [ -n "$REPO" ]; then
            [[ "$REPO" =~ ^Steuten-IT-Solutions/[A-Za-z0-9._-]+$ ]] || { echo "::error::Ungültiges Kompanie-Repo: $REPO"; exit 1; }
            REPOS="$REPO"
          else
            REPOS="$(gh search repos --owner Steuten-IT-Solutions --topic kompanie-app --visibility public --archived=false --limit 500 --json fullName --jq '.[].fullName')"
          fi
          JSON="$(printf '%s\n' "$REPOS" | { grep -E '^Steuten-IT-Solutions/[A-Za-z0-9._-]+$' || true; } | jq -R . | jq -cs .)"
          [ "$JSON" != '[]' ] || { echo "::error::Keine Kompanie gefunden."; exit 1; }
          echo "Kompanien: $JSON"
          echo "repos=$JSON" >> "$GITHUB_OUTPUT"

  control:
    needs: ziele
    runs-on: ubuntu-latest
    environment: veroeffentlichen
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJSON(needs.ziele.outputs.repos) }}
    # Je Kompanie, Aktion und Version eine eigene Gruppe: So verdrängt kein späterer Lauf einen wartenden
    # (z. B. ein Zurückziehen). Gleichzeitige Änderungen der Liste fängt control-release.sh ab.
    concurrency:
      group: kompanie-control-${{ matrix.repo }}-${{ inputs.action }}-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Name des Kompanie-Repos
        id: name
        env:
          REPO: ${{ matrix.repo }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: core
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: sodium, mbstring
          tools: none

      - name: Zugang zum Kompanie-Repo (GitHub App)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KOMPANIE_APP_ID }}
          private-key: ${{ secrets.KOMPANIE_APP_KEY }}
          owner: Steuten-IT-Solutions
          repositories: ${{ steps.name.outputs.name }}

      - name: Update-Liste ändern und Download-Seite neu erzeugen
        env:
          KOMPANIE_SIGNING_KEY: ${{ secrets.KOMPANIE_SIGNING_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ matrix.repo }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
        run: core/scripts/control-release.sh

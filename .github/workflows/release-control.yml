# Eine Version einer Kompanie für alle freigeben (promote) oder zurückziehen (withdraw).
# Nur im Kern-Repo, hinter der Environment „veroeffentlichen“. Zurückgezogene Versionen spielen
# die Installationen automatisch auf die zuletzt freigegebene Version zurück.
name: Versionen steuern

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Kompanie-Repo (Steuten-IT-Solutions/Name)
        type: string
        required: true
      action:
        description: Was soll passieren?
        type: choice
        options: [promote, withdraw]
      version:
        description: Version, z. B. 1.4.0.3
        type: string
        required: true
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      action:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: kompanie-control-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  control:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: veroeffentlichen
    steps:
      - name: Eingaben prüfen
        id: name
        env:
          REPO: ${{ inputs.repo }}
        run: |
          [[ "$REPO" =~ ^Steuten-IT-Solutions/[A-Za-z0-9._-]+$ ]] || { echo "::error::Ungültiges Kompanie-Repo: $REPO"; exit 1; }
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: core
          persist-credentials: false

      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.2'
          extensions: sodium, mbstring
          tools: none

      - name: Zugang zum Kompanie-Repo (GitHub App)
        id: app
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.KOMPANIE_APP_ID }}
          private-key: ${{ secrets.KOMPANIE_APP_KEY }}
          owner: Steuten-IT-Solutions
          repositories: ${{ steps.name.outputs.name }}

      - name: Update-Liste ändern und Download-Seite neu erzeugen
        env:
          KOMPANIE_SIGNING_KEY: ${{ secrets.KOMPANIE_SIGNING_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
        run: core/scripts/control-release.sh

# Baut, signiert und veröffentlicht die App einer Kompanie. Läuft nur im Kern-Repo, von Hand oder aus
# „Kompanien abgleichen“ (kompanien-abgleichen.yml, z. B. nach einer Änderung im Kompanie-Repo):
# - Job „build“ ohne Geheimnisse: npm, Branding aus kompanie.json und Logo, Bildschirmfotos.
#   Sein Ergebnis gilt als nicht vertrauenswürdig (hier laufen fremde Pakete und Daten der Kompanie).
# - Job „publish“ hinter der Environment „veroeffentlichen“ (Secrets KOMPANIE_SIGNING_KEY und
#   KOMPANIE_APP_KEY, Variable KOMPANIE_APP_ID; nur Branches main und develop), ohne npm: übernimmt aus „build“ nur
#   die gebaute Oberfläche und Bilder (erlaubte Dateitypen), baut Pakete, install.php und release.json
#   selbst aus dem eigenen Checkout, signiert und veröffentlicht (scripts/publish-release.sh).
name: Kompanie veröffentlichen

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Kompanie-Repo (Steuten-IT-Solutions/Name, genaue Schreibweise)
        type: string
        required: true
  # Nur für kompanien-abgleichen.yml und kompanie-formular.yml in diesem Repo. (Aus einem fremden Repo
  # aufgerufen liefe der Workflow mit dessen Rechten und Geheimnissen, nicht mit unseren.)
  # Die Aufrufer müssen die Secrets weitergeben, auch die der Environment: sonst kommen sie leer an.
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
    secrets:
      KOMPANIE_APP_KEY:
        required: true
      KOMPANIE_SIGNING_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: kompanie-publish-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      kompanie-sha: ${{ steps.kompanie.outputs.sha }}
    steps:
      - name: Kompanie-Repo prüfen (Schreibweise, Topic kompanie-app)
        id: check
        env:
          REPO: ${{ inputs.repo }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REPO" =~ ^Steuten-IT-Solutions/[A-Za-z0-9._-]+$ ]] || { echo "::error::Ungültiges Kompanie-Repo: $REPO"; exit 1; }
          [[ "$REPO" != "$GITHUB_REPOSITORY" ]] || { echo "::error::Das Kern-Repo ist keine Kompanie."; exit 1; }
          INFO="$(gh api "repos/$REPO" --jq '[.full_name, (.topics | index("kompanie-app") != null), .private] | @tsv')"
          IFS=$'\t' read -r NAME TOPIC PRIVATE <<< "$INFO"
          [[ "$NAME" == "$REPO" ]] || { echo "::error::Bitte genau so schreiben: $NAME"; exit 1; }
          [[ "$TOPIC" == true ]] || { echo "::error::$REPO hat nicht das Topic kompanie-app."; exit 1; }
          [[ "$PRIVATE" == false ]] || { echo "::error::$REPO muss öffentlich sein."; exit 1; }
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: core
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.repo }}
          ref: main
          path: kompanie
          persist-credentials: false

      - name: Stand des Kompanie-Repos
        id: kompanie
        run: echo "sha=$(git -C kompanie rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, gd, sodium, zip, mbstring, curl, openssl, simplexml, intl
          tools: none

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: App bauen
        working-directory: core
        env:
          KOMPANIE_CONFIG: ${{ github.workspace }}/kompanie/kompanie.json
          KOMPANIE_ASSETS: ${{ github.workspace }}/kompanie/assets
        run: scripts/build-frontend.sh

      - name: Bildschirmfotos
        working-directory: core
        env:
          KOMPANIE_CONFIG: ${{ github.workspace }}/kompanie/kompanie.json
          OUT: ${{ github.workspace }}/out
        run: |
          npx playwright install --with-deps chromium
          scripts/screenshots.sh "$OUT/screenshots"

      - name: Ergebnis zusammenstellen
        working-directory: core
        env:
          OUT: ${{ github.workspace }}/out
        run: |
          cp -r packages/frontend/dist "$OUT/dist"
          mkdir -p "$OUT/brand"
          cp packages/frontend/src/generated/brand.json packages/frontend/src/generated/theme.css packages/frontend/src/generated/logo.png "$OUT/brand/"
          cp packages/frontend/public/icons/favicon-32.png "$OUT/brand/favicon.png"

      # Name je Kompanie: Aus „Kompanien abgleichen“ laufen mehrere Kompanien im selben Workflow-Lauf.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-${{ steps.check.outputs.name }}
          path: out
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: veroeffentlichen
    # Zusätzlich zur Gruppe des Workflows: Nie zwei Veröffentlichungen derselben Kompanie gleichzeitig
    # (sonst könnten beide dieselbe Versionsnummer vergeben).
    concurrency:
      group: kompanie-publish-job-${{ inputs.repo }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: core
          persist-credentials: false

      - name: Stand des Kompanie-Repos prüfen
        env:
          SHA: ${{ needs.build.outputs.kompanie-sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Ungültiger Commit: $SHA"; exit 1; }'

      # Derselbe Stand wie im Build-Job, hier selbst geholt (kompanie.json kommt nicht aus dem Build-Ergebnis).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ needs.build.outputs.kompanie-sha }}
          path: kompanie
          fetch-depth: 0
          persist-credentials: false

      # Der Commit kommt aus dem Build-Job: Er muss zu main des Kompanie-Repos gehören (nicht z. B. zu einem Fork).
      - name: Commit gehört zu main
        env:
          SHA: ${{ needs.build.outputs.kompanie-sha }}
        run: git -C kompanie merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA gehört nicht zu main."; exit 1; }

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: sodium, zip, mbstring
          tools: none

      - name: Name des Kompanie-Repos
        id: name
        env:
          REPO: ${{ inputs.repo }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/untrusted

      - name: Build-Ergebnis prüfen und übernehmen (nur erlaubte Dateitypen)
        env:
          IN: ${{ runner.temp }}/untrusted
          OUT: ${{ runner.temp }}/checked
        run: |
          php core/scripts/import-build.php --from="$IN/dist" --to="$OUT/dist" --types=js,css,html,png,jpg,jpeg,webp,svg,ico,json,webmanifest,woff2,txt
          php core/scripts/import-build.php --from="$IN/brand" --to="$OUT/brand" --types=json,css,png --max-mb=2
          if [ -d "$IN/screenshots" ]; then php core/scripts/import-build.php --from="$IN/screenshots" --to="$OUT/screenshots" --types=png --max-mb=5; fi

      - name: Zugang zum Kompanie-Repo (GitHub App)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KOMPANIE_APP_ID }}
          private-key: ${{ secrets.KOMPANIE_APP_KEY }}
          owner: Steuten-IT-Solutions
          repositories: ${{ steps.name.outputs.name }}

      - name: Pakete bauen, signieren, Release, Update-Liste und Download-Seite
        env:
          KOMPANIE_SIGNING_KEY: ${{ secrets.KOMPANIE_SIGNING_KEY }}
          KOMPANIE_CORE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          KOMPANIE_SHA: ${{ needs.build.outputs.kompanie-sha }}
          CONFIG: ${{ github.workspace }}/kompanie/kompanie.json
          DIST: ${{ runner.temp }}/checked/dist
          BRAND: ${{ runner.temp }}/checked/brand
          SCREENSHOTS: ${{ runner.temp }}/checked/screenshots
          STATUS_URL: ${{ vars.KOMPANIE_STATUS_URL }}
          SUPPORT: ${{ vars.KOMPANIE_SUPPORT }}
        run: core/scripts/publish-release.sh

# Baut, signiert und veröffentlicht die App einer Kompanie. Läuft nur im Kern-Repo:
# - Job „bauen“ ohne Geheimnisse (npm, Playwright, Branding),
# - Job „veröffentlichen“ hinter der Environment „veroeffentlichen“ (Secrets KOMPANIE_SIGNING_KEY
#   und KOMPANIE_APP_KEY, Variable KOMPANIE_APP_ID; nur Branch main): ohne npm, prüft die Pakete
#   gegen release.json, signiert, legt das Release im Kompanie-Repo an und aktualisiert gh-pages.
# Angestoßen vom Kompanie-Repo nach einer Änderung (vorlage/.github/workflows/build.yml) oder von Hand.
name: Kompanie veröffentlichen

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Kompanie-Repo (Steuten-IT-Solutions/Name)
        type: string
        required: true
  workflow_call:
    inputs:
      repo:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: kompanie-publish-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      kompanie-sha: ${{ steps.version.outputs.kompanie-sha }}
      stable-core: ${{ steps.version.outputs.stable-core }}
    steps:
      - name: Eingabe prüfen
        env:
          REPO: ${{ inputs.repo }}
        run: |
          [[ "$REPO" =~ ^Steuten-IT-Solutions/[A-Za-z0-9._-]+$ ]] || { echo "::error::Ungültiges Kompanie-Repo: $REPO"; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: core
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repo }}
          ref: main
          path: kompanie
          persist-credentials: false

      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, gd, sodium, zip, mbstring, curl, openssl, simplexml, intl
          tools: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: App bauen
        working-directory: core
        env:
          KOMPANIE_CONFIG: ${{ github.workspace }}/kompanie/kompanie.json
          KOMPANIE_ASSETS: ${{ github.workspace }}/kompanie/assets
        run: scripts/build-frontend.sh

      - name: Version bestimmen
        id: version
        working-directory: core
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "kompanie-sha=$(git -C ../kompanie rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "stable-core=$(tr -d '[:space:]' < STABLE_CORE 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Bildschirmfotos
        working-directory: core
        env:
          KOMPANIE_CONFIG: ${{ github.workspace }}/kompanie/kompanie.json
        run: |
          npx playwright install --with-deps chromium
          scripts/screenshots.sh "${{ github.workspace }}/out/screenshots"

      - name: Pakete bauen (noch unsigniert)
        working-directory: core
        env:
          KOMPANIE_CORE_COMMIT: ${{ github.sha }}
        run: |
          php scripts/package.php --config="${{ github.workspace }}/kompanie/kompanie.json" \
            --version="${{ steps.version.outputs.version }}" --out="${{ github.workspace }}/out/release" --kompanie="${{ inputs.repo }}"
          mkdir -p "${{ github.workspace }}/out/brand"
          cp packages/frontend/src/generated/brand.json packages/frontend/src/generated/theme.css packages/frontend/src/generated/logo.png "${{ github.workspace }}/out/brand/"
          cp packages/frontend/public/icons/favicon-32.png "${{ github.workspace }}/out/brand/favicon.png"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: out
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: veroeffentlichen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: core
          persist-credentials: false

      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.2'
          extensions: sodium, zip, mbstring
          tools: none

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: out

      - name: Name des Kompanie-Repos
        id: name
        env:
          REPO: ${{ inputs.repo }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Zugang zum Kompanie-Repo (GitHub App)
        id: app
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.KOMPANIE_APP_ID }}
          private-key: ${{ secrets.KOMPANIE_APP_KEY }}
          owner: Steuten-IT-Solutions
          repositories: ${{ steps.name.outputs.name }}

      - name: Signieren
        env:
          KOMPANIE_SIGNING_KEY: ${{ secrets.KOMPANIE_SIGNING_KEY }}
        run: php core/scripts/sign-release.php --dir=out/release

      - name: Release, Update-Liste und Download-Seite
        env:
          KOMPANIE_SIGNING_KEY: ${{ secrets.KOMPANIE_SIGNING_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          VERSION: ${{ needs.build.outputs.version }}
          KOMPANIE_SHA: ${{ needs.build.outputs.kompanie-sha }}
          STABLE_CORE: ${{ needs.build.outputs.stable-core }}
          OUT: ${{ github.workspace }}/out
        run: core/scripts/publish-release.sh

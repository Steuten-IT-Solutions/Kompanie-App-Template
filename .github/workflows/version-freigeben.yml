# Eine getestete Version als stable markieren und für alle Kompanien freigeben (in einem Schritt):
# 1. Kern-Version und Code-Prüfsumme aus der signierten release.json der Version lesen.
# 2. Bei jeder Kompanie (Topic kompanie-app) die neueste Version mit genau diesem Programmcode freigeben
#    (wie „Versionen steuern“ → promote-checked); Kompanien ohne solche Version bleiben unverändert.
# 3. Den Programmcode in STABLE_CORE auf main eintragen: Spätere Versionen mit diesem Code gehen direkt nach stable.
# Hinter der Environment „veroeffentlichen“; starten dürfen nur Personen mit Schreibrecht auf das Kern-Repo.
name: Version freigeben

on:
  workflow_dispatch:
    inputs:
      version:
        description: Getestete Version, z. B. 0.1.0.4
        type: string
        required: true
      repo:
        description: Kompanie-Repo, auf dem die Version getestet wurde
        type: string
        required: true
        default: Steuten-IT-Solutions/marinekompanie-app

permissions:
  contents: read

concurrency:
  group: version-freigeben
  cancel-in-progress: false

jobs:
  pruefen:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.code.outputs.stable }}
      repos: ${{ steps.repos.outputs.repos }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: sodium, mbstring
          tools: none

      - name: Programmcode der Version bestimmen (signierte release.json)
        id: code
        env:
          REPO: ${{ inputs.repo }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$REPO" =~ ^Steuten-IT-Solutions/[A-Za-z0-9._-]+$ ]] || { echo "::error::Ungültiges Kompanie-Repo: $REPO"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,6}$ ]] || { echo "::error::Ungültige Version: $VERSION (z. B. 0.1.0.4)"; exit 1; }
          curl -fsSL --max-time 30 -o "$RUNNER_TEMP/release.json" "https://github.com/$REPO/releases/download/v$VERSION/release.json" \
            || { echo "::error::Version $VERSION von $REPO nicht gefunden (Release noch nicht veröffentlicht?)."; exit 1; }
          STABLE="$(php scripts/checked-core.php --release="$RUNNER_TEMP/release.json")"
          echo "Geprüfter Programmcode: $STABLE"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"

      - name: Kompanien bestimmen
        id: repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOS="$(gh search repos --owner Steuten-IT-Solutions --topic kompanie-app --visibility public --archived=false --limit 500 --json fullName --jq '.[].fullName')"
          JSON="$(printf '%s\n' "$REPOS" | { grep -E '^Steuten-IT-Solutions/[A-Za-z0-9._-]+$' || true; } | jq -R . | jq -cs .)"
          [ "$JSON" != '[]' ] || { echo "::error::Keine Kompanie gefunden."; exit 1; }
          echo "Kompanien: $JSON"
          echo "repos=$JSON" >> "$GITHUB_OUTPUT"

  freigeben:
    needs: pruefen
    runs-on: ubuntu-latest
    environment: veroeffentlichen
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJSON(needs.pruefen.outputs.repos) }}
    concurrency:
      group: kompanie-control-${{ matrix.repo }}-promote-checked-
      cancel-in-progress: false
    steps:
      - name: Name des Kompanie-Repos
        id: name
        env:
          REPO: ${{ matrix.repo }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: core
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: sodium, mbstring
          tools: none

      - name: Zugang zum Kompanie-Repo (GitHub App)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KOMPANIE_APP_ID }}
          private-key: ${{ secrets.KOMPANIE_APP_KEY }}
          owner: Steuten-IT-Solutions
          repositories: ${{ steps.name.outputs.name }}

      - name: Neueste Version mit diesem Programmcode freigeben
        env:
          KOMPANIE_SIGNING_KEY: ${{ secrets.KOMPANIE_SIGNING_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ matrix.repo }}
          ACTION: promote-checked
          VERSION: ''
          STABLE_CORE_VALUE: ${{ needs.pruefen.outputs.stable }}
        run: core/scripts/control-release.sh

  eintragen:
    needs: [pruefen, freigeben]
    if: ${{ !cancelled() && needs.pruefen.result == 'success' }}
    runs-on: ubuntu-latest
    environment: veroeffentlichen
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: STABLE_CORE auf main eintragen
        env:
          STABLE: ${{ needs.pruefen.outputs.stable }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$(cat STABLE_CORE 2> /dev/null)" = "$STABLE" ]; then
            echo "STABLE_CORE enthält schon $STABLE."
            exit 0
          fi
          echo "$STABLE" > STABLE_CORE
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(release): mark core ${STABLE%% *} of version $VERSION as checked" STABLE_CORE
          if ! git push --quiet origin HEAD:main; then
            echo "::warning::STABLE_CORE ließ sich nicht auf main schreiben (Branch-Schutz?). Die Freigabe ist trotzdem erfolgt. Bitte per Pull Request eintragen: $STABLE"
          fi

name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Dauert sonst unter 1 Minute. Ohne Grenze liefe ein hängender Schritt (z. B. ein E2E-Test, der auf den Testserver wartet)
    # bis zu 6 Stunden.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, pdo_mysql, gd, sodium, zip, mbstring
          tools: none

      - name: PHP-Syntax
        run: find packages adapters tests -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Kern ohne WordPress
        run: scripts/check-core-boundary.sh

      - name: Neutral, ohne Kompanie-spezifische Begriffe
        run: scripts/check-neutral.sh

      - name: Handbuch (Seiten, Platzhalter, Verweise, App und Webseite)
        run: tests/handbuch/run-tests.sh

      - name: Changelog (Aufbau, Prüfung zum Release, Ausgabe für die App)
        run: tests/changelog/run-tests.sh

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: OpenAPI und Konfigurationsschema
        run: |
          pip install --quiet openapi-spec-validator jsonschema
          python -m openapi_spec_validator api/openapi.yaml
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open('config/kompanie.schema.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.Draft202012Validator(schema).validate(json.load(open('config/kompanie.example.json')))
          print('kompanie.example.json passt zum Schema')
          PY

  php:
    runs-on: ubuntu-latest
    # Dauert sonst etwa 3 Minuten. Ohne Grenze liefe ein hängender Schritt (z. B. ein E2E-Test, der auf den Testserver wartet)
    # bis zu 6 Stunden.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kompanie_test
          MARIADB_USER: kompanie
          MARIADB_PASSWORD: kompanie
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, gd, sodium, zip, mbstring, intl
          tools: composer

      - name: Abhängigkeiten
        run: composer install --no-interaction --no-progress

      - name: Kern-Tests (SQLite und MariaDB)
        env:
          KOMPANIE_TEST_MYSQL: 127.0.0.1;kompanie_test;kompanie;kompanie
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    # Dauert sonst etwa 1 Minute. Ohne Grenze liefe ein hängender Schritt (z. B. ein E2E-Test, der auf den Testserver wartet)
    # bis zu 6 Stunden.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Der Build übernimmt das Handbuch (scripts/handbuch.php) in die App.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          tools: composer

      # PHPMailer (Issue #172): Der Build nimmt den Lizenztext aus vendor/ in die Drittanbieter-Hinweise (Issue #173).
      - name: PHP-Abhängigkeiten (PHPMailer)
        run: composer install --no-dev --no-interaction --no-progress

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Formatierung (Prettier)
        run: npm run format:check

      - name: Formulare „Neue Kompanie“ / „Kompanie ändern“ (Issue → kompanie.json)
        run: tests/formular/run-tests.sh

      - name: Branding-Tests (Farben, Kontrast, Icons, Konfiguration)
        run: npm run test:branding

      - name: Frontend-Tests (Service Worker, Zwischenspeicher)
        run: npm run test:frontend

      - name: Frontend bauen (inkl. TypeScript-Prüfung)
        run: npm run build

  wordpress:
    runs-on: ubuntu-latest
    # Dauert sonst etwa 8 bis 18 Minuten. Ohne Grenze liefe ein hängender Schritt (z. B. ein E2E-Test, der auf den Testserver wartet)
    # bis zu 6 Stunden.
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kompanie_wp
          MARIADB_USER: kompanie
          MARIADB_PASSWORD: kompanie
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pdo_mysql, mysqli, gd, sodium, zip, mbstring
          tools: composer

      - name: Test-WordPress mit MariaDB
        env:
          KOMPANIE_WP_DB_HOST: 127.0.0.1
          KOMPANIE_WP_DB_NAME: kompanie_wp
          KOMPANIE_WP_DB_USER: kompanie
          KOMPANIE_WP_DB_PASS: kompanie
        run: scripts/setup-test-wp.sh .wp-test

      - name: WordPress-Tests (API-Szenario und Plugin)
        run: php .wp-test/wp-cli.phar --allow-root --path=.wp-test/wp eval-file tests/wordpress/run-tests.php

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # PHPMailer (Issue #172): Der Build nimmt den Lizenztext aus vendor/ in die Drittanbieter-Hinweise (Issue #173).
      - name: PHP-Abhängigkeiten (PHPMailer)
        run: composer install --no-dev --no-interaction --no-progress

      - name: Frontend bauen und ins Plugin legen
        run: scripts/build-frontend.sh

      - name: E2E-Tests (Playwright)
        env:
          KOMPANIE_WP_CLI: php .wp-test/wp-cli.phar --allow-root --path=.wp-test/wp
          KOMPANIE_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          mkdir -p screenshots
          npx playwright install --with-deps chromium
          (PHP_CLI_SERVER_WORKERS=4 php -S localhost:8888 -t .wp-test/wp .wp-test/router.php > /tmp/php-server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8888/wp-login.php && break; sleep 1; done
          cd packages/frontend && npx playwright test --reporter=line

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      # Traces und Fehlerkontext fehlgeschlagener E2E-Tests (Issue #68): ansehen mit `npx playwright show-trace`.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: e2e-test-results-wordpress
          path: packages/frontend/test-results
          if-no-files-found: ignore

  standalone:
    runs-on: ubuntu-latest
    # Dauert sonst etwa 10 Minuten. Ohne Grenze liefe ein hängender Schritt (z. B. ein E2E-Test, der auf den Testserver wartet)
    # bis zu 6 Stunden.
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kompanie_test
          MARIADB_USER: kompanie
          MARIADB_PASSWORD: kompanie
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Niedrigste unterstützte PHP-Version, wie auf älteren Webspaces.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, pdo_mysql, gd, sodium, zip, mbstring, curl, openssl, simplexml
          tools: composer

      # PHPMailer (Issue #172): kommt mit composer install aus composer.lock und ins Paket der eigenständigen Version.
      - name: PHP-Abhängigkeiten (PHPMailer)
        run: composer install --no-dev --no-interaction --no-progress

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Frontend bauen und in die eigenständige Version legen
        run: scripts/build-frontend.sh

      - name: HTTP-Tests mit SQLite (API-Szenario, Anmeldung, CSRF, Sicherung)
        run: php tests/standalone/run-tests.php

      - name: HTTP-Tests mit MariaDB
        run: php tests/standalone/run-tests.php --mysql='127.0.0.1;kompanie_test;kompanie;kompanie'

      - name: E2E-Tests (Playwright, Installation im Unterordner /app/)
        run: |
          npx playwright install --with-deps chromium
          scripts/e2e-standalone.sh --reporter=line

      - name: Release-Ablauf (Pakete, Signatur, Update-Liste, Download-Seite, Paket starten)
        run: tests/release/run-tests.sh

      - name: Installer und Updates (install.php, Update, Zurückrollen, Zurückziehen, Reparatur)
        run: tests/update/run-tests.sh

      - name: Bildschirmfotos
        run: scripts/screenshots.sh screenshots-standalone

      # Jede Anleitung im Handbuch bekommt ihre Bildschirmfotos (fehlt eines, wird der Schritt rot).
      - name: Bilder für das Handbuch
        run: scripts/handbuch-bilder.sh handbuch-bilder

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: handbuch-bilder
          path: handbuch-bilder
          if-no-files-found: ignore

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: screenshots-standalone
          path: screenshots-standalone
          if-no-files-found: ignore

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: e2e-test-results-standalone
          path: packages/frontend/test-results
          if-no-files-found: ignore

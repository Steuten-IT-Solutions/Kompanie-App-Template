# Eine Kern-Version für alle Kompanien freigeben (nach dem Test auf einer Installation):
# 1. Programmcode des Kerns auf main bestimmen (Kern-Version aus VERSION, Prüfsumme wie beim Veröffentlichen).
# 2. Bei jeder Kompanie (Topic kompanie-app) die neueste Version mit genau diesem Programmcode freigeben;
#    Kompanien ohne solche Version bleiben vorerst unverändert.
# 3. Den Programmcode in STABLE_CORE auf main eintragen und „Kompanien abgleichen“ starten: Kompanien, die noch
#    keine Version mit diesem Code haben, bekommen sie dabei gebaut und direkt als stable veröffentlicht.
# Hinter der Environment „veroeffentlichen“; starten dürfen nur Personen mit Schreibrecht auf das Kern-Repo.
name: Kernversion freigeben

on:
  workflow_dispatch:
    inputs:
      kern:
        description: Kern-Version zur Bestätigung, z. B. 0.1.0 (muss der Datei VERSION auf main entsprechen)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: kern-freigeben
  cancel-in-progress: false

jobs:
  pruefen:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.code.outputs.stable }}
      repos: ${{ steps.repos.outputs.repos }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: sodium, mbstring
          tools: none

      - name: Programmcode des Kerns bestimmen
        id: code
        env:
          KERN: ${{ inputs.kern }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [ "$KERN" = "$VERSION" ] || { echo "::error::Auf main ist Kern-Version $VERSION, eingegeben wurde „$KERN“. Bitte die Kern-Version aus der Datei VERSION eintragen."; exit 1; }
          STABLE="$VERSION $(php scripts/package.php --code-hash)"
          echo "Programmcode: $STABLE (main, $(git rev-parse --short HEAD))"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"

      - name: Kompanien bestimmen
        id: repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOS="$(gh search repos --owner Steuten-IT-Solutions --topic kompanie-app --visibility public --archived=false --limit 500 --json fullName --jq '.[].fullName')"
          JSON="$(printf '%s\n' "$REPOS" | { grep -E '^Steuten-IT-Solutions/[A-Za-z0-9._-]+$' || true; } | jq -R . | jq -cs .)"
          [ "$JSON" != '[]' ] || { echo "::error::Keine Kompanie gefunden."; exit 1; }
          echo "Kompanien: $JSON"
          echo "repos=$JSON" >> "$GITHUB_OUTPUT"

  freigeben:
    needs: pruefen
    runs-on: ubuntu-latest
    environment: veroeffentlichen
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJSON(needs.pruefen.outputs.repos) }}
    concurrency:
      group: kompanie-control-${{ matrix.repo }}-promote-checked-
      cancel-in-progress: false
    steps:
      - name: Name des Kompanie-Repos
        id: name
        env:
          REPO: ${{ matrix.repo }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: core
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: sodium, mbstring
          tools: none

      - name: Zugang zum Kompanie-Repo (GitHub App)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KOMPANIE_APP_ID }}
          private-key: ${{ secrets.KOMPANIE_APP_KEY }}
          owner: Steuten-IT-Solutions
          repositories: ${{ steps.name.outputs.name }}

      - name: Neueste Version mit diesem Programmcode freigeben
        env:
          KOMPANIE_SIGNING_KEY: ${{ secrets.KOMPANIE_SIGNING_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ matrix.repo }}
          ACTION: promote-checked
          VERSION: ''
          STABLE_CORE_VALUE: ${{ needs.pruefen.outputs.stable }}
        run: core/scripts/control-release.sh

  eintragen:
    needs: [pruefen, freigeben]
    if: ${{ !cancelled() && needs.pruefen.result == 'success' }}
    runs-on: ubuntu-latest
    environment: veroeffentlichen
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: STABLE_CORE auf main eintragen
        id: eintragen
        env:
          STABLE: ${{ needs.pruefen.outputs.stable }}
        run: |
          if [ "$(cat STABLE_CORE 2> /dev/null)" = "$STABLE" ]; then
            echo "STABLE_CORE enthält schon $STABLE."
            exit 0
          fi
          echo "$STABLE" > STABLE_CORE
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(release): mark core ${STABLE%% *} as checked" STABLE_CORE
          if ! git push --quiet origin HEAD:main; then
            echo "::warning::STABLE_CORE ließ sich nicht auf main schreiben (Branch-Schutz?). Vorhandene Versionen sind freigegeben; damit neue Versionen mit diesem Code direkt stable werden, STABLE_CORE per Pull Request eintragen: $STABLE"
          fi

      - name: „Kompanien abgleichen“ starten (Kompanien ohne Version mit diesem Code)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kompanien-abgleichen.yml --ref main

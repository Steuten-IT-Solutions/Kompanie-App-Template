# Eine Version für alle freigeben oder zurückziehen (Actions → Versionen steuern → Run workflow).
# Zurückgezogene Versionen spielen die Installationen automatisch auf die vorige Version zurück.
name: Versionen steuern

on:
  workflow_dispatch:
    inputs:
      action:
        description: Was soll passieren?
        type: choice
        options: [promote, withdraw]
      version:
        description: Version, z. B. 1.4.0.3
        type: string
        required: true

permissions:
  contents: write

jobs:
  control:
    uses: Steuten-IT-Solutions/Kompanie-App-Template/.github/workflows/release-control.yml@v1
    with:
      action: ${{ inputs.action }}
      version: ${{ inputs.version }}
    secrets: inherit

  /board:
    get:
      tags: [Schwarzes Brett]
      summary: Gültige Einträge am Schwarzen Brett, neueste zuerst (Issue #5)
      description: |
        Für Mitglieder und Anwärter (Recht `member` oder `calendar`) sowie für alle mit `post_board`. Nur Einträge, deren
        `expires_at` noch nicht erreicht ist; abgelaufene löscht die Hintergrundaufgabe `board_cleanup` (kein Verlauf).
        Die App blendet Einträge anhand von `expires_at` auch selbst aus (offline aus dem Speicher).
        Erst die Nachrichten (`kind: message`), neueste zuerst; danach für Mitglieder (Recht `member`) mit eingeschaltetem
        Bereich Umfragen jede laufende Umfrage (`kind: poll`, Issue #4) mit `has_voted`. Später können weitere Arten
        dazukommen – Clients überspringen unbekannte.
      x-capability: 'member, calendar oder post_board'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/BoardItem'
                        - $ref: '#/components/schemas/BoardPollItem'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Schwarzes Brett]
      summary: Nachricht ans Schwarze Brett schreiben
      description: |
        Gültig genau 24 Stunden ab jetzt. Alle Mitglieder und Anwärter außer dem Verfasser bekommen eine Benachrichtigung
        (Art `board`, Urgency high, TTL höchstens bis `expires_at`), sofern sie die Art für das Gerät eingeschaltet haben.
      x-capability: post_board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardInput' }
      responses:
        '201':
          description: Veröffentlicht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /board/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Schwarzes Brett]
      summary: Text einer gültigen Nachricht ändern
      description: |
        Jede und jeder mit `post_board`, nicht nur der Verfasser. Ohne neue Benachrichtigung; `expires_at` bleibt.
        `updated_at` wechselt nur, wenn sich der Text ändert (auf Geräten ausgeblendete Nachrichten erscheinen dann
        wieder). Abgelaufene oder gelöschte Nachrichten → 404.
      x-capability: post_board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardItem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Schwarzes Brett]
      summary: Nachricht vorzeitig löschen
      x-capability: post_board
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /birthdays:
    get:
      tags: [Geburtstage]
      summary: Geburtstage der Mitglieder, ab heute sortiert (Issue #1)
      description: |
        Nur für Mitglieder (Recht `member`; Gäste und Anwärter → 403) und nur die Geburtstage von Mitgliedern, die
        „Anderen Mitgliedern zeigen“ eingeschaltet haben. Sortiert nach `days_until` (heute = 0, „heute“ in der Zeitzone
        der Kompanie), dann Name. Das Geburtsjahr steht nie in der Antwort; `age` nur mit Jahr und „Alter anzeigen“.
        Der 29.02. gilt in Jahren ohne Schalttag am 28.02.
      x-capability: member
      parameters:
        - name: days
          in: query
          required: false
          description: 'Nur die nächsten N Tage (0–366), heute eingeschlossen; die App fragt `days=7` (heute und die nächsten 7 Tage).'
          schema: { type: integer, minimum: 0, maximum: 366 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BirthdayEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /polls:
    get:
      tags: [Umfragen]
      summary: Alle Umfragen (laufende und beendete), neueste zuerst (Issue #4)
      description: |
        Für Mitglieder (Recht `member`; Anwärter nicht) und alle mit `manage_polls`. Je Umfrage `has_voted`, die eigene
        Antwort (`my_answer`) und die Ergebnisse (`results_data`), soweit sie für dieses Konto sichtbar sind:
        `after_vote` – wer geantwortet hat, nach dem Ende alle Mitglieder; `after_end` – alle Mitglieder nach dem Ende;
        `managers` – nur `manage_polls`. Wer `manage_polls` hat, sieht die Ergebnisse immer. Namen je Möglichkeit bzw. je
        Freitext nur bei namentlichen Umfragen; bei anonymen nie Namen oder Benutzer-IDs (Freitexte alphabetisch).
      x-capability: 'member oder manage_polls'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Poll' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Umfragen]
      summary: Umfrage anlegen
      description: |
        Alle Mitglieder außer dem, der sie anlegt, bekommen eine Benachrichtigung (Art `polls`, TTL höchstens bis zum Ende).
        Endet die Umfrage in weniger als 24 Stunden, gibt es keine zusätzliche Erinnerung.
      x-capability: manage_polls
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PollInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /polls/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Umfragen]
      summary: Eine Umfrage (wie in der Liste)
      x-capability: 'member oder manage_polls'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Umfragen]
      summary: Laufende Umfrage ändern
      description: |
        Jede und jeder mit `manage_polls`. Nur genannte Felder ändern sich. Frage, Beschreibung und Ende jederzeit, solange
        die Umfrage läuft; `type`, `options`, `anonymous` und `results` nur bis zur ersten Antwort (danach → 400, außer
        der Wert bleibt gleich). Beendete Umfragen → 400 (wieder öffnen geht nicht). `updated_at` wechselt nur bei einer
        echten Änderung (am Brett ausgeblendete Umfragen erscheinen dann wieder). Ein neues Ende mehr als 24 Stunden in
        der Zukunft macht eine neue Erinnerung möglich. Keine Benachrichtigung.
      x-capability: manage_polls
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PollPatch' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Umfragen]
      summary: Umfrage mit allen Antworten löschen
      x-capability: manage_polls
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object

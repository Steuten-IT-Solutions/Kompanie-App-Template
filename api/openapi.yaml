    put:
      tags: [Verwaltung]
      summary: Liste anlegen oder ändern und Status setzen
      description: |
        Mit `id` eine vorhandene Liste (bei freien Listen auch Titel und Datum). Ohne `id` neu: `source: calendar` mit
        `event_key` (gibt es schon eine Liste zu diesem Termin, wird sie genommen, 200) oder `source: free` mit `title` und
        `date`. Titel und Datum sind eine Momentaufnahme. `entries` setzt den Status je Person (null entfernt ihn);
        nur Personen mit einer Rolle (keine Gäste).
      x-capability: manage_attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:

                  id: { type: integer }
                  level: { $ref: '#/components/schemas/Level' }
                  extra_roles:
                    type: array
                    items: { $ref: '#/components/schemas/Level' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }


                catalog_id: { type: integer }
                reason: { type: string, description: 'Ohne Angabe: Titel des Katalogeintrags.' }
                date: { type: string, format: date }
                attendance_id: { type: integer, description: 'Aus dem Vorschlag einer Anwesenheitsliste (Issue #21): bucht nur für, wer für diese Liste noch keine Punkte hat; sonst 400' }
                apply_factor:
                  type: boolean
                  default: true
                  description: Punktefaktor der Rolle anwenden (z. B. 0,5). false bucht für alle mit Faktor 1.
      responses:

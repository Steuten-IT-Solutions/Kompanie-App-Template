      summary: Eintrag löschen
      description: |
        Weich gelöscht: Der Eintrag fehlt danach in der Liste, sein Verlauf bleibt lesbar. Verlauf: ein Eintrag `delete`.
        Optional `reason` im Inhalt (oder als Query-Parameter).
      x-capability: manage_inventory
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object

        '404': { $ref: '#/components/responses/Error' }

  /users:
    post:
      tags: [Verwaltung]
      summary: Mitglied oder Anwärter anlegen
      description: Erzeugt ein zufälliges Startpasswort, das nur in dieser Antwort steht. Es wird keine E-Mail verschickt.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                username: { type: string, description: 'Optional; erlaubt sind a–z, Ziffern, . _ - @' }
                email: { type: string, format: email }
                level: { type: string, enum: [member, candidate], default: member }
                initial_points: { type: integer, minimum: 0, description: 'Anfangsbestand (nur Mitglieder, Bereich Punkte und Recht manage_points)' }
                initial_points_date: { type: string, format: date, description: Datum der Buchung (Standard heute) }
                rank_id: { type: integer, description: 'Dienstgrad (Bereich Dienstgrade, Recht manage_ranks); mit Punkten muss der Anfangsbestand die Schwelle erreichen' }
                birthday: { $ref: '#/components/schemas/BirthdayString' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUser' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /users/bulk:
    post:
      tags: [Verwaltung]
      summary: Mehrere Mitglieder bzw. Anwärter auf einmal anlegen (Issue #24)
      description: |
        Höchstens 50. Erst werden alle Einträge geprüft (Namen, Benutzernamen und E-Mail auch untereinander,
        Anfangspunkte, Dienstgrad); bei einem Fehler wird keiner angelegt, die Meldung nennt die Zeile. Scheitert danach
        doch eines, steht es mit `error` im Ergebnis.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                level: { type: string, enum: [member, candidate], default: member }
                people:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      username: { type: string }
                      email: { type: string, format: email }
                      initial_points: { type: integer, minimum: 0 }
                      initial_points_date: { type: string, format: date }
                      rank_id: { type: integer }
                      birthday: { $ref: '#/components/schemas/BirthdayString' }
      responses:
        '201':
          description: Ergebnis je Person (angelegt mit Startpasswort oder mit Grund nicht)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/CreatedUser'
                    - type: object
                      properties:
                        name: { type: string }
                        username: { type: string }
                        error: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /points:
    post:
      tags: [Verwaltung]
      summary: Punkte an ein oder mehrere Mitglieder vergeben
      x-capability: manage_points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                points: { type: integer, description: 'Ohne Angabe: Punkte des Katalogeintrags. Nicht 0.' }
                catalog_id: { type: integer }
                reason: { type: string, description: 'Ohne Angabe: Titel des Katalogeintrags.' }
                date: { type: string, format: date }
                attendance_id: { type: integer, description: 'Aus dem Vorschlag einer Anwesenheitsliste (Issue #21): bucht nur für, wer für diese Liste noch keine Punkte hat; sonst 400' }
                apply_factor:
                  type: boolean
                  default: true
                  description: Punktefaktor der Rolle anwenden (z. B. 0,5). false bucht für alle mit Faktor 1.
      responses:
        '201':
          description: Angelegt (ein Eintrag pro Mitglied)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /points/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Verwaltung]
      summary: Punkte stornieren (wird nur ausgeblendet)
      x-capability: manage_points
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /penalties:
    post:
      tags: [Verwaltung]
      summary: Strafe an ein oder mehrere Mitglieder vergeben
      x-capability: manage_penalties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, amount_cents, reason]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                amount_cents: { type: integer, minimum: 1, maximum: 100000 }
                reason: { type: string }
                date: { type: string, format: date }
      responses:
        '201':
          description: Angelegt (eine Strafe pro Mitglied)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Penalty' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /penalties/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Strafe als bezahlt/offen markieren
      x-capability: manage_penalties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, paid] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Penalty' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Strafe stornieren (wird nur ausgeblendet)
      x-capability: manage_penalties
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/roles:
    get:
      tags: [Einstellungen]
      summary: Rollen mit Rechten, Punktefaktor und Anzahl der Personen
      description: |
        Jede Person hat genau eine Rolle. Fest sind Gast, Mitglied (Rolle neuer Konten) und Admin (nur umbenennen;
        Bezeichnungen bei der Ersteinrichtung aus `kompanie.json`). Schaltet der Admin einen Bereich mit eigenen Rechten ein
        (Termine, Punkte, Strafen), kommt dessen Standardrolle dazu; schaltet er ihn aus, verschwindet sie, wenn niemand sie hat.
        Wer Rollen vergeben darf, ohne Admin zu sein, vergibt nur Rollen mit eigenen Rechten, ohne `create_users` und `promote_users`.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Einstellungen]
      summary: Rolle anlegen
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/roles/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { $ref: '#/components/schemas/Level' } }
    patch:
      tags: [Einstellungen]
      summary: Rolle umbenennen, Rechte oder Punktefaktor ändern (nur mitgeschickte Felder)
      description: Bei guest und admin nur die Bezeichnung, bei member Bezeichnung und Punktefaktor. Ein geänderter Faktor gilt für künftige Buchungen.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Einstellungen]
      summary: Rolle löschen
      description: Sind der Rolle noch Personen zugeordnet, bekommen sie `replacement`; ohne Angabe → 400.
      x-capability: manage_settings
      parameters:
        - { name: replacement, in: query, required: false, schema: { $ref: '#/components/schemas/Level' } }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/features:
    get:
      tags: [Einstellungen]
      summary: Bereiche der App mit Schalter, Bezeichnung und Einrichtungsstand
      description: |
        Welche Bereiche eine Kompanie nutzt, entscheidet allein ihr Admin (Ersteinrichtung bzw. Einstellungen → Bereiche).
        Neue Installationen starten ohne Bereiche. Ein ausgeschalteter Bereich verschwindet aus der App, seine Routen
        antworten mit 403 `feature_disabled`, seine Hintergrundaufgaben laufen nicht; die Daten bleiben erhalten.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Einstellungen]
      summary: Bereiche ein- und ausschalten
      description: Nur mitgeschickte Bereiche werden geändert. Unbekannte Bereiche oder Werte, die kein Wahrheitswert sind → 400.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
              example: { gallery: true, penalties: false }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/maintenance:
    get:
      tags: [Einstellungen]
      summary: Wartungsmodus mit Verlauf
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Einstellungen]
      summary: Wartungsmodus ein- oder ausschalten, Begründung ändern
      description: |
        Issue #42. Solange er an ist, antworten alle Routen außer `/config`, `/auth/login`, `/auth/logout` und
        `/auth/csrf` für alle ohne `manage_settings` mit 503 `maintenance` (samt `reason`), ebenso geschützte Fotos
        und Dokumente. Hintergrundaufgaben außer Updates und Statusmeldungen pausieren. Jede Änderung kommt in den Verlauf.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['on']
              properties:
                'on': { type: boolean }
                reason: { type: string, maxLength: 500, description: 'Klartext, Zeilenumbrüche bleiben; ohne Angabe bleibt die bisherige Begründung' }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/settings:
    get:
      tags: [Einstellungen]
      summary: Einstellungen für Kalender, Galerie und Neuigkeiten
      description: Geheime Werte (iCal-Adresse, API-Schlüssel, Dienstkonto) werden nie zurückgegeben, nur ob sie gesetzt sind.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Einstellungen]
      summary: Einstellungen ändern
      description: Nur mitgeschickte Felder werden übernommen; ein leerer Text löscht den Wert.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                calendar_ics_url: { type: string, description: 'Geheime iCal-Adresse; webcal:// wird als https:// gespeichert' }
                google_api_key: { type: string }
                calendar_ids: { type: string, description: Kommagetrennte Kalender-IDs (nur mit API-Schlüssel) }
                calendar_cache_minutes: { type: integer, minimum: 1, maximum: 1440 }
                drive_service_account: { type: string, description: JSON-Schlüssel des Dienstkontos }
                drive_oauth: { type: string, enum: [''], description: Leer trennt eine bestehende OAuth-Verbindung zu Google (etwa aus einer Übernahme) }
                gallery_root: { type: string, description: Link oder ID des Galerie-Ordners in Google Drive }
                news_source: { type: string, enum: [none, wordpress, rss], description: Nur eigenständige Version }
                news_url: { type: string, description: Nur eigenständige Version }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/calendar/test:
    post:
      tags: [Einstellungen]
      summary: Kalender ohne Zwischenspeicher abrufen
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, sample]
                properties:
                  count: { type: integer }
                  sample:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      properties:
                        start: { type: string }
                        title: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/news/test:
    post:
      tags: [Einstellungen]
      summary: Quelle der Neuigkeiten ohne Zwischenspeicher abrufen (nur eigenständige Version)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, description: Beiträge auf der ersten Seite }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/gallery/sync:
    post:
      tags: [Einstellungen]
      summary: Galerie von Hand abgleichen und Bilder aufbereiten
      description: |
        Gleicht mit Google Drive ab und bereitet Bilder auf, solange das Zeitbudget reicht (etwa 20 Sekunden).
        Steht danach noch etwas aus (`pending` > 0), ruft die App mit `only_process: true` erneut auf.
      x-capability: manage_settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                only_process: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums: { type: integer }
                  photos: { type: integer }
                  processed: { type: integer }
                  pending: { type: integer }
                  failed: { type: integer, description: Bilder, die sich nicht laden ließen (werden beim nächsten Abgleich erneut versucht) }
                  error: { type: string, description: Fehler des Abgleichs, sonst leer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/push:
    get:
      tags: [Einstellungen]
      summary: Stand der Benachrichtigungen (Geräte, Warteschlange, Uhrzeit der Erinnerung)
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/PushAdmin' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Einstellungen]
      summary: Uhrzeit der Erinnerung an Termine am nächsten Tag ändern
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reminder_hour: { type: integer, minimum: 0, maximum: 23 }
      responses:
        '200': { $ref: '#/components/responses/PushAdmin' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/status:
    get:
      tags: [Wartung]
      summary: Zustand der Installation (Ampel), Updates, Statusmeldungen
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, support, updates, statusReports, setupDone]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, label, level, text]
                      properties:
                        key: { type: string, description: 'z. B. updates, gallery, calendar, backup, server' }
                        label: { type: string }
                        level: { type: string, enum: [ok, warn, error, off] }
                        text: { type: string }
                  support: { type: string, description: Kontakt für Hilfe (E-Mail oder Webadresse), sonst leer }
                  updates: { $ref: '#/components/schemas/UpdateStatus' }
                  statusReports:
                    type: object
                    properties:
                      enabled: { type: boolean, description: Der Admin hat Statusmeldungen zugestimmt }
                      available: { type: boolean, description: Das Paket nennt einen Empfänger }
                      payload: { type: object, description: 'Genau das, was gesendet würde (ohne Namen oder Inhalte)' }
                  setupDone: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/update/check:
    post:
      tags: [Wartung]
      summary: Update-Liste jetzt laden und prüfen (Signatur, Kompanie, laufende Nummer)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update/install:
    post:
      tags: [Wartung]
      summary: Eine Version aus der geprüften Liste einspielen
      description: |
        Vorher wird bei Datenbank-Änderungen und vor einer neuen Hauptversion automatisch gesichert. Eine neue
        Hauptversion nur mit `major` true. Im Kanal stable nur schon freigegebene Versionen. 409, wenn gerade
        schon ein Update läuft.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: 1.4.0.3 }
                major: { type: boolean, default: false }
      responses:
        '200':
          description: Eingespielt
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update/rollback:
    post:
      tags: [Wartung]
      summary: Auf eine ältere Version derselben Hauptversion zurück
      description: Die bisherige Version wird danach beim automatischen Update übersprungen, bis eine neuere erscheint.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
      responses:
        '200':
          description: Eingespielt
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update:
    patch:
      tags: [Wartung]
      summary: Automatische Updates und Statusmeldungen ein- oder ausschalten
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto: { type: boolean }
                status_reports: { type: boolean, description: Zustimmung zu täglichen Statusmeldungen }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/backup:
    get:
      tags: [Wartung]
      summary: Datensicherung herunterladen
      description: |
        Gemeinsames Format `kompanie-app-backup` (Tabellen und Einstellungen; eigenständige Version
        auch Konten mit Passwort-Hashes). Enthält Zugangsschlüssel – sicher aufbewahren.
      x-capability: manage_settings
      responses:
        '200':
          description: Sicherung (mit Content-Disposition attachment)
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Wartung]
      summary: Sicherung wiederherstellen (ersetzt alle Daten)
      description: |
        Eigenständige Version: nur Sicherungen der eigenständigen Version mit mindestens einem Admin;
        alle Sitzungen enden. WordPress: nur Sicherungen derselben Website.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup, confirm]
              properties:
                backup: { type: string, description: Inhalt der Sicherungsdatei }
                confirm: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Wiederhergestellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/setup/done:
    post:
      tags: [Wartung]
      summary: Einrichtungsassistent abschließen (setupPending wird danach false)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  done: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

security:
  - session: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Name und Inhalt des Cookies hängen vom Adapter ab (WordPress-Anmelde-Cookie bzw. eigene Sitzung).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    InventoryLogLimit:
      name: limit
      in: query
      required: false
      description: Höchstens so viele Einträge (Standard 100).
      schema: { type: integer, minimum: 1, maximum: 500 }
    InventoryLogBefore:
      name: before
      in: query
      required: false
      description: Nur Einträge mit kleinerer ID (nächste Seite).
      schema: { type: integer, minimum: 1 }

  responses:
    PushStatus:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [supported, publicKey, types, subscription]
            properties:
              supported: { type: boolean }
              publicKey: { type: string }
              types:
                type: array
                description: Arten, die dieser Anfragende abonnieren kann (nach Bereichen und Rechten)
                items:
                  type: object
                  required: [key, label]
                  properties:
                    key: { $ref: '#/components/schemas/PushType' }
                    label: { type: string }
              subscription:
                oneOf:
                  - type: 'null'
                  - $ref: '#/components/schemas/PushSubscriptionInfo'
    PushSubscription:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PushSubscriptionInfo' }
    PushTest:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              sent: { type: boolean }
    PushAdmin:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [supported, missing, devices, accounts, guests, queued, reminderHour]
            properties:
              supported: { type: boolean }
              missing: { type: array, items: { type: string }, description: Fehlende PHP-Voraussetzungen }
              devices: { type: integer }
              accounts: { type: integer }
              guests: { type: integer }
              queued: { type: integer, description: Nachrichten in der Warteschlange }
              reminderHour: { type: integer, minimum: 0, maximum: 23 }
    Error:
      description: Fehler
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountProfile:
      description: Angaben eines Kontos
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              login: { type: string }
              email: { type: string }
              can_change_login: { type: boolean, description: 'false bei WordPress' }
    AttendanceGroups:
      description: Je Rolle (ohne Gast), als welche sie im Zähler zählt
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                key: { type: string }
                label: { type: string }
                counts_as: { type: [string, 'null'], description: null = eigene Gruppe }
    Deleted:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean }

  schemas:
    InventoryItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        quantity: { type: number, minimum: 0, description: 'Bis zu drei Nachkommastellen' }
        unit: { type: [string, 'null'] }
        location: { type: string }
        category: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        created_by_name: { type: [string, 'null'], description: '„gelöschtes Konto“, wenn es das Konto nicht mehr gibt' }
        created_at: { type: string, format: date-time }
        updated_by_name: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
    InventoryInput:
      type: object
      required: [title, location]
      properties:
        title: { type: string, maxLength: 100 }
        quantity:
          description: 0 oder mehr, höchstens drei Nachkommastellen; Zahl oder Text mit Komma oder Punkt.
          oneOf:
            - { type: number, minimum: 0 }
            - { type: string }
        location: { type: string, maxLength: 100 }
        unit: { type: [string, 'null'], maxLength: 20 }
        category: { type: [string, 'null'], maxLength: 100 }
        note: { type: [string, 'null'], maxLength: 1000 }
        reason: { type: [string, 'null'], maxLength: 255, description: Steht im Verlauf. }
    InventoryPatch:
      type: object
      properties:
        title: { type: string, maxLength: 100 }
        quantity:
          oneOf:
            - { type: number, minimum: 0 }
            - { type: string }
        adjust:
          description: Änderung der Menge, z. B. 1 oder -1 (nicht zusammen mit quantity).
          oneOf:
            - { type: number }
            - { type: string }
        location: { type: string, maxLength: 100 }
        unit: { type: [string, 'null'], maxLength: 20 }
        category: { type: [string, 'null'], maxLength: 100 }
        note: { type: [string, 'null'], maxLength: 1000 }
        reason: { type: [string, 'null'], maxLength: 255 }
    InventoryLogEntry:
      type: object
      properties:
        id: { type: integer }
        item_id: { type: integer }
        action: { type: string, enum: [create, update, move, delete] }
        changes:
          type: object
          description: |
            Feld => {old, new} für jedes geänderte Feld (title, quantity, unit, location, category, note; Mengen als Zahl,
            leere Texte als ""). Beim Umlagern zusätzlich `move` = {from, to, quantity, source_id, target_id, source_removed?}.
          additionalProperties: true
        reason: { type: [string, 'null'] }
        title: { type: string, description: Bezeichnung zum Zeitpunkt der Änderung }
        unit: { type: [string, 'null'], description: Einheit zum Zeitpunkt der Änderung }
        location: { type: string, description: Ort zum Zeitpunkt der Änderung }
        user_id: { type: integer }
        user_name: { type: [string, 'null'], description: '„gelöschtes Konto“, wenn es das Konto nicht mehr gibt' }
        created_at: { type: string, format: date-time }
    BoardInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 500
          description: Reiner Text, Zeilenumbrüche bleiben; HTML-Tags werden entfernt. Leer oder länger als 500 Zeichen → 400.
    BoardItem:
      type: object
      required: [kind, id, text, author_name, created_at, updated_at, expires_at]
      properties:
        kind: { type: string, enum: [message], description: 'Art des Eintrags; weitere können dazukommen' }
        id: { type: integer }
        text: { type: string, description: Reiner Text mit Zeilenumbrüchen }
        author_name: { type: [string, 'null'], description: '„gelöschtes Konto“, wenn das Konto des Verfassers gelöscht wurde' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Genau 24 Stunden nach created_at }
    BoardPollItem:
      type: object
      description: Laufende Umfrage am Schwarzen Brett (Issue #4), nur für Mitglieder
      required: [kind, id, title, type, ends_at, expires_at, has_voted, created_at, updated_at]
      properties:
        kind: { type: string, enum: [poll] }
        id: { type: integer }
        title: { type: string }
        type: { type: string, enum: [single, multiple, text] }
        ends_at: { type: [string, 'null'], format: date-time, description: 'null = läuft, bis sie vorzeitig beendet wird' }
        expires_at: { type: [string, 'null'], format: date-time, description: Wie ends_at (danach blendet die App den Eintrag aus) }
        has_voted: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: 'Wechselt bei jeder Änderung (Ausblenden je Gerät gilt bis dahin)' }
    PollInput:
      type: object
      required: [title, type]
      properties:
        title: { type: string, maxLength: 150, description: Die Frage }
        description: { type: string, maxLength: 1000, description: Optional, reiner Text mit Zeilenumbrüchen }
        type: { type: string, enum: [single, multiple, text], description: 'Einfachauswahl, Mehrfachauswahl oder Freitext' }
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: { type: string, maxLength: 100 }
          description: 'Nur bei single und multiple: 2–20 verschiedene Möglichkeiten (leere werden übersprungen); bei text ignoriert'
        anonymous: { type: boolean, default: false }
        results: { type: string, enum: [after_vote, after_end, managers], default: after_vote }
        ends_at:
          type: [string, 'null']
          description: 'Optional: „JJJJ-MM-TTTHH:MM“ in der Zeitzone der Kompanie oder ISO 8601 mit Zeitzone; muss in der Zukunft liegen. Gespeichert in UTC.'
    PollPatch:
      type: object
      properties:
        title: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 1000 }
        type: { type: string, enum: [single, multiple, text] }
        options: { type: array, items: { type: string, maxLength: 100 } }
        anonymous: { type: boolean }
        results: { type: string, enum: [after_vote, after_end, managers] }
        ends_at: { type: [string, 'null'] }
    PollVote:
      type: object
      properties:
        option_ids: { type: array, items: { type: integer }, description: 'single: genau eine, multiple: mindestens eine' }
        text: { type: string, maxLength: 1000, description: Nur bei Freitext }
    Poll:
      type: object
      required: [id, title, description, type, anonymous, results, status, ends_at, closed_at, created_at, updated_at, created_by_name, options, locked, has_voted, my_answer, results_visible, results_data]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [single, multiple, text] }
        anonymous: { type: boolean }
        results: { type: string, enum: [after_vote, after_end, managers], description: Wer die Ergebnisse sieht }
        status: { type: string, enum: [running, ended] }
        ends_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time, description: Vorzeitig beendet }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by_name: { type: [string, 'null'] }
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
        locked: { type: boolean, description: 'Es gibt Antworten: Art, Möglichkeiten, Anonymität und Sichtbarkeit fest' }
        has_voted: { type: boolean }
        my_answer:
          type: [object, 'null']
          description: Nur die eigene Antwort (auch bei anonymen Umfragen, nur für einen selbst)
          properties:
            option_ids: { type: array, items: { type: integer } }
            text: { type: [string, 'null'] }
        results_visible: { type: boolean }
        results_data:
          type: [object, 'null']
          description: null, solange die Ergebnisse für dieses Konto nicht sichtbar sind
          properties:
            voters: { type: integer, description: Zahl der Teilnehmenden }
            options:
              type: array
              description: Bei single und multiple
              items:
                type: object
                properties:
                  id: { type: integer }
                  title: { type: string }
                  count: { type: integer }
                  percent: { type: integer, description: 'Anteil der Teilnehmenden, gerundet (bei multiple zusammen über 100)' }
                  names: { type: array, items: { type: string }, description: Nur bei namentlichen Umfragen }
            texts:
              type: array
              description: Bei text
              items:
                type: object
                properties:
                  text: { type: string }
                  name: { type: string, description: Nur bei namentlichen Umfragen }
    PushType:
      type: string
      enum: [board, polls, birthdays, penalties, points, ranks, titles, events, reminder, news]
      description: '`board` (Schwarzes Brett, Issue #5) nur für Mitglieder und Anwärter; dringend (Urgency high), TTL höchstens bis zum Ablauf der Nachricht. `polls` (Umfragen, Issue #4) nur für Mitglieder: neue Umfrage und Erinnerung 24 Stunden vor dem Ende an alle ohne Antwort. `birthdays` (Geburtstage, Issue #1) nur für Mitglieder: am Tag selbst ab 7 Uhr (Zeitzone der Kompanie), nicht an das Geburtstagskind, nur für sichtbare Geburtstage; TTL bis Mitternacht.'
    PushSubscribe:
      type: object
      required: [endpoint, keys]
      description: Angaben aus `PushSubscription.toJSON()` des Browsers, dazu die gewünschten Arten.
      properties:
        endpoint: { type: string, description: https-Adresse des Push-Dienstes }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
        details: { type: boolean }
    PushSubscriptionInfo:
      type: object
      required: [types, details]
      properties:
        types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
        details: { type: boolean }
    Feature:
      type: object
      required: [key, label, description, enabled, requires, configured, setup]
      properties:
        key:
          type: string
          enum: [events, calendar, news, gallery, points, penalties, ranks, titles, attendance, documents, board, polls, birthdays, inventory]
        label: { type: string, description: Bezeichnung (aus kompanie.json oder Standard) }
        description: { type: string, description: Ein Satz, wofür der Bereich da ist }
        enabled: { type: boolean }
        requires:
          type: array
          items: { type: string }
          description: Bereiche, die eingeschaltet sein müssen
        configured:
          type: [boolean, 'null']
          description: Ob der Bereich eingerichtet ist (z. B. Kalender mit Adresse); null = braucht keine Einrichtung
        setup:
          type: [string, 'null']
          description: Abschnitt der Einstellungen bzw. Schritt der Ersteinrichtung, z. B. `kalender`
    MaintenanceInfo:
      type: object
      required: ['on', reason, since]
      properties:
        'on': { type: boolean }
        reason: { type: string, description: 'Begründung (Klartext), leer wenn keine' }
        since: { type: integer, description: 'Eingeschaltet seit (Unix-Zeit), 0 wenn aus' }
    Maintenance:
      allOf:
        - $ref: '#/components/schemas/MaintenanceInfo'
        - type: object
          required: [by, log]
          properties:
            by: { type: integer, description: Konto, das eingeschaltet hat }
            log:
              type: array
              description: Verlauf, neueste zuerst (höchstens 20)
              items:
                type: object
                required: [at, by, by_name, 'on', reason]
                properties:
                  at: { type: integer }
                  by: { type: integer }
                  by_name: { type: string }
                  'on': { type: boolean }
                  reason: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        reason: { type: string, description: 'Nur bei `maintenance`: Begründung des Wartungsmodus' }
        code:
          type: string
          description: |
            z. B. `not_logged_in` (401), `forbidden` (403), `invalid` (400), `not_found` (404),
            `feature_disabled` (403, Bereich vom Admin ausgeschaltet), `method_not_allowed` (405),
            `csrf_invalid` (403), `upstream_error` (502), `not_configured` (503), `internal_error` (500),
            `maintenance` (503, Wartungsmodus, mit `reason`).
            Push (Issue #19): `push_unsupported` (501), `push_full` (503), `too_many_attempts` (429),
            `push_gone` (410) und `push_key_mismatch` (409, Gerät neu anmelden) bei der Testnachricht.
            Nur eigenständige Version: `login_failed` (400), `too_many_attempts` (429),
            `unsupported_media_type` (415, Änderungen nur als JSON), `not_installed` (503).
            Nur WordPress: `use_login_page` (400).
        message: { type: string, description: Für Menschen lesbar, in der Sprache der Kompanie }

    AdminSettings:
      type: object
      required: [calendar, gallery, news]
      properties:
        calendar:
          type: object
          properties:
            source: { type: string, enum: [ics, google, none] }
            ics_url_set: { type: boolean }
            google_api_key_set: { type: boolean }
            calendar_ids: { type: string }
            cache_minutes: { type: integer }
        gallery:
          type: object
          properties:
            configured: { type: boolean }
            root: { type: string }
            service_account_email: { type: string }
            oauth_connected: { type: boolean, description: Bestehende OAuth-Verbindung zu Google (geht dem Dienstkonto vor) }
            oauth_email: { type: string, description: Google-Konto der OAuth-Verbindung, leer wenn unbekannt }
            status:
              type: object
              description: Stand des letzten Abgleichs (albums, photos, new, pending, last_sync, error)
        news:
          type: [object, 'null']
          description: null, wenn die Neuigkeiten aus den Beiträgen der WordPress-Seite kommen.
          properties:
            source: { type: string, enum: [none, wordpress, rss] }
            url: { type: string }

    Level:
      type: string
      maxLength: 10
      description: |
        Schlüssel der Rolle. Fest sind `guest` (keine Rechte), `candidate` (Anwärter: nur interner Kalender), `member`
        (Mitgliederbereich mit Kalender, Rolle neuer Konten) und `admin` (alle Rechte). Standardrollen der Bereiche heißen wie der Bereich (`events`, `points`, `penalties`), eigene Rollen
        `r1`, `r2`, …; ältere Installationen haben außerdem `organizer` und `manager`. Bezeichnungen und Punktefaktor stehen in
        `/config` (`roles`), Rechte unter `/admin/roles`.

    RoleInfo:
      type: object
      required: [key, label, points_factor]
      properties:
        key: { $ref: '#/components/schemas/Level' }
        label: { type: string }
        points_factor: { type: number, description: 'Gilt beim Buchen von Punkten, z. B. 0.5' }

    RoleAdmin:
      allOf:
        - $ref: '#/components/schemas/RoleInfo'
        - type: object
          required: [capabilities, users, system, deletable]
          properties:
            capabilities:
              type: array
              items: { type: string, enum: [member, calendar, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, post_board, manage_polls, manage_inventory, create_users, promote_users, manage_settings] }
              description: 'Ausdrücklich gegebene Rechte (member schließt calendar ein und wird ohne es angezeigt); bei admin alle; vergebbar sind alle außer manage_settings. Ohne member nur calendar.'
            users: { type: integer, description: Anzahl der Personen mit dieser Rolle }
            system: { type: boolean, description: 'guest, candidate, member und admin: Rechte fest, nicht löschbar' }
            deletable: { type: boolean, description: 'false für guest, candidate, member und admin' }

    RoleInput:
      type: object
      properties:
        label: { type: string, maxLength: 30 }
        capabilities:
          type: array
          items: { type: string, enum: [member, calendar, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, post_board, manage_polls, manage_inventory, create_users, promote_users] }
          description: 'Verwaltungsrechte nur zusammen mit member; calendar geht auch allein (wie bei Anwärtern).'
        points_factor: { type: [number, string], description: 'Zwischen 0 und 10, z. B. 0.5 oder "0,5"' }

    AppUser:
      type: object
      required: [id, name, level, capabilities]
      properties:
        id: { type: integer }
        name: { type: string }
        login: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        capabilities:
          type: array
          items:
            type: string
            enum: [member, calendar, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, post_board, manage_polls, manage_inventory, create_users, promote_users, manage_settings]
          description: 'Wirksame Rechte; member bringt calendar mit.'

    UpdateStatus:
      type: object
      properties:
        configured: { type: boolean, description: Paket mit Update-Adresse und der Adapter kann einspielen }
        current: { type: string }
        channel: { type: string, enum: [early, stable] }
        auto: { type: boolean }
        checked_at: { type: [integer, 'null'] }
        error: { type: string, description: Fehler der letzten Prüfung, sonst leer }
        latest: { type: [string, 'null'] }
        available: { type: boolean, description: Neuere Version derselben Hauptversion verfügbar }
        major: { type: boolean, description: Neue Hauptversion verfügbar (nur mit Bestätigung) }
        majorVersion: { type: string }
        withdrawn: { type: boolean, description: Die installierte Version wurde zurückgezogen }
        fallback: { type: [string, 'null'], description: 'Bei withdrawn: Ziel des automatischen Wechsels; null = keins vorhanden' }
        skipped: { type: boolean, description: 'latest wird nach dem Zurückrollen nicht automatisch eingespielt' }
        autoAllowed: { type: boolean, description: 'Automatische Updates sind hier erlaubt (WordPress kann sie sperren)' }
        problems: { type: array, items: { type: string }, description: Gründe, warum die neue Version hier nicht läuft }
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: string }
              published: { type: string }
        last:
          type: [object, 'null']
          description: Letzter Update-Versuch
          properties:
            from: { type: string }
            to: { type: string }
            kind: { type: string, enum: [auto, manual, rollback, withdrawn] }
            at: { type: integer }
            ok: { type: boolean }
            error: { type: string }

    AppConfig:
      type: object
      required: [apiBase, appUrl, swUrl, auth, csrf, features, user, version]
      properties:
        apiBase: { type: string }
        appUrl: { type: string }
        swUrl: { type: string, description: 'Adresse des Service Workers (Bereich: appUrl)' }
        version: { type: string, description: 'Version der Installation, z. B. 1.4.0.3' }
        variant: { type: string, enum: [wordpress, standalone], description: Art der Installation }
        siteUrl: { type: [string, 'null'], description: Startseite der Webseite, falls vorhanden }
        handbookUrl: { type: [string, 'null'], description: 'Handbuch der Kompanie auf ihrer GitHub-Pages-Seite (…/handbuch/), aus der Adresse der Update-Liste abgeleitet; sonst null' }
        setupPending: { type: boolean, description: 'Nur für Admins true: Einrichtungsassistent noch nicht abgeschlossen' }
        maintenance: { $ref: '#/components/schemas/MaintenanceInfo' }
        csrf:
          type: object
          required: [header, token, refreshUrl]
          properties:
            header: { type: string, description: 'Name des Headers, z. B. X-CSRF-Token oder X-WP-Nonce' }
            token: { type: string, description: Leer für Gäste ohne Anmeldung }
            refreshUrl:
              type: string
              description: |
                GET liefert {token}. Funktioniert allein mit dem Sitzungs-Cookie, auch wenn das
                alte Token abgelaufen ist (WordPress: /app/csrf, Standalone: {apiBase}auth/csrf).
        auth:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [form, redirect]
            loginUrl: { type: [string, 'null'], description: Nur bei `redirect` }
            logoutUrl: { type: [string, 'null'], description: Nur bei `redirect` und Anmeldung }
        roles:
          type: array
          description: Rollen der Installation in der Reihenfolge der Anzeige (Bezeichnungen, Punktefaktor).
          items: { $ref: '#/components/schemas/RoleInfo' }
        features:
          type: object
          description: Bereiche, die der Admin eingeschaltet hat **und** die auf dem Server eingerichtet sind.
          properties:
            events: { type: boolean }
            calendar: { type: boolean }
            news: { type: boolean }
            gallery: { type: boolean }
            points: { type: boolean }
            penalties: { type: boolean }
            ranks: { type: boolean }
            titles: { type: boolean }
            attendance: { type: boolean }
            documents: { type: boolean }
            board: { type: boolean }
            polls: { type: boolean }
            birthdays: { type: boolean }
            inventory: { type: boolean }
        user:
          oneOf:
            - $ref: '#/components/schemas/AppUser'
            - type: 'null'
          description: null = Gast ohne Anmeldung

    Me:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        points: { type: number, description: 'Summe mit Punktefaktor, höchstens zwei Nachkommastellen' }
        open_cents: { type: integer }
        rank:
          description: Eigener Dienstgrad (nur mit Bereich Dienstgrade)
          oneOf:
            - $ref: '#/components/schemas/RankRef'
            - type: 'null'
        titles:
          description: Eigene Titel in der Reihenfolge der Titelliste (nur mit Bereich Titel)
          type: array
          items: { $ref: '#/components/schemas/TitleRef' }

    PointEntry:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        points: { type: number, description: 'Was zählt: base_points × factor (höchstens zwei Nachkommastellen)' }
        base_points: { type: integer, description: Gebuchte Punktzahl }
        factor: { type: number, description: Punktefaktor der Rolle beim Buchen }
        reason: { type: string }
        catalog_id: { type: [integer, 'null'] }
        attendance_id: { type: [integer, 'null'], description: 'Anwesenheitsliste, aus deren Vorschlag gebucht wurde (Issue #21)' }
        date: { type: string, format: date }
        created_by_name: { type: [string, 'null'] }

    Penalty:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        amount_cents: { type: integer }
        reason: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [open, paid] }
        paid_at: { type: [string, 'null'] }
        created_by_name: { type: [string, 'null'] }

    CatalogItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        points: { type: integer }
        active: { type: boolean }
        sort: { type: integer }

    CalendarEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        start: { type: string, description: ISO 8601 }
        end: { type: string, description: ISO 8601 }
        all_day: { type: boolean }
        location: { type: string }
        description: { type: string }

    PublicEvent:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        start: { type: string }
        end: { type: string }
        all_day: { type: boolean }
        location: { type: string }
        description: { type: string }
        start_date: { type: string, format: date }
        start_time: { type: [string, 'null'] }
        end_date: { type: [string, 'null'] }
        end_time: { type: [string, 'null'] }
        url: { type: string }

    EventInput:
      type: object
      required: [title, start_date]
      properties:
        title: { type: string }
        start_date: { type: string, format: date }
        start_time: { type: string, description: 'HH:MM oder leer' }
        end_date: { type: string, description: 'YYYY-MM-DD oder leer' }
        end_time: { type: string, description: 'HH:MM oder leer' }
        location: { type: string }
        description: { type: string }
        url: { type: string }

    NewsItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string, description: 'ISO 8601 (UTC); leer, wenn die Quelle kein lesbares Datum liefert' }
        excerpt: { type: string }
        image: { type: [string, 'null'] }
        link: { type: string }
        content: { type: string, description: Nur bei der Einzelansicht }

    GalleryAlbumSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        count: { type: integer }
        intern_count: { type: integer }
        cover: { type: [string, 'null'] }

    GalleryYear:
      type: object
      properties:
        year: { type: string }
        albums:
          type: array
          items: { $ref: '#/components/schemas/GalleryAlbumSummary' }

    GalleryPhoto:
      type: object
      properties:
        id: { type: integer }
        thumb:
          type: string
          description: |
            Adresse des Vorschaubilds. Öffentliche fertige Bilder als statische Datei, sonst über die App
            (`…/foto/<id>/thumb`, außerhalb der API). Bilder, die noch nicht aufbereitet sind, erzeugt der
            Server dort während der Anfrage (beide Größen; höchstens zwei Anfragen gleichzeitig, je Bild nur
            eine). Ist gerade kein Platz frei, antwortet er mit **202**, einem grauen SVG-Platzhalter im
            Seitenverhältnis des Fotos, `Cache-Control: no-store` und `Retry-After` (Sekunden); dann läuft
            die Aufbereitung im Hintergrund. Fertige Bilder: 200 mit JPEG. Interne Bilder ohne
            Mitgliedschaft: 401/403. Scheitert die Aufbereitung: 404.
        large: { type: string, description: Adresse der Großansicht (Verhalten wie thumb) }
        width: { type: integer }
        height: { type: integer }
        intern: { type: boolean }
        name: { type: string }
        ready:
          type: boolean
          description: false, solange das Bild noch aufbereitet wird (die Adressen erzeugen das Bild oder liefern den Platzhalter). Die App lädt das Album dann alle 10 s neu.

    GalleryAlbum:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        year: { type: string }
        photos:
          type: array
          items: { $ref: '#/components/schemas/GalleryPhoto' }

    MemberSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        member: { type: boolean, description: 'Mit Mitgliederbereich (Punkte und Strafen möglich); false bei Anwärtern, Rollen nur mit Kalender und Gästen' }
        points: { type: [number, 'null'], description: 'Summe mit Punktefaktor, höchstens zwei Nachkommastellen; null ohne manage_points' }
        open_cents: { type: [integer, 'null'], description: 'null ohne manage_penalties' }
        rank_title: { type: [string, 'null'], description: 'Dienstgrad (nur mit Bereich Dienstgrade und Recht manage_ranks)' }
        rank_badge_url: { $ref: '#/components/schemas/BadgeUrl' }
        titles:
          description: Titel in der Reihenfolge der Titelliste (nur mit Bereich Titel und Recht manage_titles)
          type: array
          items: { $ref: '#/components/schemas/TitleRef' }

    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          properties:
            point_list:
              type: array
              items: { $ref: '#/components/schemas/PointEntry' }
            penalties:
              type: array
              items: { $ref: '#/components/schemas/Penalty' }
            rank: { $ref: '#/components/schemas/RankStatus' }
            rank_history:
              type: array
              items: { $ref: '#/components/schemas/RankHistoryEntry' }
            titles:
              description: Titel (nur mit Bereich Titel und Recht manage_titles)
              type: array
              items: { $ref: '#/components/schemas/TitleRef' }
            birthday:
              description: Geburtstag mit Jahr und Schaltern (nur mit Bereich Geburtstage; null ohne Eintrag)
              oneOf:
                - $ref: '#/components/schemas/Birthday'
                - type: 'null'

    Birthday:
      type: object
      description: Geburtstag mit Jahr und Schaltern – nur für die Person selbst und in den Mitgliedsdetails.
      required: [month, day, year, visible, show_age]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        year: { type: [integer, 'null'] }
        visible: { type: boolean, description: Anderen Mitgliedern zeigen }
        show_age: { type: boolean, description: Alter anzeigen }

    BirthdayResponse:
      type: object
      required: [birthday]
      properties:
        birthday:
          oneOf:
            - $ref: '#/components/schemas/Birthday'
            - type: 'null'

    BirthdayString:
      type: string
      pattern: '^(\d{4}-)?\d{2}-\d{2}$'
      description: 'Geburtstag (optional, nur mit Bereich Geburtstage, sonst 400): `JJJJ-MM-TT` oder ohne Jahr `MM-TT`. Prüfung wie bei `PUT /me/birthday`; die Schalter sind danach an (zeigen) bzw. aus (Alter), ändern kann sie nur die Person.'

    BirthdayEntry:
      type: object
      description: Sichtbarer Geburtstag eines Mitglieds, nie mit Geburtsjahr.
      required: [user_id, name, month, day, date, days_until, today, age]
      properties:
        user_id: { type: integer }
        name: { type: string }
        month: { type: integer }
        day: { type: integer }
        date: { type: string, format: date, description: 'Tag des nächsten Geburtstags (29.02. in Jahren ohne Schalttag: 28.02.)' }
        days_until: { type: integer, minimum: 0, description: 'Tage bis dahin; 0 = heute' }
        today: { type: boolean }
        age: { type: [integer, 'null'], description: 'Alter, das die Person an diesem Geburtstag erreicht; nur mit Jahr und „Alter anzeigen“' }

    Rank:
      type: object
      required: [id, title, sort, min_points, active]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 60 }
        sort: { type: integer, description: Reihenfolge, der niedrigste zuerst }
        min_points: { type: [integer, 'null'], description: 'Punkteschwelle; null = ohne. Für Mitglieder nur mit dem Bereich Punkte' }
        active: { type: boolean }
        assigned: { type: integer, description: 'Wie oft vergeben (nur mit all=1)' }
        badge_url: { $ref: '#/components/schemas/BadgeUrl' }
        badge_type: { type: [string, 'null'], enum: [png, jpg, webp, svg, null], description: 'Format des hochgeladenen Abzeichens (nur mit all=1)' }
        badge_push: { type: boolean, description: 'Es gibt eine PNG-Fassung für Benachrichtigungen (nur mit all=1; bei SVG nur, wenn die App eine mitgeschickt hat)' }

    BadgeUrl:
      type: [string, 'null']
      description: |
        Abzeichen des Dienstgrads (Issue #17) oder null: `<App>/abzeichen/<id>?v=<Fassung>&s=128`. Die App ersetzt
        `s` bei Bedarf durch 64 oder 256 (PNG-Fassungen; bei SVG dieselbe Datei). Ausgeliefert nur an angemeldete
        Personen mit Mitgliederbereich oder internem Kalender (sonst 401/403, im Wartungsmodus 503, Bereich aus 404);
        SVG als image/svg+xml mit `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; sandbox`
        und `X-Content-Type-Options: nosniff`, sonst image/png. Die Adresse wechselt mit jeder Fassung.

    Title:
      type: object
      required: [id, title, sort, active, assigned]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 60 }
        sort: { type: integer, description: Reihenfolge der Anzeige }
        active: { type: boolean, description: 'Deaktivierte werden nicht mehr neu vergeben; wer sie hat, behält sie' }
        assigned: { type: integer, description: Wie vielen Mitgliedern zugewiesen }

    DocCategory:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 191 }
        sort: { type: integer }

    DocumentInfo:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 191 }
        category_id: { type: [integer, 'null'] }
        date: { type: string, format: date, description: Stand }
        visibility: { type: string, enum: [members, managers], description: 'managers: nur wer manage_documents hat' }
        ext: { type: string }
        kind: { type: string, enum: [pdf, image, file], description: 'pdf und image zeigt die App an, file nur herunterladen' }
        mime: { type: string }
        size: { type: integer }
        version: { type: string, description: Wechselt mit jeder neuen Fassung }
        url: { type: string, description: 'Auslieferung mit Prüfung der Anmeldung: <App>/dokument/<id>?v=<version>' }
        updated_at: { type: string }

    DocumentFile:
      type: object
      required: [name, data]
      description: Datei für das Hochladen (beide Adapter nehmen nur JSON an)
      properties:
        name: { type: string, description: 'Dateiname; die Endung bestimmt den Typ (pdf, jpg, jpeg, png, doc, docx, xls, xlsx, ppt, pptx, odt, ods, odp)' }
        data: { type: string, description: 'Inhalt Base64-kodiert, auch als data:-Adresse; die Signatur muss zur Endung passen' }

    AttendanceStatus:
      type: string
      enum: [present, excused, absent]
      description: anwesend, entschuldigt, fehlt

    AttendanceCounts:
      type: object
      properties:
        present: { type: integer }
        excused: { type: integer }
        absent: { type: integer }

    AttendanceSummary:
      type: object
      properties:
        id: { type: integer }
        source: { type: string, enum: [calendar, free] }
        title: { type: string, description: Momentaufnahme beim Anlegen }
        date: { type: string, format: date }
        counts: { $ref: '#/components/schemas/AttendanceCounts' }

    AttendanceDetail:
      allOf:
        - $ref: '#/components/schemas/AttendanceSummary'
        - type: object
          properties:
            event_key: { type: [string, 'null'], description: ID des Kalendertermins (nur source calendar) }
            updated_by_name: { type: [string, 'null'] }
            updated_at: { type: string }
            people:
              type: array
              description: Alle mit einer Rolle (ohne Gäste), nach Namen
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  role: { $ref: '#/components/schemas/Level' }
                  group: { type: string, description: Rolle, als die die Person im Zähler zählt }
                  member: { type: boolean, description: 'Mit Mitgliederbereich: Punkte und Strafen möglich' }
                  status:
                    oneOf:
                      - $ref: '#/components/schemas/AttendanceStatus'
                      - type: 'null'
                  booked: { type: boolean, description: Hat für diese Liste schon Punkte (ohne stornierte) }
            counts_by_group:
              type: object
              description: Je Status die Gruppen in der Reihenfolge der Rollen
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    group: { type: string }
                    label: { type: string }
                    count: { type: integer }

    TitleRef:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }

    RankRef:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        badge_url: { $ref: '#/components/schemas/BadgeUrl' }

    RankStatus:
      type: object
      description: |
        Dienstgrad eines Mitglieds; alle Felder nach rank nur, wenn auch der Bereich Punkte an ist. next_rank ist der
        nächste aktive Dienstgrad mit Schwelle (Dienstgrade ohne Schwelle werden übersprungen), sonst der nächste.
      properties:
        rank:
          oneOf:
            - $ref: '#/components/schemas/RankRef'
            - type: 'null'
        points: { type: number }
        next_rank:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/RankRef'
                - type: object
                  properties:
                    min_points: { type: [integer, 'null'] }
            - type: 'null'
        points_to_next: { type: [number, 'null'], description: '≤ 0: Schwelle erreicht; null ohne nächsten Dienstgrad oder ohne Schwelle' }
        reachable_rank:
          description: Höchster Dienstgrad mit erreichter Schwelle
          oneOf:
            - $ref: '#/components/schemas/RankRef'
            - type: 'null'
        threshold_reached_since: { type: [string, 'null'], format: date, description: 'Seit wann die Summe durchgehend die Schwelle des nächsten erreicht' }
        below_current_threshold: { type: boolean }

    RankHistoryEntry:
      type: object
      properties:
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        to_badge_url:
          description: Heutiges Abzeichen des neuen Dienstgrads (der Verlauf speichert nur Bezeichnungen); null ohne
          $ref: '#/components/schemas/BadgeUrl'
        kind: { type: string, enum: [promotion, demotion, initial] }
        points_at_change: { type: [number, 'null'], description: 'null ohne den Bereich Punkte' }
        reason: { type: string }
        changed_by_name: { type: [string, 'null'] }
        changed_at: { type: string, description: 'UTC, YYYY-MM-DD HH:MM:SS' }

    CreatedUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        email: { type: string }
        level: { type: string, enum: [member, candidate] }
        warning: { type: string, description: 'Konto angelegt, aber Anfangspunkte bzw. Dienstgrad nicht übernommen' }
        password: { type: string, description: Startpasswort; steht nur in dieser Antwort }

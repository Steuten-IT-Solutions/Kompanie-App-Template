    patch:
      tags: [Inventar]
      summary: Eintrag ändern
      description: |
        Nur genannte Felder ändern sich. Menge absolut (`quantity`) oder als Änderung (`adjust`, z. B. 1 oder -1 für die
        Knöpfe − und +); beides zusammen → 400, unter 0 → 400. `location` berichtigt nur den Ort (ohne Zusammenführen);
        Bestand an einen anderen Ort bringt `POST /inventory/{id}/move`. Verlauf: ein Eintrag `update` mit den geänderten
        Feldern; ändert sich nichts, kein Eintrag. Gelöscht oder unbekannt → 404.
      x-capability: manage_inventory
      requestBody:

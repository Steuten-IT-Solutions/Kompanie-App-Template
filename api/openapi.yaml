      tags: [Ämter]
      summary: Tabelle importieren (Ersterfassung); ohne apply nur die Vorschau
      description: |
        CSV mit Semikolon oder Tabulator, höchstens 200 KB und 2000 Zeilen: `gruppe;amt;beginn;ende;art;personen;zusatz`
        (Kopfzeile erlaubt). ende: Jahr, „heute“ (laufend) oder leer (ein Jahr); art leer, „zeitraum“ oder „zeitpunkt“;
        personen mit „&“ getrennt. Gruppen und Ämter werden nach Namen gefunden oder angelegt, gleiche Amtszeiten
        übersprungen. Mit `link` werden Namen, die genau einem Konto entsprechen, damit verknüpft. Mit `apply` alles in

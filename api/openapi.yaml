          schema: { type: integer, minimum: 0, maximum: 366 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BirthdayEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /polls:
    get:
      tags: [Umfragen]
      summary: Alle Umfragen (laufende und beendete), neueste zuerst (Issue #4)
      description: |
        Für Mitglieder (Recht `member`; Anwärter nicht) und alle mit `manage_polls`. Je Umfrage `has_voted`, die eigene
        Antwort (`my_answer`) und die Ergebnisse (`results_data`), soweit sie für dieses Konto sichtbar sind:
        `after_vote` – wer geantwortet hat, nach dem Ende alle Mitglieder; `after_end` – alle Mitglieder nach dem Ende;
        `managers` – nur `manage_polls`. Wer `manage_polls` hat, sieht die Ergebnisse immer. Namen je Möglichkeit bzw. je
        Freitext nur bei namentlichen Umfragen; bei anonymen nie Namen oder Benutzer-IDs (Freitexte alphabetisch).
      x-capability: 'vote_polls oder manage_polls'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Poll' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Umfragen]
      summary: Umfrage anlegen
      description: |
        Alle Mitglieder außer dem, der sie anlegt, bekommen eine Benachrichtigung (Art `polls`, TTL höchstens bis zum Ende).
        Endet die Umfrage in weniger als 24 Stunden, gibt es keine zusätzliche Erinnerung.
      x-capability: manage_polls
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PollInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /polls/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Umfragen]
      summary: Eine Umfrage (wie in der Liste)
      x-capability: 'vote_polls oder manage_polls'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Umfragen]
      summary: Laufende Umfrage ändern
      description: |
        Jede und jeder mit `manage_polls`. Nur genannte Felder ändern sich. Frage, Beschreibung und Ende jederzeit, solange
        die Umfrage läuft; `type`, `options`, `anonymous` und `results` nur bis zur ersten Antwort (danach → 400, außer
        der Wert bleibt gleich). Beendete Umfragen → 400 (wieder öffnen geht nicht). `updated_at` wechselt nur bei einer
        echten Änderung (am Brett ausgeblendete Umfragen erscheinen dann wieder). Ein neues Ende mehr als 24 Stunden in
        der Zukunft macht eine neue Erinnerung möglich. Keine Benachrichtigung.
      x-capability: manage_polls
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PollPatch' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Umfragen]
      summary: Umfrage mit allen Antworten löschen
      x-capability: manage_polls
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /polls/{id}/close:

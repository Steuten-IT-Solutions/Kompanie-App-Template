          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /points/{id}:
    parameters:

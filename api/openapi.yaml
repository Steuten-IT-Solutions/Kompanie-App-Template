                  memory_limit: { type: [integer, 'null'], description: 'Arbeitsspeicher für die Bildverarbeitung' }
                  max_allowed_packet: { type: [integer, 'null'], description: 'Größter Wert je Anweisung (MySQL/MariaDB)' }
                  max_image_bytes: { type: [integer, 'null'], description: 'Größte Bilddatei, die durch Anfrage und Datenbank passt' }

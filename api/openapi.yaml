  /inventory/{id}/move:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Inventar]
      summary: Einen Teil oder alles an einen anderen Ort umlagern
      description: |
        In einer Transaktion. Gibt es am Zielort schon einen Eintrag mit derselben Bezeichnung und Einheit (ohne Unterschied
        in Groß- und Kleinschreibung), kommt die Menge dazu; sonst entsteht ein neuer Eintrag (Kategorie und Notiz
        übernommen). Alles umgelagert: Die Quelle verschwindet (beim Zusammenführen weich gelöscht); ohne passendes Ziel
        ändert sich nur ihr Ort. Mehr als vorhanden, Menge 0 oder derselbe Ort → 400 ohne jede Änderung.

        Verlauf: genau ein Eintrag `move` je betroffenem Eintrag, beide mit demselben `changes.move`
        (`from`, `to`, `quantity`, `source_id`, `target_id`). Teilmenge: Quelle `quantity {old, new}`, Ziel
        `quantity {old, new}` bzw. `{old: null, new}` beim neuen Eintrag. Alles mit Ziel: Quelle `quantity {old, new: 0}` und
        `move.source_removed: true`. Alles ohne Ziel: ein einziger Eintrag mit `location {old, new}`
        (`source_id` = `target_id`).
      x-capability: manage_inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, location]
              properties:
                quantity:
                  oneOf:
                    - { type: number, exclusiveMinimum: 0 }
                    - { type: string, description: 'z. B. „2,5“' }
                location: { type: string, maxLength: 100, description: Zielort }
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Umgelagert
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    description: Was am alten Ort bleibt; null, wenn dort nichts mehr steht.
                    oneOf:
                      - $ref: '#/components/schemas/InventoryItem'
                      - type: 'null'
                  target: { $ref: '#/components/schemas/InventoryItem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }


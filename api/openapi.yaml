  /members:
    get:
      tags: [Verwaltung]
      summary: Mitglieder mit Summen
      description: Wer Dienstgrade bzw. Titel verwaltet, sieht zusätzlich frühere Mitglieder, die noch einen Dienstgrad bzw. Titel haben.
      x-capability: 'manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, create_users oder promote_users (Punkte bzw. offene Beträge nur mit dem jeweiligen Recht, sonst null)'
      parameters:
        - name: all
          in: query
          description: Auch Gast-Konten (nur mit Recht `promote_users`).
          schema: { type: string, enum: ['1'] }
        - name: candidates
          in: query
          description: Auch Personen mit Rollen nur mit dem internen Kalender (z. B. Anwärter).
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberSummary' }
        '403': { $ref: '#/components/responses/Error' }

  /members/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Verwaltung]
      summary: Mitglied mit Punkten und Strafen
      description: Mit Bereich Geburtstage und Recht `create_users` auch `birthday` (mit Jahr und den Schaltern der Person, null ohne Eintrag).
      x-capability: 'manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, create_users oder promote_users (Punkte bzw. Strafen nur mit dem jeweiligen Recht)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

    delete:
      tags: [Verwaltung]
      summary: Konto löschen mit allen eigenen Daten (Issue #24)
      description: |
        Standalone: Das Konto wird gelöscht. WordPress: Der Benutzer der Webseite bleibt, verliert aber seine Rolle in der
        App. In beiden Fällen werden Punkte, Strafen, Anwesenheit, Dienstgrad mit Verlauf, Titel, Geburtstag und Push-Abos der Person
        gelöscht und alle Sitzungen beendet; was sie für andere eingetragen hat, bleibt. Nicht das eigene Konto, nicht der
        letzte Admin; Grenzen wie beim Passwort-Zurücksetzen.
      x-capability: create_users
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /members/{id}/role:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Grundrolle und/oder Zusatzrollen setzen (nicht die eigenen)
      description: |
        `level` ist die Grundrolle. `admin` ist nur in der eigenständigen Version erlaubt; bei WordPress werden
        Admin-Rechte nur im WP-Backend vergeben. Der letzte Admin kann nicht herabgestuft werden.

        `extra_roles` (Issue #66) ersetzt die Zusatzrollen (leere Liste: keine). Nur eigene Rollen
        (`/config` → `roles[].extra`), nicht `guest`, `member`, `admin`; nur zu einer Grundrolle mit
        Mitgliederbereich und nicht für Admins (sonst 400). Mit `level` zusammen wird gegen die neue Grundrolle geprüft;
        eine neue Grundrolle ohne Mitgliederbereich entfernt die Zusatzrollen. Wer kein Admin ist, vergibt und entfernt
        nur Rollen, die er auch als Grundrolle vergeben dürfte, und nur bei Personen ohne mehr Rechte als er (sonst 403).
        Mindestens eines der beiden Felder ist nötig.
      x-capability: promote_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level: { $ref: '#/components/schemas/Level' }
                extra_roles:
                  type: array
                  items: { $ref: '#/components/schemas/Level' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, level, extra_roles]
                properties:
                  id: { type: integer }
                  level: { $ref: '#/components/schemas/Level' }
                  extra_roles: { $ref: '#/components/schemas/ExtraRoles' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/rights:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Verwaltung]
      summary: Rechte einer Person zusätzlich zur Rolle geben oder entziehen (Ausnahmen)
      description: |
        Ersetzt die Ausnahmen der Person. `grant`: Rechte zusätzlich zur Rolle, `revoke`: Rechte der Rolle, die sie
        nicht haben soll. Was die Rolle ohnehin regelt, fällt weg (auch bei einem späteren Rollenwechsel); leere Listen
        setzen die Person auf die Rechte ihrer Rolle zurück. Nicht für Admins (haben alle Rechte), Gäste und sich selbst;
        `manage_settings` bleibt den Admins vorbehalten. Rechte zum Verwalten brauchen den Mitgliederbereich, der interne
        Kalender lässt sich nur mit ihm entziehen. Wer Rollen vergeben darf, ohne Admin zu sein, ändert nur Rechte, die er
        selbst hat, ohne `create_users` und `promote_users`, und nur bei Personen, die er verwalten darf.
      x-capability: promote_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant:
                  type: array
                  items: { $ref: '#/components/schemas/GrantableCapability' }
                revoke:
                  type: array
                  items: { $ref: '#/components/schemas/GrantableCapability' }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberRights' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/promote:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Verwaltung]
      summary: Als Mitglied aufnehmen (z. B. Anwärter)
      description: |
        Nur aus einer Rolle mit `promotable` (`/config` → `roles`; eigene Rollen ohne Mitgliederbereich, vom Admin
        freigegeben) zu `member`, sonst 400; andere Rollenwechsel gehen über `/members/{id}/role`.
      x-capability: create_users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  level: { $ref: '#/components/schemas/Level' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/data:
    get:
      tags: [Verwaltung]
      summary: Alle Daten einer Person herunterladen (Auskunft nach Art. 15 DSGVO)
      description: |
        Auskunft nach Art. 15 DSGVO als Datei (`Content-Disposition: attachment`, `Cache-Control: no-store`):
        `{format: "kompanie-app-personal-data", formatVersion, created, kompanie, person, data}`. `person` mit Profil,
        Rollen, Geburtstag, Eintrittsjahr, Ehemaligen-Eintrag und Foto (Base64); `data` je Tabelle die Zeilen der Person
        (dieselben Tabellen wie beim Löschen, dazu Push-Abos ohne Schlüssel, Ämter, Listen, Änderungen am Schwarzen Brett,
        eigene Bilder (Signatur, Entwürfe) mit Inhalt). Ohne Pseudonyme. Nicht in der Vorschau (403).
        Wie `GET /me/data`, aber ohne Antworten in anonymen Umfragen und die Nutzungsauswertung nur mit `view_activity`.
        Grenzen wie beim Löschen (Konten von Admins nur für Admins); zusätzlich alle Rechte der enthaltenen Bereiche
        (sonst 403), damit niemand über die Auskunft sieht, was ihm in der App verborgen ist: `view_personal`,
        `manage_points`, `manage_penalties`, `manage_ranks`, `manage_titles`, `manage_attendance`, `manage_polls`,
        `send_mail`, `manage_lists`, `post_board`, `view_offices`.
      x-capability: create_users und die Rechte aller enthaltenen Bereiche (in der Regel Admins)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Daten der Person
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/former:
    get:
      tags: [Verwaltung]
      summary: Ehemalige Mitglieder (ausgetreten, verstorben, sonst ausgeschieden)
      description: Nach Namen. `points` bzw. `open_cents` nur mit manage_points bzw. manage_penalties (sonst null).
      x-capability: create_users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FormerMember' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Verwaltung]
      summary: Eine ehemalige Person neu anlegen (Konto ohne Anmeldung, gleich als ehemalig eingetragen)
      description: |
        Wie eine Zeile von `/members/former/import`, mit den Feldern von `PUT /members/{id}/former` (Daten als TT.MM.JJJJ,
        JJJJ-MM-TT, nur das Jahr oder leer). Erst wird alles geprüft, dann angelegt. Wer genau so heißt wie ein vorhandenes
        Konto (Groß- und Kleinschreibung egal), wird nicht angelegt → 400. Geburtstag (nur mit dem Bereich Geburtstage) und
        Foto wie bei `POST /users`; klappt das Speichern nicht, ist die Person trotzdem angelegt und `warning` sagt es. Freie
        Namen in Amtszeiten, die genau passen, werden mit dem Konto verknüpft (`offices_linked`).
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, reason]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                reason: { $ref: '#/components/schemas/FormerReason' }
                joined_on: { type: string }
                founder: { type: boolean, default: false }
                left_on: { type: string }
                birthday: { $ref: '#/components/schemas/BirthdayString' }
                photo:
                  description: Foto (optional), vorab geprüft wie bei `PUT /members/{id}/photo`
                  allOf:
                    - $ref: '#/components/schemas/PhotoFile'
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/FormerInfo' }
                  - type: object
                    required: [id, name, offices_linked]
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      offices_linked: { type: integer }
                      warning: { type: string }
                      photo_url: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /members/former/import:
    post:
      tags: [Verwaltung]
      summary: Ehemalige aus einer Tabelle anlegen (Ersterfassung, z. B. Chronik); ohne apply nur die Vorschau
      description: |
        CSV mit Semikolon oder Tabulator, UTF-8 oder Windows-1252, höchstens 200 KB und 500 Zeilen:
        `vorname;nachname;eintritt;ausgeschieden;grund` (Kopfzeile erlaubt). Daten als TT.MM.JJJJ, JJJJ-MM-TT, nur das Jahr
        oder leer; eintritt „Gründer“ setzt `founder`. grund: ausgetreten (auch leer), verstorben, sonstiges. Wer genau so
        heißt wie ein vorhandenes Konto, wird übersprungen (`existing`); gleiche Namen in der Tabelle sind ein Fehler. Mit
        `apply` entsteht je Person ein Konto (zufälliges Passwort, das niemand erfährt), das gleich als ehemalig eingetragen
        wird; enthält eine Zeile einen Fehler → 400 (nichts angelegt). Freie Namen in Amtszeiten, die genau zu einer neu
        angelegten (oder schon früher als ehemalig importierten) Person passen, werden mit ihrem Konto verknüpft.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string }
                apply: { type: boolean, default: false }
      responses:
        '200':
          description: Vorschau bzw. Ergebnis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormerImportResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /members/import:
    post:
      tags: [Verwaltung]
      summary: Mitglieder aus einer Tabelle übernehmen, auch Ehemalige (Ersterfassung); ohne apply nur die Vorschau
      description: |
        CSV mit Semikolon, Tabulator (die App liest Excel-Dateien selbst und schickt sie so) oder Komma, UTF-8 oder
        Windows-1252, höchstens 200 KB und 500 Personen. Die erste Zeile enthält die Spaltennamen (Reihenfolge und Groß- und
        Kleinschreibung egal): vorname (Pflicht), nachname (auch name), status (auch rolle), benutzername, e-mail,
        handynummer (auch handy, mobil), straße, hausnummer, adresszusatz, plz, ort, land (Name oder ISO-Code, leer = DE;
        Prüfung wie `AddressInput`), geburtstag, eintritt, punkte, dienstgrad, titel (mit Komma getrennt), ausgeschieden,
        grund. Unbekannte Spalten und
        Spalten zu ausgeschalteten Bereichen bzw. ohne das Recht dazu stehen in `columns.ignored`.
        status: leer, „Mitglied“ oder die Bezeichnung einer Rolle, die sich beim Anlegen wählen lässt; „ehemalig“ legt ein
        Konto ohne Anmeldung an, das gleich als ehemalig eingetragen ist (wie `/members/former/import`; eintritt
        „Gründer“, ausgeschieden und grund nur dann). Punkte, Dienstgrad (Bezeichnung) und Titel (Bezeichnungen) nur für
        Rollen mit Mitgliederbereich. Geburtstag als TT.MM.JJJJ, TT.MM. oder JJJJ-MM-TT; Eintritt als TT.MM.JJJJ oder Jahr.
        Wer genau so heißt wie ein vorhandenes Konto, wird übersprungen (`existing`); gleiche Namen in der Tabelle sind ein
        Fehler. Mit `apply` und einem Fehler in einer Zeile → 400 (nichts angelegt). Sonst stehen die Zugangsdaten der neuen
        aktiven Konten (mit Startpasswort, nur in dieser Antwort) in `created`; bricht das Anlegen mittendrin ab, steht der
        Grund in `error` und die schon angelegten in `created`.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string }
                apply: { type: boolean, default: false }
      responses:
        '200':
          description: Vorschau bzw. Ergebnis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberImportResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /members/{id}/former/offices:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Verwaltung]
      summary: Vorschau zu „Als ehemalig eintragen“ – laufende Ämter, die mit dem Ausscheiden enden
      description: |
        Laufende Amtszeiten (Zeitraum ohne Ende, auch mit Haken „Ehrung“) der Person mit dem Jahr, mit dem sie enden würden:
        Jahr aus `left_on`, leer dieses Jahr, nie vor dem Beginn (`clamped`). Prüfung und Grenzen wie bei
        `PUT /members/{id}/former`; ungültiges Datum → 400. Ändert nichts.
      x-capability: create_users
      parameters:
        - name: left_on
          in: query
          required: false
          schema: { type: string }
          description: Ausgeschieden wie im Formular (TT.MM.JJJJ, JJJJ-MM-TT, nur das Jahr oder leer)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [end_year, terms]
                properties:
                  end_year: { type: integer }
                  terms:
                    type: array
                    items:
                      type: object
                      required: [office, start_year, end_year, clamped, shared]
                      properties:
                        office: { type: string }
                        start_year: { type: integer }
                        end_year: { type: integer }
                        clamped: { type: boolean, description: Austritt vor dem Beginn; das Ende ist der Beginn }
                        shared: { type: boolean, description: Gemeinsam mit anderen; nur der Ehemalige bekommt eine beendete Amtszeit }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/former:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Verwaltung]
      summary: Als ehemalig eintragen (Konto stilllegen, alle Daten bleiben)
      description: |
        Grundrolle Gast, Zusatzrollen und Ausnahmen fallen weg (werden für „Wieder aufnehmen“ gemerkt), alle Sitzungen und
        Push-Abos enden; die eigenständige Version sperrt die Anmeldung. Grenzen wie beim Löschen; nicht das eigene Konto,
        nicht den letzten Admin, keine Gäste. Im selben Vorgang enden die laufenden Ämter der Person (siehe
        `GET /members/{id}/former/offices`); gemeinsame Amtszeiten werden geteilt, die anderen laufen weiter. Verknüpfte
        Titel entfallen damit, andere Titel bleiben.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormerInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/FormerInfo' }
                  - type: object
                    required: [offices_ended]
                    properties:
                      offices_ended: { type: integer, description: Zahl der beendeten Amtszeiten }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Verwaltung]
      summary: Angaben einer ehemaligen Person ändern (fehlende bleiben)
      description: |
        Ändert sich das Austrittsdatum, enden die beim Eintragen automatisch beendeten Amtszeiten mit dem neuen Jahr (nie vor
        ihrem Beginn), solange niemand sie seither von Hand geändert hat.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormerInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormerInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Wieder aufnehmen
      description: |
        Grundrolle von vorher (Mitglied, wenn es sie nicht mehr gibt), Zusatzrollen, soweit es sie gibt und der Handelnde
        sie vergeben darf; Ausnahmen bei den Rechten nur durch Admins. Ein Startpasswort danach über
        `POST /members/{id}/password`. Beendete Ämter bleiben beendet.
      x-capability: create_users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  level: { $ref: '#/components/schemas/Level' }
                  extra_roles:
                    type: array
                    items: { $ref: '#/components/schemas/Level' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/account:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Verwaltung]
      summary: Angaben eines Kontos zum Bearbeiten (Issue #24)
      description: |
        Mit denselben Grenzen wie beim Passwort-Zurücksetzen (Admins nur für Admins usw.). `phone` nur für das eigene
        Konto und mit `view_personal`, sonst leer; Adresse und Geburtsdatum stehen in `GET /members/{id}`.
      x-capability: create_users
      responses:
        '200': { $ref: '#/components/responses/AccountProfile' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Verwaltung]
      summary: Vor- und Nachname, E-Mail und Benutzername ändern; ein neuer Benutzername meldet das Konto auf allen Geräten ab
      description: |
        Der Anzeigename wird „Vorname Nachname“. Felder, die fehlen, bleiben. `phone` bei anderen nur mit
        `manage_personal` (sonst 403); besser `PUT /members/{id}/personal`.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, description: 'Vorname (Pflicht)' }
                last_name: { type: string, description: 'Nachname (darf leer sein)' }
                name: { type: string, deprecated: true, description: 'Früher ein Feld; nur ohne first_name/last_name ausgewertet, das letzte Wort ist dann der Nachname' }
                email: { type: string }
                phone: { type: string, maxLength: 30, description: 'Leer entfernt sie' }
                username: { type: string }
                current_password: { type: string, description: 'Pflicht, wenn jemand die eigene E-Mail-Adresse ändert' }
      responses:
        '200': { $ref: '#/components/responses/AccountProfile' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/personal:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Verwaltung]
      summary: Persönliche Angaben einer Person ändern (E-Mail, Handynummer, Adresse)
      description: |
        Für alle Konten, auch Admins und Ehemalige. Eine andere E-Mail-Adresse nur mit den Grenzen der Kontoverwaltung
        (`GET /members/{id}/account`), denn über sie lässt sich bei WordPress das Passwort zurücksetzen; die eigene nur
        mit `current_password`. Felder, die fehlen, bleiben. Erst wird alles geprüft. Das Geburtsdatum über
        `PUT /members/{id}/birthday`.
      x-capability: manage_personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                phone: { type: string, maxLength: 30, description: 'Leer entfernt sie' }
                address: { $ref: '#/components/schemas/AddressInput' }
                current_password: { type: string, description: 'Pflicht, wenn jemand die eigene E-Mail-Adresse ändert' }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/password:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Verwaltung]
      summary: Neues Startpasswort für ein Mitglied erzeugen
      description: |
        Neu gegenüber der ersten Umsetzung. Ersetzt „Passwort vergessen“ per E-Mail: Ein Admin erzeugt ein
        neues Startpasswort, das nur in dieser Antwort steht. Alle Geräte des Mitglieds
        werden abgemeldet. Wer kein Admin ist, darf das nur bei Anwärtern (auch eigenen Rollen nur mit dem Kalender)
        und Mitgliedern, deren Rechte er selbst hat (ohne create_users und promote_users), nicht bei Gästen und Admins.
      x-capability: create_users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [password]
                properties:
                  password: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/photo:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Verwaltung]
      summary: Foto eines Mitglieds hochladen oder ersetzen
      description: |
        JPG, PNG oder WebP, höchstens 5 MB und 4096 × 4096 Pixel, Base64 im JSON. Geprüft werden Endung und Signatur.
        Gespeichert werden nur neu erzeugte JPEGs in 128, 480 und 1024 Pixeln und, soweit möglich, in
        Originalauflösung (bis 4096, höchstens 3 MB; längere Kante, nie vergrößert, nach EXIF gedreht, ohne
        Metadaten) in der Datenbank. Ein vorhandenes Foto wird ersetzt; die Fassung (und damit
        `photo_url`) ändert sich. Wer kein Admin ist, nur bei Konten, die er verwalten darf (wie `PATCH
        /members/{id}/account`).
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file: { $ref: '#/components/schemas/PhotoFile' }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                required: [photo_url]
                properties:
                  photo_url: { $ref: '#/components/schemas/PhotoUrl' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Foto eines Mitglieds entfernen
      x-capability: create_users
      responses:
        '200':
          description: Entfernt (`photo_url` ist null)
          content:
            application/json:
              schema:
                type: object
                required: [photo_url]
                properties:
                  photo_url: { type: 'null' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/join-year:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Mitgliederliste]
      summary: Eintritt eines Mitglieds eintragen oder ändern
      description: |
        Nur der Eintritt (`date` bzw. `year`, Prüfung wie bei `PUT /me/join-year`). Die Anzeige (`profile`) entscheidet
        allein die Person: Sie bleibt, wie sie ist (ein mitgeschickter Wert wird nicht übernommen); ein neuer Eintrag
        steht nicht auf der Seite.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, examples: ['12.03.2005', '2005'] }
                year: { type: integer, minimum: 1800, description: 'Nur ohne date' }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinYearResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Mitgliederliste]
      summary: Eintrittsjahr eines Mitglieds entfernen
      x-capability: create_users
      responses:
        '200':
          description: Entfernt (`join_year` ist null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinYearResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/birthday:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Geburtstage]
      summary: Geburtstag eines Mitglieds eintragen oder ändern (Issue #1)
      description: |
        Nur das Datum (Prüfung wie bei `PUT /me/birthday`). `visible`, `show_age` und `profile` entscheidet allein die
        Person: Sie bleiben, wie sie sind (mitgeschickte Werte werden nicht übernommen); ein neuer Eintrag ist sichtbar,
        ohne Alter und nicht auf der Seite in der Mitgliederliste.
      x-capability: manage_personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, day]
              properties:
                month: { type: integer, minimum: 1, maximum: 12 }
                day: { type: integer, minimum: 1, maximum: 31 }
                year: { type: [integer, 'null'], minimum: 1900 }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthdayResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Geburtstage]
      summary: Geburtstag eines Mitglieds entfernen
      x-capability: manage_personal
      responses:
        '200':
          description: Entfernt (`birthday` ist null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthdayResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /users:
    post:
      tags: [Verwaltung]
      summary: Mitglied anlegen (oder mit einer Rolle für neue Konten, z. B. Anwärter)
      description: |
        Erzeugt ein zufälliges Startpasswort, das nur in dieser Antwort steht. Es wird keine E-Mail verschickt. `level`:
        `member` oder eine Rolle mit `new_accounts` (`/config` → `roles`), sonst 400. Wer kein Admin ist, nur Rollen mit
        höchstens `member` bzw. `calendar` und `view_intern` oder mit Rechten, die er selbst weitergeben darf (sonst 403).
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name]
              properties:
                first_name: { type: string, description: 'Vorname (Pflicht)' }
                last_name: { type: string, description: 'Nachname (darf leer sein)' }
                name: { type: string, deprecated: true, description: 'Früher ein Feld; nur ohne first_name/last_name ausgewertet, das letzte Wort ist dann der Nachname' }
                username: { type: string, description: 'Optional; erlaubt sind a–z, Ziffern, . _ - @' }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 30, description: 'Handynummer (optional), Prüfung wie bei `PATCH /me/account`' }
                address: { $ref: '#/components/schemas/AddressInput' }
                level: { allOf: [{ $ref: '#/components/schemas/Level' }], default: member, description: 'member oder eine Rolle mit new_accounts' }
                initial_points: { type: integer, minimum: 0, description: 'Anfangsbestand (nur Mitglieder, Bereich Punkte und Recht manage_points)' }
                initial_points_date: { type: string, format: date, description: Datum der Buchung (Standard heute) }
                rank_id: { type: integer, description: 'Dienstgrad (Bereich Dienstgrade, Recht manage_ranks); mit Punkten muss der Anfangsbestand die Schwelle erreichen' }
                birthday: { $ref: '#/components/schemas/BirthdayString' }
                photo:
                  description: Foto (optional), vorab geprüft wie bei `PUT /members/{id}/photo`
                  allOf:
                    - $ref: '#/components/schemas/PhotoFile'
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUser' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /users/bulk:
    post:
      tags: [Verwaltung]
      summary: Mehrere Mitglieder (bzw. mit einer Rolle für neue Konten) auf einmal anlegen (Issue #24)
      description: |
        Höchstens 50. Erst werden alle Einträge geprüft (Namen, Benutzernamen und E-Mail auch untereinander,
        Handynummer, Adresse, Anfangspunkte, Dienstgrad, Geburtstag, Foto); bei einem Fehler wird keiner angelegt, die Meldung nennt die Zeile.
        Scheitert danach doch eines, steht es mit `error` im Ergebnis. Die Ergebnisse stehen in der Reihenfolge von
        `people`. Fotos lassen sich je Person mitschicken; die App lädt sie stattdessen danach einzeln mit `PUT
        /members/{id}/photo` hoch, damit die Anfrage nicht größer wird, als der Server annimmt (`post_max_size`).
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                level: { allOf: [{ $ref: '#/components/schemas/Level' }], default: member, description: 'member oder eine Rolle mit new_accounts' }
                people:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [first_name]
                    properties:
                      first_name: { type: string, description: 'Vorname (Pflicht)' }
                      last_name: { type: string, description: 'Nachname (darf leer sein)' }
                      name: { type: string, deprecated: true, description: 'Früher ein Feld; nur ohne first_name/last_name ausgewertet' }
                      username: { type: string }
                      email: { type: string, format: email }
                      phone: { type: string, maxLength: 30 }
                      address: { $ref: '#/components/schemas/AddressInput' }
                      initial_points: { type: integer, minimum: 0 }
                      initial_points_date: { type: string, format: date }
                      rank_id: { type: integer }
                      birthday: { $ref: '#/components/schemas/BirthdayString' }
                      photo: { $ref: '#/components/schemas/PhotoFile' }
      responses:
        '201':
          description: Ergebnis je Person (angelegt mit Startpasswort oder mit Grund nicht)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/CreatedUser'
                    - type: object
                      properties:
                        name: { type: string }
                        username: { type: string }
                        error: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /points:
    post:
      tags: [Verwaltung]
      summary: Punkte an ein oder mehrere Mitglieder vergeben
      x-capability: manage_points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                points: { type: integer, description: 'Ohne Angabe: Punkte des Katalogeintrags. Nicht 0.' }
                catalog_id: { type: integer }
                reason: { type: string, description: 'Ohne Angabe: Titel des Katalogeintrags.' }
                date: { type: string, format: date }
                attendance_id: { type: integer, description: 'Aus dem Vorschlag einer Anwesenheitsliste (Issue #21): bucht nur für, wer für diese Liste noch keine Punkte hat; sonst 400' }
                apply_factor:
                  type: boolean
                  default: true
                  description: Punktefaktor der Rolle anwenden (z. B. 0,5). false bucht für alle mit Faktor 1.
      responses:
        '201':
          description: Angelegt (ein Eintrag pro Mitglied)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /points/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Verwaltung]
      summary: Punkte stornieren (wird nur ausgeblendet)
      x-capability: manage_points
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /penalties:
    post:
      tags: [Verwaltung]
      summary: Strafe an ein oder mehrere Mitglieder vergeben
      x-capability: manage_penalties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, amount_cents, reason]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                amount_cents: { type: integer, minimum: 1, maximum: 100000 }
                reason: { type: string }
                date: { type: string, format: date }
      responses:
        '201':
          description: Angelegt (eine Strafe pro Mitglied)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Penalty' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /penalties/open:
    get:
      tags: [Verwaltung]
      summary: Alle offenen Strafen, neueste zuerst, mit dem Namen der Person
      x-capability: manage_penalties
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Penalty'
                    - type: object
                      properties:
                        user_name: { type: [string, 'null'], description: '„gelöschtes Konto“, wenn es das Konto nicht mehr gibt' }
        '403': { $ref: '#/components/responses/Error' }

  /penalties/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Strafe als bezahlt/offen markieren
      x-capability: manage_penalties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, paid] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Penalty' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Strafe stornieren (wird nur ausgeblendet)
      x-capability: manage_penalties
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/roles:
    get:
      tags: [Einstellungen]
      summary: Rollen mit Rechten, Punktefaktor und Anzahl der Personen
      description: |
        Jede Person hat genau eine Grundrolle. Fest sind Gast, Mitglied (Rolle neuer Konten) und Admin (nur umbenennen;
        Mitglied und Admin auch mit Punktefaktor; Bezeichnungen bei der Ersteinrichtung aus `kompanie.json`), in der
        Reihenfolge, die der Admin festlegt (`PUT /admin/roles/order`; anfangs Gast, Mitglied, eigene Rollen, Admin).
        Anwärter (Issue #23) sind eine eigene Rolle; die frühere feste Rolle `candidate` bleibt in Installationen, die
        sie hatten, als eigene Rolle mit `new_accounts` und `promotable` erhalten. Schaltet der Admin einen Bereich mit eigenen Rechten ein
        (Termine, Punkte, Strafen), kommt dessen Standardrolle dazu; schaltet er ihn aus, verschwindet sie, wenn niemand sie hat.
        Wer Rollen vergeben darf, ohne Admin zu sein, vergibt nur Rollen mit eigenen Rechten, ohne `create_users` und `promote_users`.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Einstellungen]
      summary: Rolle anlegen
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/roles/order:
    put:
      tags: [Einstellungen]
      summary: Reihenfolge der Rollen
      description: |
        `keys`: alle Rollen, auch `guest`, `member` und `admin`, in der neuen Reihenfolge, jede genau einmal (sonst 400).
        Die Reihenfolge gilt überall, wo Rollen stehen (`/config`, Zusatzrollen; `counts_by_group` der Anwesenheit umgekehrt, von unten nach oben). Neue Rollen kommen ans Ende,
        vor `admin`, wenn der dort steht.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: array, items: { $ref: '#/components/schemas/Level' } }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/roles/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { $ref: '#/components/schemas/Level' } }
    patch:
      tags: [Einstellungen]
      summary: Rolle umbenennen, Rechte oder Punktefaktor ändern (nur mitgeschickte Felder)
      description: |
        Bei guest nur die Bezeichnung, bei member und admin Bezeichnung und Punktefaktor; `new_accounts` und `promotable`
        nur bei eigenen Rollen (`promotable` nur ohne `member`). Ein geänderter Faktor gilt für künftige Buchungen.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Einstellungen]
      summary: Rolle löschen
      description: Sind der Rolle noch Personen zugeordnet, bekommen sie `replacement`; ohne Angabe → 400.
      x-capability: manage_settings
      parameters:
        - { name: replacement, in: query, required: false, schema: { $ref: '#/components/schemas/Level' } }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/features:
    get:
      tags: [Einstellungen]
      summary: Bereiche der App mit Schalter, Bezeichnung und Einrichtungsstand
      description: |
        Welche Bereiche eine Kompanie nutzt, entscheidet allein ihr Admin (Ersteinrichtung bzw. Einstellungen → Bereiche).
        Neue Installationen starten ohne Bereiche. Ein ausgeschalteter Bereich verschwindet aus der App, seine Routen
        antworten mit 403 `feature_disabled`, seine Hintergrundaufgaben laufen nicht; die Daten bleiben erhalten.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Einstellungen]
      summary: Bereiche ein- und ausschalten
      description: Nur mitgeschickte Bereiche werden geändert. Unbekannte Bereiche oder Werte, die kein Wahrheitswert sind → 400.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
              example: { gallery: true, penalties: false }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/activity:
    get:
      tags: [Einstellungen]
      summary: Nutzungsauswertung (Übersicht)
      description: |
        Issue #175. Nur für Admins (`view_activity`, nicht an Rollen vergebbar; bei WordPress auch mit `manage_options`).
        Erfasst wird an den API-Routen für angemeldete Konten mit einer Rolle in der App, nicht in der Vorschau und nicht
        für `/config`, `/auth/*` außer der Anmeldung, den Abgleich der Benachrichtigungen und das Formular zum Fehlermelden:
        nur Bereich, Aktion und Zeit, keine Inhalte, keine IP-Adressen, kein User-Agent. Ansichten zählen höchstens einmal
        je Person, Bereich und 15 Minuten. Einträge je Person (nur mit `personal`) werden nach 90 Tagen gelöscht, die
        Tageszahlen ohne Personenbezug bleiben. Nicht in Sicherungen.
      x-capability: view_activity
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Beginn (JJJJ-MM-TT); Standard 29 Tage vor dem Ende' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Ende einschließlich; Standard heute. Höchstens 366 Tage.' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityOverview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/activity/entries:
    get:
      tags: [Einstellungen]
      summary: Nutzung je Person im Zeitraum (Verlauf, CSV)
      description: Neueste zuerst, höchstens 5000 (`truncated` = es gab mehr). Leer, wenn die Erfassung je Person aus ist.
      x-capability: view_activity
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: user_id, in: query, schema: { type: integer }, description: Nur dieses Konto }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [from, to, entries, truncated]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  truncated: { type: boolean }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/activity/settings:
    put:
      tags: [Einstellungen]
      summary: Erfassung je Person ein- oder ausschalten
      description: Standard an. Ausschalten löscht sofort alle Einträge je Person und „zuletzt aktiv“; gezählt wird dann nur noch ohne Personenbezug.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personal]
              properties:
                personal: { type: boolean }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: object
                required: [personal]
                properties:
                  personal: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/maintenance:
    get:
      tags: [Einstellungen]
      summary: Wartungsmodus mit Verlauf
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Einstellungen]
      summary: Wartungsmodus ein- oder ausschalten, Begründung ändern
      description: |
        Issue #42. Solange er an ist, antworten alle Routen außer `/config`, `/auth/login`, `/auth/logout` und
        `/auth/csrf` für alle ohne `manage_settings` mit 503 `maintenance` (samt `reason`), ebenso geschützte Fotos
        und Dokumente. Hintergrundaufgaben außer Updates und Statusmeldungen pausieren. Jede Änderung kommt in den Verlauf.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['on']
              properties:
                'on': { type: boolean }
                reason: { type: string, maxLength: 500, description: 'Klartext, Zeilenumbrüche bleiben; ohne Angabe bleibt die bisherige Begründung' }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/mail:
    get:
      tags: [Einstellungen]
      summary: Kompanieadresse und SMTP-Einstellungen (Issue #172)
      description: Das SMTP-Passwort wird nie zurückgegeben, nur ob es gesetzt ist.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Einstellungen]
      summary: Kompanieadresse und SMTP ändern
      description: Nur mitgeschickte Felder werden übernommen. Ohne `password` bleibt das Passwort, ein leerer Text löscht es.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: email, description: 'Kompanieadresse (Absender; Antworten und Rückläufer gehen dorthin)' }
                from_name: { type: string, description: 'Absendername; leer: Name der Kompanie' }
                host: { type: string, description: 'SMTP-Server, z. B. smtp.example.org' }
                port: { type: integer, minimum: 1, maximum: 65535 }
                secure: { type: string, enum: [starttls, ssl, none] }
                user: { type: string }
                password: { type: string }
                batch_size: { type: integer, minimum: 0, description: 'Mails je Portion; 0 = so viele wie in einen Lauf passen' }
                batch_pause: { type: integer, minimum: 0, description: 'Minuten Pause zwischen den Portionen; 0 = ohne Pause' }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/mail/check:
    post:
      tags: [Einstellungen]
      summary: Verbindung zum Mailserver prüfen (mit dem gemeldeten Limit SIZE)
      x-capability: manage_settings
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                required: [ok, message, size, settings]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  size: { type: [integer, 'null'], description: 'Gemeldete Höchstgröße in Bytes; null = keine gemeldet' }
                  settings: { $ref: '#/components/schemas/MailSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/mail/test:
    post:
      tags: [Einstellungen]
      summary: Testmail senden
      x-capability: manage_settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email, description: 'Ohne Angabe: die eigene Adresse' }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                required: [sent, message]
                properties:
                  sent: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/settings:
    get:
      tags: [Einstellungen]
      summary: Einstellungen für Google-Zugang, Kalender, Galerie und Neuigkeiten
      description: Geheime Werte (iCal-Adresse, API-Schlüssel, Dienstkonto, Client-Secret, Refresh-Token) werden nie zurückgegeben, nur ob sie gesetzt sind.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Einstellungen]
      summary: Einstellungen ändern
      description: Nur mitgeschickte Felder werden übernommen; ein leerer Text löscht den Wert.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                calendar_ics_url: { type: string, description: 'Geheime iCal-Adresse; webcal:// wird als https:// gespeichert' }
                google_api_key: { type: string }
                calendar_ids: { type: string, description: 'Kommagetrennte Kalender-IDs; gelesen mit API-Schlüssel (öffentliche Kalender) oder über den Google-Zugang' }
                calendar_cache_minutes: { type: integer, minimum: 1, maximum: 1440 }
                drive_service_account: { type: string, description: JSON-Schlüssel des Dienstkontos }
                drive_oauth: { type: string, enum: [''], description: 'Leer trennt die OAuth-Verbindung zu Google wie POST /admin/google/disconnect (Widerruf bei Google, der Client bleibt gespeichert)' }
                gallery_root: { type: string, description: Link oder ID des Galerie-Ordners in Google Drive }
                news_source: { type: string, enum: [none, wordpress, rss], description: Nur eigenständige Version }
                news_url: { type: string, description: Nur eigenständige Version }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/calendar/test:
    post:
      tags: [Einstellungen]
      summary: Kalender ohne Zwischenspeicher abrufen
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, sample]
                properties:
                  count: { type: integer }
                  sample:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      properties:
                        start: { type: string }
                        title: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/news/test:
    post:
      tags: [Einstellungen]
      summary: Quelle der Neuigkeiten ohne Zwischenspeicher abrufen (nur eigenständige Version)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, description: Beiträge auf der ersten Seite }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/google/connect:
    post:
      tags: [Einstellungen]
      summary: „Mit Google verbinden“ beginnen
      description: |
        Speichert den eigenen OAuth-Client der Installation (Client-ID und Client-Secret aus der Google Cloud Console,
        Typ „Webanwendung“) und liefert die Adresse der Anmeldung bei Google. Die App leitet den Browser dorthin.
        Angefragt werden `drive.readonly` und `calendar.readonly` mit `access_type=offline`, `prompt=consent` und
        `include_granted_scopes=true`. Das `state` gilt 15 Minuten, einmal, nur für diesen Admin in dieser Sitzung.

        Google leitet danach an die Weiterleitungs-URI der Installation zurück (`google.redirect_uri` in
        `GET /admin/settings`; eigenständig `<App>/google/callback` bzw. `<App>/index.php?r=/google/callback`, WordPress
        `wp-admin/admin-post.php`). Diese Adresse gehört nicht zur API: Sie tauscht den Code ein, speichert die Verbindung
        und leitet in die App weiter (`<App>?google=1#/einstellungen`); das Ergebnis steht in `google.last_result`.

        Ein anderer Client als bisher trennt eine bestehende Verbindung (Refresh-Token, E-Mail und `scope` werden geleert).
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, description: 'Endet auf .apps.googleusercontent.com' }
                client_secret: { type: string, description: 'Leer oder fehlend behält das gespeicherte (nur bei gleicher Client-ID)' }
      responses:
        '200':
          description: Adresse der Anmeldung bei Google
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/google/disconnect:
    post:
      tags: [Einstellungen]
      summary: Verbindung mit Google trennen
      description: Widerruft das Refresh-Token bei Google (Fehler dabei werden ignoriert) und löscht es; Client-ID, Client-Secret und Dienstkonto bleiben.
      x-capability: manage_settings
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/gallery/sync:
    post:
      tags: [Einstellungen]
      summary: Galerie von Hand abgleichen und Bilder aufbereiten
      description: |
        Gleicht mit Google Drive ab und bereitet Bilder auf, solange das Zeitbudget reicht (etwa 20 Sekunden).
        Steht danach noch etwas aus (`pending` > 0), ruft die App mit `only_process: true` erneut auf.
      x-capability: manage_settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                only_process: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums: { type: integer }
                  photos: { type: integer }
                  processed: { type: integer }
                  pending: { type: integer }
                  failed: { type: integer, description: 'Bilder, die sich nicht laden ließen (der nächste Abgleich versucht sie erneut, höchstens fünfmal; Liste unter /admin/gallery/failed)' }
                  error: { type: string, description: Fehler des Abgleichs, sonst leer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/gallery/failed:
    get:
      tags: [Einstellungen]
      summary: Bilder, die sich nicht laden ließen, mit Album und Fehlermeldung
      description: Höchstens 200, neueste Alben zuerst; `total` ist die Gesamtzahl.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [photos, total]
                properties:
                  total: { type: integer }
                  photos:
                    type: array
                    items:
                      type: object
                      required: [id, name, album, intern, error, attempts, unsupported, drive_url]
                      properties:
                        id: { type: integer }
                        name: { type: string, description: Dateiname in Google Drive }
                        album: { type: string, description: '„Jahr · Album“' }
                        intern: { type: boolean }
                        error: { type: string, description: Fehlermeldung der letzten Aufbereitung }
                        attempts: { type: integer }
                        unsupported: { type: boolean, description: 'Video in einem Format, das die Galerie nicht abspielt (nur MP4 und WebM); ohne Versuche' }
                        drive_url: { type: string, description: Adresse der Datei in Google Drive }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/gallery/retry:
    post:
      tags: [Einstellungen]
      summary: Alle Bilder, die sich nicht laden ließen, erneut aufbereiten
      description: Reiht sie wieder ein, auch nach fünf gescheiterten Versuchen; aufbereitet wird wie sonst (Aufgabe bzw. /admin/gallery/sync).
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [retried, pending]
                properties:
                  retried: { type: integer }
                  pending: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/push:
    get:
      tags: [Einstellungen]
      summary: Stand der Benachrichtigungen (Geräte, Warteschlange, Uhrzeit der Erinnerung)
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/PushAdmin' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Einstellungen]
      summary: Uhrzeit der Erinnerung an Termine am nächsten Tag und Benachrichtigung am Geburtstag ändern
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reminder_hour: { type: integer, minimum: 0, maximum: 23 }
                birthday_notify: { type: boolean, description: 'Benachrichtigung am Geburtstag an oder aus (Standard an)' }
                birthday_hour: { type: integer, minimum: 0, maximum: 23, description: 'Ab dieser Stunde (Ortszeit) am Geburtstag benachrichtigen (Standard 7)' }
      responses:
        '200': { $ref: '#/components/responses/PushAdmin' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/birthdays:
    get:
      tags: [Einstellungen]
      summary: Einstellungen der Geburtstage (Vorlauf der Karte „Anstehende Geburtstage“)
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/BirthdaySettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Einstellungen]
      summary: Vorlauf der Karte „Anstehende Geburtstage“ ändern
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upcoming_days]
              properties:
                upcoming_days: { type: integer, minimum: 0, maximum: 30, description: 'Anstehend: heute und die nächsten N Tage (0 = nur heute, Standard 7)' }
      responses:
        '200': { $ref: '#/components/responses/BirthdaySettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/status:
    get:
      tags: [Wartung]
      summary: Zustand der Installation (Ampel), Updates, Statusmeldungen, Fehlerprotokoll
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, support, updates, statusReports, setupDone, errorLog]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, label, level, text]
                      properties:
                        key: { type: string, description: 'z. B. updates, gallery, calendar, backup, server' }
                        label: { type: string }
                        level: { type: string, enum: [ok, warn, error, off] }
                        text: { type: string }
                  support: { type: string, description: Kontakt für Hilfe (E-Mail oder Webadresse), sonst leer }
                  updates: { $ref: '#/components/schemas/UpdateStatus' }
                  statusReports:
                    type: object
                    properties:
                      enabled: { type: boolean, description: Der Admin hat Statusmeldungen zugestimmt }
                      available: { type: boolean, description: Das Paket nennt einen Empfänger }
                      payload: { type: object, description: 'Genau das, was gesendet würde (ohne Namen oder Inhalte), Format 3 mit usage (ActivityUsage und areas: Personen je Bereich in 30 Tagen)' }
                  setupDone: { type: boolean }
                  errorLog: { $ref: '#/components/schemas/ErrorLog' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/error-log:
    delete:
      tags: [Wartung]
      summary: Fehlerprotokoll der Installation leeren
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [errorLog]
                properties:
                  errorLog: { $ref: '#/components/schemas/ErrorLog' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/update/check:
    post:
      tags: [Wartung]
      summary: Update-Liste jetzt laden und prüfen (Signatur, Kompanie, laufende Nummer)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update/install:
    post:
      tags: [Wartung]
      summary: Eine Version aus der geprüften Liste einspielen
      description: |
        Vorher wird automatisch auf dem Server gesichert und, wenn die Sicherungen in Google Drive eingeschaltet sind,
        zusätzlich dort. Scheitert nur Google Drive: 409 mit Code `drive_backup_failed`, nichts eingespielt; nach
        Rückfrage mit `without_drive` true erneut aufrufen. Eine neue Hauptversion nur mit `major` true. Im Kanal
        stable nur schon freigegebene Versionen. 409 (`update_running`), wenn gerade schon ein Update läuft.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: 1.4.0.3 }
                major: { type: boolean, default: false }
                without_drive: { type: boolean, default: false, description: Auch einspielen, wenn die Sicherung in Google Drive scheitert }
      responses:
        '200':
          description: Eingespielt
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update/held:
    post:
      tags: [Wartung]
      summary: Zurückgestelltes automatisches Update trotzdem einspielen
      description: |
        Ein automatisches Update wird zurückgestellt (`held` im Zustand), wenn die Sicherung in Google Drive davor
        scheitert. Damit wird es ohne Google Drive eingespielt; auf dem Server wird weiter vorher gesichert.
      x-capability: manage_settings
      responses:
        '200':
          description: Eingespielt
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Wartung]
      summary: Zurückgestelltes automatisches Update nicht einspielen
      description: Der nächste tägliche Abgleich versucht es wieder, mit Sicherung in Google Drive.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update/rollback:
    post:
      tags: [Wartung]
      summary: Auf eine ältere Version derselben Hauptversion zurück
      description: |
        Die bisherige Version wird danach beim automatischen Update übersprungen, bis eine neuere erscheint. Gesichert
        wird vorher wie bei `/admin/update/install` (409 `drive_backup_failed`, dann mit `without_drive` true).
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                without_drive: { type: boolean, default: false, description: Auch einspielen, wenn die Sicherung in Google Drive scheitert }
      responses:
        '200':
          description: Eingespielt
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update:
    get:
      tags: [Wartung]
      summary: Stand der Updates (ohne die übrige Statusseite), z. B. für die Fortschrittsanzeige während eines Updates
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Wartung]
      summary: Automatische Updates, Kanal und Statusmeldungen einstellen
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto: { type: boolean }
                channel:
                  type: string
                  enum: [stable, early]
                  description: stable = freigegebene Versionen; early = jede neue Version von develop (Vorabversionen zum Testen)
                status_reports: { type: boolean, description: Zustimmung zu täglichen Statusmeldungen }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/backup:
    get:
      tags: [Wartung]
      summary: Datensicherung herunterladen
      description: |
        Gemeinsames Format `kompanie-app-backup` (Tabellen, Einstellungen und Konten mit Passwort-Hashes:
        eigenständige Version in `tables.users`, WordPress als `accounts` mit den Benutzern der Website;
        dazu unter `files` die Dateien der Dokumente und Abzeichen als Base64 sowie die Push-Abos).
        Enthält Zugangsschlüssel – sicher aufbewahren.
      x-capability: manage_settings
      responses:
        '200':
          description: Sicherung (mit Content-Disposition attachment)
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Wartung]
      summary: Sicherung wiederherstellen (ersetzt alle Daten)
      description: |
        Eigenständige Version: nur Sicherungen der eigenständigen Version mit mindestens einem Admin;
        alle Sitzungen enden. WordPress: nur Sicherungen derselben Website; fehlende Konten werden mit
        ihrer ID angelegt (nur mit den WP-Rechten create_users und promote_users), vorhandene behalten
        Anmeldedaten. Passt eine ID nicht zum Benutzernamen, wird nichts geändert (400).
        Verschlüsselte Sicherungen (beginnen mit `KOMPANIE-BACKUP-ENC`) als `backup_base64` mit `passphrase`;
        ohne Passwort 400 `passphrase_required`, mit falschem 400.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                backup: { type: string, description: Inhalt der Sicherungsdatei (JSON) }
                backup_base64: { type: string, description: Inhalt der Sicherungsdatei als Base64 (verschlüsselte Sicherung) }
                passphrase: { type: string, description: Passwort für Sicherungen (nur für verschlüsselte) }
                confirm: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Wiederhergestellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /admin/backup/encryption:
    get:
      tags: [Wartung]
      summary: Passwort für Sicherungen – Stand
      description: |
        Mit Passwort sind heruntergeladene Sicherungen (`<App>/sicherung?verschluesselt=1`) und alle Sicherungen in
        Google Drive verschlüsselt (Argon2id, X25519, XChaCha20-Poly1305). Gespeichert wird nur der öffentliche
        Schlüssel; ohne das Passwort lässt sich eine verschlüsselte Sicherung nicht wiederherstellen. Verschlüsselt
        herunterladen geht erst, wenn das Passwort einmal geprüft ist (`verified`, sonst 409).
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/BackupEncryptionStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Wartung]
      summary: Passwort für Sicherungen einrichten oder ändern
      description: Mindestens 12 Zeichen, beide gleich (sonst 400). Ältere Sicherungen brauchen weiter das bisherige Passwort.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase, passphrase_confirm]
              properties:
                passphrase: { type: string, minLength: 12 }
                passphrase_confirm: { type: string }
      responses:
        '200': { $ref: '#/components/responses/BackupEncryptionStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Wartung]
      summary: Passwort für Sicherungen entfernen (neue Sicherungen unverschlüsselt, auch die in Google Drive)
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/BackupEncryptionStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/backup/encryption/verify:
    post:
      tags: [Wartung]
      summary: Passwort für Sicherungen prüfen
      description: Nach 10 Fehlversuchen in 15 Minuten 15 Minuten gesperrt (429); richtige Passwörter zählen nicht.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase: { type: string }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /admin/former/retention:
    get:
      tags: [Verwaltung]
      summary: Aufbewahrungsfrist für Ehemalige – Stand mit Vorschau
      description: |
        Mit Frist (years > 0) löscht eine tägliche Aufgabe bei Ehemaligen so viele Jahre nach dem Ausscheiden die
        persönlichen Angaben (Kontaktdaten, Anmeldung, Geburtstag, Strafen, Anwesenheiten, Umfragen, Push, Signatur,
        Einstellungen, Nutzungsauswertung); Name, Eintrag als ehemalig, Ämter, Punkte, Dienstgrad, Titel, Foto und
        Eintrittsjahr bleiben als Chronik. Stichtag: Datum des Ausscheidens (nur Jahr: 31.12.), ohne Datum der Tag des
        Eintragens.
        `due`: beim nächsten Lauf fällig, `soon`: in den nächsten 30 Tagen.
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/FormerRetention' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Verwaltung]
      summary: Aufbewahrungsfrist für Ehemalige einstellen (0 = aus)
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [years]
              properties:
                years: { type: integer, minimum: 0, maximum: 50 }
                preview: { type: boolean, description: 'Nur die Vorschau (due/soon) für diese Werte, ohne zu speichern' }
      responses:
        '200': { $ref: '#/components/responses/FormerRetention' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/backup/drive:
    get:
      tags: [Wartung]
      summary: Sicherungen in Google Drive – Stand
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/BackupDriveStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Wartung]
      summary: Sicherungen in Google Drive ein- oder ausschalten
      description: |
        Einschalten braucht eine Verbindung über „Mit Google verbinden“, bei der Google die Berechtigung
        drive.file erlaubt hat (sonst 400). Die App lädt dann einmal pro Woche eine Sicherung in einen eigenen Ordner
        im verbundenen Google-Konto und behält die letzten acht: mit Passwort für Sicherungen verschlüsselt
        (`.json.enc`), ohne unverschlüsselt (`.json`). Ist ein Passwort eingerichtet, fehlt aber die Erweiterung
        sodium, scheitert das Hochladen (statt unverschlüsselt).
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/BackupDriveStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/backup/drive/upload:
    post:
      tags: [Wartung]
      summary: Sicherung jetzt in Google Drive hochladen
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/BackupDriveStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /admin/setup/done:
    post:
      tags: [Wartung]
      summary: Einrichtungsassistent abschließen (setupPending wird danach false)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  done: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

security:
  - session: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Name und Inhalt des Cookies hängen vom Adapter ab (WordPress-Anmelde-Cookie bzw. eigene Sitzung).

  parameters:
    Preview:
      name: X-Kompanie-Preview
      in: header
      required: false
      description: |
        Vorschau „App als Rolle ansehen“ (Issue #63): Schlüssel einer Rolle (nicht `admin`) oder `@public`. Gilt nur für
        Admins und für jede Route; statt des Headers geht auch der Parameter `?vorschau=…` (so bei Dateien).
      schema: { type: string, maxLength: 32 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    InventoryLogLimit:
      name: limit
      in: query
      required: false
      description: Höchstens so viele Einträge (Standard 100).
      schema: { type: integer, minimum: 1, maximum: 500 }
    InventoryLogBefore:
      name: before
      in: query
      required: false
      description: Nur Einträge mit kleinerer ID (nächste Seite).
      schema: { type: integer, minimum: 1 }

  responses:
    PreviewReadonly:
      description: 'In der Vorschau (Header `X-Kompanie-Preview` oder Parameter `vorschau`) ist nur Ansehen möglich: `code: preview_readonly`, „In der Vorschau kannst du nichts ändern.“'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BackupDriveStatus:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [available, access, enabled, encrypted, email, folder_url, last_ok, last_try, error, every_days, keep]
            properties:
              available: { type: boolean, description: Datensicherung und Verbindung über „Mit Google verbinden“ vorhanden }
              access: { type: boolean, description: Google hat drive.file erlaubt }
              enabled: { type: boolean }
              encrypted: { type: boolean, description: Mit Passwort für Sicherungen verschlüsselt (.json.enc), sonst unverschlüsselt (.json) }
              email: { type: string, description: Verbundenes Google-Konto ('' wenn unbekannt) }
              folder_url: { type: [string, 'null'] }
              last_ok: { type: [integer, 'null'], description: Letztes erfolgreiches Hochladen (Unix-Zeit) }
              last_try: { type: [integer, 'null'] }
              error: { type: [string, 'null'], description: Fehler beim letzten Versuch }
              every_days: { type: integer }
              keep: { type: integer }
    FormerRetention:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [years, due, soon]
            properties:
              years: { type: integer, description: 0 = aus }
              due:
                type: array
                items: { $ref: '#/components/schemas/FormerRetentionPerson' }
              soon:
                type: array
                items: { $ref: '#/components/schemas/FormerRetentionPerson' }
    BackupEncryptionStatus:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [available, configured, stored, verified, fingerprint, set_at, min_length]
            properties:
              available: { type: boolean, description: PHP hat die Erweiterung sodium }
              configured: { type: boolean, description: Eingerichtet und nutzbar (mit sodium) }
              stored: { type: boolean, description: 'Eingerichtet, auch wenn sodium fehlt (dann lässt es sich nur entfernen)' }
              verified: { type: boolean, description: 'Seit dem Einrichten einmal richtig geprüft; erst dann löscht Google Drive alte unverschlüsselte Sicherungen' }
              fingerprint: { type: [string, 'null'], description: 'Fingerabdruck des öffentlichen Schlüssels, z. B. „3f2a 9c41 07be d5e0“' }
              set_at: { type: [integer, 'null'], description: Eingerichtet am (Unix-Zeit) }
              min_length: { type: integer }
    PushStatus:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [supported, publicKey, types, subscription]
            properties:
              supported: { type: boolean }
              publicKey: { type: string }
              types:
                type: array
                description: Arten, die dieser Anfragende abonnieren kann (nach Bereichen und Rechten)
                items:
                  type: object
                  required: [key, label]
                  properties:
                    key: { $ref: '#/components/schemas/PushType' }
                    label: { type: string }
              subscription:
                oneOf:
                  - type: 'null'
                  - $ref: '#/components/schemas/PushSubscriptionInfo'
    PushSubscription:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PushSubscriptionInfo' }
    PushTest:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              sent: { type: boolean }
    BirthdaySettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [upcoming_days]
            properties:
              upcoming_days: { type: integer, minimum: 0, maximum: 30, description: 'Anstehend: heute und die nächsten N Tage (Standard 7)' }
    PushAdmin:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [supported, missing, devices, accounts, guests, queued, reminderHour, birthdays]
            properties:
              supported: { type: boolean }
              missing: { type: array, items: { type: string }, description: Fehlende PHP-Voraussetzungen }
              devices: { type: integer }
              accounts: { type: integer }
              guests: { type: integer }
              queued: { type: integer, description: Nachrichten in der Warteschlange }
              reminderHour: { type: integer, minimum: 0, maximum: 23 }
              birthdays:
                type: [object, 'null']
                description: Benachrichtigung am Geburtstag; null ohne den Bereich Geburtstage
                required: [enabled, hour]
                properties:
                  enabled: { type: boolean }
                  hour: { type: integer, minimum: 0, maximum: 23 }
    Error:
      description: Fehler
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountProfile:
      description: Angaben eines Kontos
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, description: 'Anzeigename „Vorname Nachname“' }
              first_name: { type: string }
              last_name: { type: string, description: 'Leer, wenn es keinen gibt' }
              login: { type: string }
              email: { type: string }
              phone: { type: string, description: 'Handynummer; leer, wenn keine hinterlegt ist oder der Betrachter view_personal nicht hat' }
              can_change_login: { type: boolean, description: 'Ob sich der Benutzername ändern lässt; ein neuer meldet das Konto auf allen Geräten ab (das eigene: dieses bleibt angemeldet)' }
              can_export: { type: boolean, description: 'Ob der Betrachter die Auskunft (GET /members/{id}/data) bekommt' }
    OwnAccount:
      description: Eigene Kontaktangaben
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonalInfo' }
    AttendanceGroups:
      description: Je Rolle (ohne Gast), als welche sie im Zähler zählt
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                key: { type: string }
                label: { type: string }
                counts_as: { type: [string, 'null'], description: null = eigene Gruppe }
    Deleted:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean }

  schemas:
    InventoryItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        quantity: { type: number, minimum: 0, description: 'Bis zu drei Nachkommastellen' }
        unit: { type: [string, 'null'] }
        location: { type: string }
        category: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        created_by_name: { type: [string, 'null'], description: '„gelöschtes Konto“, wenn es das Konto nicht mehr gibt' }
        created_at: { type: string, format: date-time }
        updated_by_name: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
    InventoryInput:
      type: object
      required: [title, location]
      properties:
        title: { type: string, maxLength: 100 }
        quantity:
          description: 0 oder mehr, höchstens drei Nachkommastellen; Zahl oder Text mit Komma oder Punkt.
          oneOf:
            - { type: number, minimum: 0 }
            - { type: string }
        location: { type: string, maxLength: 100 }
        unit: { type: [string, 'null'], maxLength: 20 }
        category: { type: [string, 'null'], maxLength: 100 }
        note: { type: [string, 'null'], maxLength: 1000 }
        reason: { type: [string, 'null'], maxLength: 255, description: Steht im Verlauf. }
    InventoryPatch:
      type: object
      properties:
        title: { type: string, maxLength: 100 }
        quantity:
          oneOf:
            - { type: number, minimum: 0 }
            - { type: string }
        adjust:
          description: Änderung der Menge, z. B. 1 oder -1 (nicht zusammen mit quantity).
          oneOf:
            - { type: number }
            - { type: string }
        location: { type: string, maxLength: 100 }
        unit: { type: [string, 'null'], maxLength: 20 }
        category: { type: [string, 'null'], maxLength: 100 }
        note: { type: [string, 'null'], maxLength: 1000 }
        reason: { type: [string, 'null'], maxLength: 255 }
    InventoryLogEntry:
      type: object
      properties:
        id: { type: integer }
        item_id: { type: integer }
        action: { type: string, enum: [create, update, move, delete] }
        changes:
          type: object
          description: |
            Feld => {old, new} für jedes geänderte Feld (title, quantity, unit, location, category, note; Mengen als Zahl,
            leere Texte als ""). Beim Umlagern zusätzlich `move` = {from, to, quantity, source_id, target_id, source_removed?}.
          additionalProperties: true
        reason: { type: [string, 'null'] }
        title: { type: string, description: Bezeichnung zum Zeitpunkt der Änderung }
        unit: { type: [string, 'null'], description: Einheit zum Zeitpunkt der Änderung }
        location: { type: string, description: Ort zum Zeitpunkt der Änderung }
        user_id: { type: integer }
        user_name: { type: [string, 'null'], description: '„gelöschtes Konto“, wenn es das Konto nicht mehr gibt' }
        created_at: { type: string, format: date-time }
    BoardInput:
      type: object
      required: [title, text]
      properties:
        title: { type: string, description: 'Titel (reiner Text, eine Zeile, keine Längengrenze); Banner, Benachrichtigung und Betreff der Mail. Leer → 400.' }
        text:
          type: string
          description: |
            Formatierter Inhalt (HTML), ohne Längengrenze. Der Server lässt nur eine Allowlist stehen (Absätze, Überschriften,
            Hervorhebungen, Listen, Links mit https:/mailto:/tel:, Bilder über data-image, Trennlinie, einfache Tabellen,
            Inline-Styles für Schrift, Farben, Ausrichtung, Einzug). Ohne sichtbaren Inhalt → 400.
        expires_at:
          type: [string, 'null']
          description: |
            Sichtbar bis: ISO 8601 mit Zeitzone (`Z` oder `±hh:mm`) oder `JJJJ-MM-TTTHH:MM` ohne Zeitzone (Zeitzone der
            Kompanie). Gespeichert in UTC. Muss in der Zukunft liegen, keine Obergrenze. Ohne Angabe 24 Stunden.
        push:
          type: boolean
          default: true
          description: Nur beim Schreiben (POST); false veröffentlicht ohne Benachrichtigung.
        mail:
          type: boolean
          description: 'Nur beim Schreiben (POST); Standard: true, wenn der Mailversand eingerichtet ist. true ohne Einrichtung → 400.'
        attachments:
          type: array
          items: { type: string, pattern: '^[a-f0-9]{32}$' }
          description: 'Kennungen von Anhängen (eigene Entwürfe aus `POST /attachments`); sonst → 400'
    BoardItem:
      type: object
      required: [kind, id, title, text, excerpt, author_name, created_at, updated_at, expires_at]
      properties:
        kind: { type: string, enum: [message], description: 'Art des Eintrags; weitere können dazukommen' }
        id: { type: integer }
        title: { type: string }
        text: { type: string, description: 'Bereinigter formatierter Inhalt (HTML); Bilder mit src (Adresse der App) und data-image' }
        excerpt: { type: string, description: Reiner Textauszug (z. B. für den Text-Teil der Mail) }
        author_name: { type: [string, 'null'], description: '„gelöschtes Konto“, wenn das Konto des Verfassers gelöscht wurde' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: 'Wechselt, wenn sich Titel, Inhalt oder Anhänge ändern' }
        expires_at: { type: string, format: date-time, description: 'Sichtbar bis (UTC); standardmäßig 24 Stunden nach created_at' }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' }, description: 'Dateianhänge; sehen alle, die die Nachricht sehen' }
        last_edit:
          description: 'Nur mit post_board: wer zuletzt Titel, Inhalt oder Enddatum geändert hat (null: unverändert)'
          oneOf:
            - type: 'null'
            - type: object
              properties:
                name: { type: [string, 'null'] }
                at: { type: string, format: date-time }
        mail:
          description: 'Nur mit post_board: Stand des Mailversands (null: ohne Mail)'
          oneOf: [{ $ref: '#/components/schemas/BoardMailSummary' }, { type: 'null' }]
    BoardMailSummary:
      type: object
      properties:
        recipients: { type: integer }
        sent: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        cancelled: { type: integer, description: 'Nicht mehr verschickt, weil die Nachricht gelöscht wurde' }
    Attachment:
      type: object
      required: [uid, name, size, mime, url]
      properties:
        uid: { type: string, description: 'Kennung (32 Hex-Zeichen)' }
        name: { type: string, description: Dateiname }
        size: { type: integer, description: Bytes }
        mime: { type: string, description: 'Typ aus der Endung (für die Mail), sonst application/octet-stream' }
        url: { type: string, description: 'Download nach Anmeldung (<App>/anhang/<uid>), immer als Anhang (Content-Disposition attachment)' }
    MailSelection:
      type: object
      description: Empfänger eines Felds (An, Cc oder Bcc)
      properties:
        groups: { type: array, items: { type: string }, description: 'Mailgruppen (`members`, `all` oder eigene); fehlt = keine' }
        roles: { type: array, items: { type: string }, description: Schlüssel von Rollen (ohne guest); Grund- und Zusatzrollen zählen }
        users: { type: array, items: { type: integer }, description: Konten (ohne Gäste) }
        emails: { type: array, items: { type: string, format: email }, maxItems: 500, description: Freie Adressen }
    MailSelectionInput:
      type: object
      properties:
        to: { $ref: '#/components/schemas/MailSelection' }
        cc: { $ref: '#/components/schemas/MailSelection' }
        bcc: { $ref: '#/components/schemas/MailSelection' }
    MailSelectionDescribed:
      type: object
      properties:
        groups: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string, description: 'Aktuelle Bezeichnung, „Gelöschte Gruppe“ wenn es sie nicht mehr gibt' } } } }
        roles: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string } } } }
        users: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: [string, 'null'] } } } }
        emails: { type: array, items: { type: string } }
    MailGroup:
      type: object
      required: [key, label, standard, roles, users, emails, members, with_email]
      properties:
        key: { type: string, description: 'members, all oder Kennung einer eigenen Gruppe' }
        label: { type: string }
        standard: { type: boolean, description: 'Standardgruppe: Inhalt bestimmt die App, nur umbenennbar, nicht löschbar' }
        roles: { type: array, items: { type: string }, description: 'Rollen (nur eigene Gruppen; nur noch bestehende)' }
        users: { type: array, items: { type: integer }, description: 'Konten (nur eigene Gruppen; ohne Ehemalige und Gelöschte)' }
        emails: { type: array, items: { type: string, format: email }, description: 'Freie Adressen (nur eigene Gruppen)' }
        members: { type: integer, description: Erreichbare Konten }
        with_email: { type: integer, description: Davon mit gültiger Adresse }
    MailGroupInput:
      type: object
      properties:
        label: { type: string, maxLength: 60 }
        roles: { type: array, items: { type: string } }
        users: { type: array, items: { type: integer } }
        emails: { type: array, items: { type: string, format: email }, maxItems: 500 }
    MailDetail:
      type: object
      required: [id, subject, text, author_name, created_at, selection, mail, log]
      properties:
        id: { type: integer }
        subject: { type: string }
        text: { type: string, description: 'Formatierter Inhalt (HTML), Bilder mit Adresse' }
        author_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        selection:
          type: object
          properties:
            to: { $ref: '#/components/schemas/MailSelectionDescribed' }
            cc: { $ref: '#/components/schemas/MailSelectionDescribed' }
            bcc: { $ref: '#/components/schemas/MailSelectionDescribed' }
        mail: { $ref: '#/components/schemas/BoardMailSummary' }
        log:
          type: array
          items:
            type: object
            properties:
              field: { type: string, enum: [to, cc, bcc] }
              name: { type: [string, 'null'], description: null bei freien Adressen }
              email: { type: string }
              status: { type: string, enum: [pending, sent, failed, cancelled] }
              attempts: { type: integer }
              error: { type: [string, 'null'] }
              at: { type: [string, 'null'], format: date-time }
    BoardEndedItem:
      type: object
      description: Nachricht im Verlauf (auch abgelaufen oder gelöscht)
      properties:
        id: { type: integer }
        title: { type: string }
        text: { type: string }
        excerpt: { type: string }
        author_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: 'Ende (bei gelöschten der Zeitpunkt des Löschens)' }
        deleted_at: { type: [string, 'null'], format: date-time }
        deleted_by_name: { type: [string, 'null'] }
        active: { type: boolean, description: Noch sichtbar }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
    BoardRevision:
      type: object
      properties:
        id: { type: integer }
        action: { type: string, enum: [created, title, content, expires, attachments, deleted, mailed] }
        user_name: { type: [string, 'null'], description: '„gelöschtes Konto“, wenn es das Konto nicht mehr gibt' }
        at: { type: string, format: date-time }
        before: { description: 'Vorheriger Stand (Titel, Inhalt als HTML, Enddatum, bei attachments die Dateinamen; bei deleted {expires_at}); null bei created und mailed' }
        after: { description: 'Neuer Stand; bei created {title, text, expires_at, attachments?}, bei attachments die Dateinamen, bei mailed {recipients}, bei deleted null' }
    SignatureResponse:
      type: object
      required: [signature]
      properties:
        signature:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                content: { type: string, description: Formatierter Inhalt mit Bildadressen }
                updated_at: { type: [string, 'null'], format: date-time }
    MailPreference:
      type: object
      required: [board, available, email]
      properties:
        board: { type: boolean, description: 'Mails vom Brett gewünscht (Standard true)' }
        available: { type: boolean, description: Mailversand eingerichtet und das Konto ist Empfänger des Bretts }
        email: { type: boolean, description: Mailadresse hinterlegt }
    MailSettings:
      type: object
      properties:
        from: { type: string }
        from_name: { type: string }
        from_name_default: { type: string, description: Name der Kompanie }
        host: { type: string }
        port: { type: integer }
        secure: { type: string, enum: [starttls, ssl, none] }
        user: { type: string }
        password_set: { type: boolean }
        configured: { type: boolean }
        unavailable: { type: [string, 'null'], description: 'Warum der Mailversand auf diesem Server nicht geht (PHPMailer fehlt)' }
        server_max_size: { type: [integer, 'null'], description: 'Zuletzt gemeldete Höchstgröße (SIZE) in Bytes' }
        pending: { type: integer, description: Wartende Mails }
        batch_size: { type: integer }
        batch_pause: { type: integer }
    BoardPollItem:
      type: object
      description: Laufende Umfrage am Schwarzen Brett (Issue #4), nur für Mitglieder
      required: [kind, id, title, type, ends_at, expires_at, has_voted, created_at, updated_at]
      properties:
        kind: { type: string, enum: [poll] }
        id: { type: integer }
        title: { type: string }
        type: { type: string, enum: [single, multiple, text] }
        ends_at: { type: [string, 'null'], format: date-time, description: 'null = läuft, bis sie vorzeitig beendet wird' }
        expires_at: { type: [string, 'null'], format: date-time, description: Wie ends_at (danach blendet die App den Eintrag aus) }
        has_voted: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: 'Wechselt bei jeder Änderung (Ausblenden je Gerät gilt bis dahin)' }
    PollInput:
      type: object
      required: [title, type]
      properties:
        title: { type: string, maxLength: 150, description: Die Frage }
        description: { type: string, maxLength: 1000, description: Optional, reiner Text mit Zeilenumbrüchen }
        type: { type: string, enum: [single, multiple, text], description: 'Einfachauswahl, Mehrfachauswahl oder Freitext' }
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: { type: string, maxLength: 100 }
          description: 'Nur bei single und multiple: 2–20 verschiedene Möglichkeiten (leere werden übersprungen); bei text ignoriert'
        anonymous: { type: boolean, default: false }
        results: { type: string, enum: [after_vote, after_end, managers], default: after_vote }
        ends_at:
          type: [string, 'null']
          description: 'Optional: „JJJJ-MM-TTTHH:MM“ in der Zeitzone der Kompanie oder ISO 8601 mit Zeitzone; muss in der Zukunft liegen. Gespeichert in UTC.'
    PollPatch:
      type: object
      properties:
        title: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 1000 }
        type: { type: string, enum: [single, multiple, text] }
        options: { type: array, items: { type: string, maxLength: 100 } }
        anonymous: { type: boolean }
        results: { type: string, enum: [after_vote, after_end, managers] }
        ends_at: { type: [string, 'null'] }
    PollVote:
      type: object
      properties:
        option_ids: { type: array, items: { type: integer }, description: 'single: genau eine, multiple: mindestens eine' }
        text: { type: string, maxLength: 1000, description: Nur bei Freitext }
    Poll:
      type: object
      required: [id, title, description, type, anonymous, results, status, ends_at, closed_at, created_at, updated_at, created_by_name, options, locked, has_voted, my_answer, results_visible, results_data]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [single, multiple, text] }
        anonymous: { type: boolean }
        results: { type: string, enum: [after_vote, after_end, managers], description: Wer die Ergebnisse sieht }
        status: { type: string, enum: [running, ended] }
        ends_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time, description: Vorzeitig beendet }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by_name: { type: [string, 'null'] }
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
        locked: { type: boolean, description: 'Es gibt Antworten: Art, Möglichkeiten, Anonymität und Sichtbarkeit fest' }
        has_voted: { type: boolean }
        my_answer:
          type: [object, 'null']
          description: Nur die eigene Antwort (auch bei anonymen Umfragen, nur für einen selbst)
          properties:
            option_ids: { type: array, items: { type: integer } }
            text: { type: [string, 'null'] }
        results_visible: { type: boolean }
        results_data:
          type: [object, 'null']
          description: null, solange die Ergebnisse für dieses Konto nicht sichtbar sind
          properties:
            voters: { type: integer, description: Zahl der Teilnehmenden }
            options:
              type: array
              description: Bei single und multiple
              items:
                type: object
                properties:
                  id: { type: integer }
                  title: { type: string }
                  count: { type: integer }
                  percent: { type: integer, description: 'Anteil der Teilnehmenden, gerundet (bei multiple zusammen über 100)' }
                  names: { type: array, items: { type: string }, description: Nur bei namentlichen Umfragen }
            texts:
              type: array
              description: Bei text
              items:
                type: object
                properties:
                  text: { type: string }
                  name: { type: string, description: Nur bei namentlichen Umfragen }
    PushType:
      type: string
      enum: [board, polls, birthdays, penalties, points, ranks, titles, events, reminder, news]
      description: '`board` (Schwarzes Brett, Issue #5) nur für Mitglieder und Anwärter; dringend (Urgency high), TTL höchstens bis zum Ablauf der Nachricht. `polls` (Umfragen, Issue #4) nur für Mitglieder: neue Umfrage und Erinnerung 24 Stunden vor dem Ende an alle ohne Antwort. `birthdays` (Geburtstage, Issue #1) nur für Mitglieder: am Tag selbst ab 7 Uhr (Zeitzone der Kompanie), nicht an das Geburtstagskind, nur für sichtbare Geburtstage; TTL bis Mitternacht.'
    PushSubscribe:
      type: object
      required: [endpoint, keys]
      description: Angaben aus `PushSubscription.toJSON()` des Browsers, dazu die gewünschten Arten.
      properties:
        endpoint: { type: string, description: https-Adresse des Push-Dienstes }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
        details: { type: boolean }
    PushSubscriptionInfo:
      type: object
      required: [types, details]
      properties:
        types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
        details: { type: boolean }
    Feature:
      type: object
      required: [key, label, description, enabled, requires, configured, setup]
      properties:
        key:
          type: string
          enum: [events, calendar, news, gallery, points, penalties, ranks, titles, attendance, documents, board, polls, birthdays, inventory, directory, offices, lists, mail]
        label: { type: string, description: Bezeichnung (aus kompanie.json oder Standard) }
        description: { type: string, description: Ein Satz, wofür der Bereich da ist }
        enabled: { type: boolean }
        requires:
          type: array
          items: { type: string }
          description: Bereiche, die eingeschaltet sein müssen
        configured:
          type: [boolean, 'null']
          description: Ob der Bereich eingerichtet ist (z. B. Kalender mit Adresse); null = braucht keine Einrichtung
        setup:
          type: [string, 'null']
          description: Abschnitt der Einstellungen bzw. Schritt der Ersteinrichtung, z. B. `kalender`
    MaintenanceInfo:
      type: object
      required: ['on', reason, since]
      properties:
        'on': { type: boolean }
        reason: { type: string, description: 'Begründung (Klartext), leer wenn keine' }
        since: { type: integer, description: 'Eingeschaltet seit (Unix-Zeit), 0 wenn aus' }
    ActivityArea:
      type: string
      description: Schlüssel eines Bereichs (siehe Features) oder `app` (Allgemeines wie Verwaltung, Konto, Einstellungen) bzw. `login`
      pattern: '^[a-z]{1,20}$'
    ActivityUsage:
      type: object
      description: 'Zahlen ohne Personenbezug (auch Inhalt von usage in den Statusmeldungen, Format 3). Immer d1 ≤ d7 ≤ d30 ≤ users.'
      required: [users, active]
      properties:
        users: { type: integer, minimum: 0, description: Konten mit einer Rolle in der App (ohne Gäste und Ehemalige) }
        active:
          type: object
          required: [d1, d7, d30]
          description: Konten mit mindestens einer Nutzung in den letzten 24 Stunden, 7 bzw. 30 Tagen
          properties:
            d1: { type: integer, minimum: 0 }
            d7: { type: integer, minimum: 0 }
            d30: { type: integer, minimum: 0 }
    ActivityOverview:
      allOf:
        - $ref: '#/components/schemas/ActivityUsage'
        - type: object
          required: [personal, keep_days, from, to, days, areas, members]
          properties:
            personal: { type: boolean, description: Erfassung je Person an }
            keep_days: { type: integer, description: Einträge je Person werden nach so vielen Tagen gelöscht (90) }
            from: { type: string, format: date }
            to: { type: string, format: date }
            days:
              type: array
              description: Tage im Zeitraum mit Nutzung (Ortszeit)
              items:
                type: object
                required: [day, users, actions]
                properties:
                  day: { type: string, format: date }
                  users: { type: integer, description: Aktive Personen an diesem Tag }
                  actions: { type: integer, description: Gezählte Nutzungen (Ansichten zusammengefasst) }
            areas:
              type: array
              description: Nutzung je Bereich, meistgenutzte zuerst
              items:
                type: object
                required: [area, label, actions, people]
                properties:
                  area: { $ref: '#/components/schemas/ActivityArea' }
                  label: { type: string }
                  actions: { type: integer, description: Nutzungen im Zeitraum }
                  people: { type: integer, description: Personen in den letzten 30 Tagen }
            members:
              type: [array, 'null']
              description: Nur mit Erfassung je Person; alle Konten mit einer Rolle in der App
              items:
                type: object
                required: [id, name, last_active, actions]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  last_active: { type: [integer, 'null'], description: 'Unix-Zeit; null = nicht aktiv, seit die Erfassung je Person läuft' }
                  actions: { type: integer, description: 'Einträge je Person im Zeitraum (0 = im Zeitraum nicht aktiv)' }
    ActivityEntry:
      type: object
      required: [user_id, name, area, label, action, at]
      properties:
        user_id: { type: integer }
        name: { type: string }
        area: { $ref: '#/components/schemas/ActivityArea' }
        label: { type: string }
        action: { type: string, enum: [view, create, update, delete, vote, login] }
        at: { type: integer, description: Unix-Zeit }
    Maintenance:
      allOf:
        - $ref: '#/components/schemas/MaintenanceInfo'
        - type: object
          required: [by, log]
          properties:
            by: { type: integer, description: Konto, das eingeschaltet hat }
            log:
              type: array
              description: Verlauf, neueste zuerst (höchstens 20)
              items:
                type: object
                required: [at, by, by_name, 'on', reason]
                properties:
                  at: { type: integer }
                  by: { type: integer }
                  by_name: { type: string }
                  'on': { type: boolean }
                  reason: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        reason: { type: string, description: 'Nur bei `maintenance`: Begründung des Wartungsmodus' }
        code:
          type: string
          description: |
            z. B. `not_logged_in` (401), `forbidden` (403), `invalid` (400), `not_found` (404),
            `feature_disabled` (403, Bereich vom Admin ausgeschaltet), `method_not_allowed` (405),
            `csrf_invalid` (403), `upstream_error` (502), `not_configured` (503), `internal_error` (500),
            `maintenance` (503, Wartungsmodus, mit `reason`).
            Push (Issue #19): `push_unsupported` (501), `push_full` (503), `too_many_attempts` (429),
            `push_gone` (410) und `push_key_mismatch` (409, Gerät neu anmelden) bei der Testnachricht.
            Nur eigenständige Version: `login_failed` (400), `too_many_attempts` (429),
            `unsupported_media_type` (415, Änderungen nur als JSON), `not_installed` (503).
            Nur WordPress: `use_login_page` (400).
        message: { type: string, description: Für Menschen lesbar, in der Sprache der Kompanie }

    AdminSettings:
      type: object
      required: [google, calendar, gallery, news]
      properties:
        google:
          type: object
          description: Gemeinsamer Google-Zugang für Galerie und Kalender („Mit Google verbinden“ oder Dienstkonto)
          required: [redirect_uri, client_id, client_secret_set, connected, email, calendar_access, service_account_email, last_result]
          properties:
            redirect_uri: { type: string, format: uri, description: 'Weiterleitungs-URI, die der Admin im OAuth-Client bei Google einträgt' }
            client_id: { type: string, description: Gespeicherte Client-ID (auch ohne Verbindung) }
            client_secret_set: { type: boolean }
            connected: { type: boolean, description: OAuth-Verbindung besteht (geht dem Dienstkonto vor) }
            email: { type: string, description: 'Google-Konto der Verbindung, leer wenn unbekannt' }
            calendar_access: { type: boolean, description: wie gallery.calendar_access }
            service_account_email: { type: string }
            last_result:
              type: [object, 'null']
              description: Ergebnis der letzten Rückkehr von Google (nach dem Trennen null)
              properties:
                ok: { type: boolean }
                message: { type: string, description: Meldung für den Admin }
                at: { type: integer, description: Unix-Zeit }
        calendar:
          type: object
          properties:
            source:
              type: string
              enum: [ics, google, google_connection, none]
              description: >-
                Genutzte Quelle, in dieser Reihenfolge: `google` (Kalender-IDs mit eigenem API-Schlüssel),
                `google_connection` (Kalender-IDs über den Google-Zugang: OAuth-Verbindung mit
                `calendar.readonly` oder Dienstkonto), `ics` (geheime iCal-Adresse), sonst `none`.
            connection_needs_calendar_access:
              type: boolean
              description: Kalender-IDs ohne API-Schlüssel eingetragen, aber die OAuth-Verbindung darf den Kalender nicht lesen (neu verbinden nötig)
            ics_url_set: { type: boolean }
            google_api_key_set: { type: boolean }
            calendar_ids: { type: string }
            cache_minutes: { type: integer }
        gallery:
          type: object
          properties:
            configured: { type: boolean }
            root: { type: string }
            service_account_email: { type: string, description: wie google.service_account_email (für ältere Fassungen der App) }
            oauth_connected: { type: boolean, description: 'wie google.connected: OAuth-Verbindung zu Google (geht dem Dienstkonto vor)' }
            oauth_email: { type: string, description: Google-Konto der OAuth-Verbindung, leer wenn unbekannt }
            calendar_access: { type: boolean, description: 'Darf der Google-Zugang auch den Kalender lesen? OAuth nur mit erlaubtem calendar.readonly; Dienstkonto immer (Kalender muss freigegeben sein)' }
            status:
              type: object
              description: Stand des letzten Abgleichs (albums, photos, new, pending, last_sync, error)
        news:
          type: [object, 'null']
          description: null, wenn die Neuigkeiten aus den Beiträgen der WordPress-Seite kommen.
          properties:
            source: { type: string, enum: [none, wordpress, rss] }
            url: { type: string }

    Level:
      type: string
      maxLength: 10
      description: |
        Schlüssel der Rolle. Fest sind `guest` (keine Rechte), `member` (Mitgliederbereich mit Kalender, Rolle neuer
        Konten) und `admin` (alle Rechte). Standardrollen der Bereiche heißen wie der Bereich (`events`, `points`, `penalties`), eigene Rollen
        `r1`, `r2`, …; ältere Installationen haben außerdem `organizer` und `manager` bzw. `candidate` (die frühere feste
        Rolle Anwärter, jetzt eine eigene Rolle). Bezeichnungen und Punktefaktor stehen in
        `/config` (`roles`), Rechte unter `/admin/roles`. `level` ist überall die Grundrolle; Zusatzrollen stehen in
        `extra_roles` (Issue #66).

    ExtraRoles:
      type: array
      items: { $ref: '#/components/schemas/Level' }
      description: |
        Zusatzrollen (Issue #66) in der Reihenfolge der Rollen, nur die wirksamen (eigene Rollen zu einer Grundrolle mit
        Mitgliederbereich). Die Rechte der Person sind die aller Rollen zusammen; Punktefaktor ist der kleinste.

    RoleInfo:
      type: object
      required: [key, label, points_factor]
      properties:
        key: { $ref: '#/components/schemas/Level' }
        label: { type: string }
        points_factor: { type: number, description: 'Gilt beim Buchen von Punkten, z. B. 0.5; bei mehreren Rollen der kleinste' }
        extra: { type: boolean, description: 'Als Zusatzrolle vergebbar (eigene Rollen; nicht guest, member, admin)' }
        new_accounts: { type: boolean, description: 'Beim Anlegen von Konten wählbar (POST /users): immer bei member, sonst nach Einstellung' }
        promotable: { type: boolean, description: 'Personen mit dieser Rolle lassen sich mit create_users als Mitglied aufnehmen (POST /members/{id}/promote), z. B. Anwärter' }

    RoleAdmin:
      allOf:
        - $ref: '#/components/schemas/RoleInfo'
        - type: object
          required: [capabilities, users, system, deletable]
          properties:
            capabilities:
              type: array
              items: { type: string, enum: [member, calendar, view_intern, view_events, view_news, view_gallery, view_gallery_internal, view_own_points, view_own_penalties, view_own_rank, view_own_attendance, view_birthdays, vote_polls, view_directory, view_offices, view_former, view_documents, view_board, view_ranks, view_catalog, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, post_board, manage_polls, manage_inventory, manage_offices, manage_lists, send_mail, view_personal, manage_personal, create_users, promote_users, view_activity, manage_settings] }
              description: 'Rechte der Rolle, jedes für sich (member schließt nichts ein); bei admin alle; vergebbar sind alle außer view_activity und manage_settings. Rechte zum Verwalten und view_own_* nur zusammen mit member. guest gilt auch ohne Anmeldung.'
            users: { type: integer, description: 'Anzahl der Personen mit dieser Rolle, als Grundrolle oder als Zusatzrolle' }
            extra_users: { type: integer, description: Davon als Zusatzrolle }
            system: { type: boolean, description: 'guest, member und admin: nicht löschbar; bei guest und member nur die Rechte zum Sehen änderbar, bei admin keine' }
            deletable: { type: boolean, description: 'false für guest, member und admin' }

    RoleInput:
      type: object
      properties:
        label: { type: string, maxLength: 30 }
        capabilities:
          type: array
          items: { type: string, enum: [member, calendar, view_intern, view_events, view_news, view_gallery, view_gallery_internal, view_own_points, view_own_penalties, view_own_rank, view_own_attendance, view_birthdays, vote_polls, view_directory, view_offices, view_former, view_documents, view_board, view_ranks, view_catalog, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, post_board, manage_polls, manage_inventory, manage_offices, manage_lists, send_mail, view_personal, manage_personal, create_users, promote_users] }
          description: 'Jedes Recht für sich. Rechte zum Verwalten und view_own_* nur zusammen mit member; die übrigen Rechte zum Sehen gehen auch allein (wie bei Anwärtern). guest: nur Rechte zum Sehen ohne member; member: immer member, sonst nur Rechte zum Sehen; admin: nicht änderbar.'
        points_factor: { type: [number, string], description: 'Zwischen 0 und 10, z. B. 0.5 oder "0,5"' }
        new_accounts: { type: boolean, description: 'Nur eigene Rollen: beim Anlegen von Konten wählbar' }
        promotable: { type: boolean, description: 'Nur eigene Rollen ohne member: als Mitglied aufnehmen mit create_users' }

    AppUser:
      type: object
      required: [id, name, level, capabilities]
      properties:
        id: { type: integer }
        name: { type: string }
        login: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        extra_roles: { $ref: '#/components/schemas/ExtraRoles' }
        photo_url: { $ref: '#/components/schemas/PhotoUrl' }
        capabilities:
          type: array
          items:
            type: string
            enum: [member, calendar, view_intern, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, post_board, manage_polls, manage_inventory, manage_offices, manage_lists, send_mail, view_personal, manage_personal, create_users, promote_users, view_activity, manage_settings]
          description: 'Wirksame Rechte aller Rollen zusammen (Grundrolle und Zusatzrollen); member bringt calendar mit.'

    ErrorLog:
      type: array
      description: |
        Die letzten Fehler dieser Installation, neueste zuerst (höchstens 50, höchstens 14 Tage). Bleibt auf dem
        Server und wird nicht gesendet; Adressen sind auf den Server gekürzt, Dateien ohne Verzeichnis.
        Gleiche Fehler direkt hintereinander werden zusammengefasst (count, first bis at).
      items:
        type: object
        required: [at, first, count, code, detail, message]
        properties:
          at: { type: integer, description: Zuletzt aufgetreten (Unix-Zeit) }
          first: { type: integer, description: Zuerst aufgetreten (Unix-Zeit) }
          count: { type: integer }
          code: { type: string, description: 'Fehlercode wie in den Statusmeldungen, z. B. CALENDAR_FETCH' }
          detail: { type: string, description: 'Ursache wie in den Statusmeldungen, z. B. ics_http_404; leer, wenn unbekannt' }
          message: { type: string, description: Fehlertext }

    UpdateStatus:
      type: object
      properties:
        configured: { type: boolean, description: Paket mit Update-Adresse und der Adapter kann einspielen }
        current: { type: string }
        channel: { type: string, enum: [early, stable] }
        auto: { type: boolean }
        checked_at: { type: [integer, 'null'] }
        error: { type: string, description: Fehler der letzten Prüfung, sonst leer }
        latest: { type: [string, 'null'] }
        available: { type: boolean, description: Neuere Version derselben Hauptversion verfügbar }
        major: { type: boolean, description: Neue Hauptversion verfügbar (nur mit Bestätigung) }
        majorVersion: { type: string }
        withdrawn: { type: boolean, description: Die installierte Version wurde zurückgezogen }
        fallback: { type: [string, 'null'], description: 'Bei withdrawn: Ziel des automatischen Wechsels; null = keins vorhanden' }
        skipped: { type: boolean, description: 'latest wird nach dem Zurückrollen nicht automatisch eingespielt' }
        autoAllowed: { type: boolean, description: 'Automatische Updates sind hier erlaubt (WordPress kann sie sperren)' }
        problems: { type: array, items: { type: string }, description: Gründe, warum die neue Version hier nicht läuft }
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: string }
              published: { type: string }
        last:
          type: [object, 'null']
          description: Letzter Update-Versuch
          properties:
            from: { type: string }
            to: { type: string }
            kind: { type: string, enum: [auto, manual, rollback, withdrawn] }
            at: { type: integer }
            ok: { type: boolean }
            error: { type: string }
        held:
          type: [object, 'null']
          description: Automatisches Update, zurückgestellt, weil die Sicherung in Google Drive scheiterte
          properties:
            version: { type: string }
            kind: { type: string, enum: [auto, withdrawn] }
            at: { type: integer }
            error: { type: string }
        running: { type: boolean, description: 'Gerade läuft ein Update (auch eines, dessen Anfrage durch ein Zeitlimit abgebrochen ist)' }
        progress:
          type: [object, 'null']

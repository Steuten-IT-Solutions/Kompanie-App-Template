openapi: 3.1.0
info:
  title: Kompanie-App API
  version: 0.1.0
  description: |
    Vertrag zwischen der PWA und dem Server. Beide Adapter setzen ihn um:
    - WordPress: `/wp-json/kompanie-app/v1`
    - Standalone: `/api/v1`

    Abgeleitet aus der REST-API der ersten Umsetzung (Plugin 0.3.0). Neu sind
    `/config` und `/auth/*`; sie ersetzen die bisher von PHP eingespeiste Konfiguration, den WordPress-Nonce und
    den festen Weg über `wp-login.php`.

    **Anmeldung:** Sitzungs-Cookie. Jede Anfrage, die Daten ändert, braucht das
    CSRF-Token in dem Header, den `/config` unter `csrf.header` nennt (WordPress:
    `X-WP-Nonce`, Standalone: `X-CSRF-Token`). Ist es abgelaufen, antwortet der
    Server mit 403 und `code: csrf_invalid` (WordPress: `rest_cookie_invalid_nonce`);
    die App holt dann über `csrf.refreshUrl` aus `/config` ein neues und wiederholt die
    Anfrage einmal.

    **Rechte:** Die `/me`-Routen lesen die Benutzer-ID immer aus der Sitzung.
    Mitglieder sehen nur ihre eigenen Punkte und Strafen.

    **Vorschau „App als Rolle ansehen“ (Issue #63):** Ein Admin kann bei jeder Anfrage den Header
    `X-Kompanie-Preview` (Parameter `Preview`) mit dem Schlüssel einer Rolle oder `@public` (ohne Anmeldung)
    schicken; Dateien (Galeriebilder, Dokumente, Abzeichen) tragen ihn als Parameter `?vorschau=…` in der Adresse,
    die der Server in der Vorschau selbst so erzeugt. Der Server antwortet dann mit den Rechten genau dieser Rolle
    (dieselbe Person, ohne Zusatzrollen) bzw. wie ohne Anmeldung. Für Nicht-Admins, `admin` und unbekannte Rollen
    wird die Vorschau ignoriert (`/config.preview` ist `null`). Jede Anfrage mit Header oder Parameter, die nicht
    `GET`/`HEAD` ist, lehnt der Server mit 403 `preview_readonly` ab (Antwort `PreviewReadonly`), außer
    `POST /auth/logout`.

    **Beträge** sind immer ganze Cent. **Datumsangaben** `YYYY-MM-DD`, Uhrzeiten `HH:MM`
    in der Zeitzone der Kompanie.
servers:
  - url: /wp-json/kompanie-app/v1
    description: WordPress-Plugin
  - url: /api/v1
    description: Eigenständige Version

tags:
  - name: App
  - name: Anmeldung
  - name: Eigene Daten
  - name: Benachrichtigungen
  - name: Termine
  - name: News
  - name: Galerie
  - name: Verwaltung
  - name: Schwarzes Brett
  - name: Umfragen
  - name: Geburtstage
  - name: Inventar
  - name: Mitgliederliste
  - name: Ämter
  - name: Listen
  - name: E-Mails
  - name: Einstellungen
  - name: Wartung
  - name: Fehlermeldungen

paths:
  /config:
    get:
      tags: [App]
      summary: Laufzeit-Konfiguration und angemeldeter Benutzer
      security: []
      parameters:
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }

  /auth/csrf:
    get:
      tags: [Anmeldung]
      summary: Neues CSRF-Token
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Anmeldung]
      summary: Anmelden (nur bei `auth.mode = form`)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, description: Benutzername oder E-Mail-Adresse }
                password: { type: string }
                remember: { type: boolean, default: true, description: "„Angemeldet bleiben“: 400 Tage, verlängert sich beim Öffnen der App" }
      responses:
        '200':
          description: Angemeldet; setzt das Sitzungs-Cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/PreviewReadonly' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Anmeldung]
      summary: Abmelden (dieses Gerät)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged_out: { type: boolean }

  /me:
    get:
      tags: [Eigene Daten]
      summary: Eigene Übersicht
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }

  /me/data:
    get:
      tags: [Eigene Daten]
      summary: Alle eigenen Daten herunterladen (Auskunft nach Art. 15 DSGVO)
      description: |
        Auskunft nach Art. 15 DSGVO als Datei (`Content-Disposition: attachment`, `Cache-Control: no-store`):
        `{format: "kompanie-app-personal-data", formatVersion, created, kompanie, person, data}`. `person` mit Profil,
        Rollen, Geburtstag, Eintrittsjahr, Ehemaligen-Eintrag, Foto (Base64) und `account` (vom Adapter: angelegt am,
        letzte Anmeldung, Sitzungen ohne Schlüssel); `data` je Tabelle die Zeilen der Person
        (dieselben Tabellen wie beim Löschen, dazu Push-Abos ohne Schlüssel, Ämter, Listen, Änderungen am Schwarzen Brett,
        eigene Bilder (Signatur, Entwürfe) mit Inhalt). Ohne Pseudonyme. Nicht in der Vorschau (403).
        Enthält auch die eigenen Antworten in anonymen Umfragen und die eigene Nutzungsauswertung.
      responses:
        '200':
          description: Daten der Person
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/attendance:
    get:
      tags: [Eigene Daten]
      summary: Eigene Anwesenheit (jüngste Termine zuerst) mit Summen
      x-capability: view_own_attendance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        list_id: { type: integer }
                        title: { type: string }
                        date: { type: string, format: date }
                        status: { $ref: '#/components/schemas/AttendanceStatus' }
                  counts: { $ref: '#/components/schemas/AttendanceCounts' }
        '403': { $ref: '#/components/responses/Error' }

  /me/points:
    get:
      tags: [Eigene Daten]
      summary: Eigene Punkte
      x-capability: view_own_points
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointEntry' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/penalties:
    get:
      tags: [Eigene Daten]
      summary: Eigene Strafen
      x-capability: view_own_penalties
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Penalty' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/birthday:
    get:
      tags: [Geburtstage]
      summary: Eigener Geburtstag mit Jahr und Schaltern (Issue #1)
      x-capability: member
      responses:
        '200':
          description: OK; `birthday` null, wenn keiner eingetragen ist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthdayResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Geburtstage]
      summary: Eigenen Geburtstag eintragen oder ändern
      description: |
        Tag und Monat, das Jahr ist freiwillig. Gültiges Datum (29.02. nur im Schaltjahr oder ohne Jahr), Jahr ab 1900,
        nicht in der Zukunft (Zeitzone der Kompanie), sonst 400. Nicht mitgeschickte Schalter bleiben; ein neuer Eintrag
        ist sichtbar (`visible: true`), ohne Alter (`show_age: false`) und auf der Seite in der Mitgliederliste nur für
        Mitglieder (`profile: members`).
      x-capability: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, day]
              properties:
                month: { type: integer, minimum: 1, maximum: 12 }
                day: { type: integer, minimum: 1, maximum: 31 }
                year: { type: [integer, 'null'], minimum: 1900, description: 'Geburtsjahr; null oder weglassen = ohne Jahr' }
                visible: { type: boolean, description: Anderen Mitgliedern zeigen }
                show_age: { type: boolean, description: 'Alter anzeigen (nur mit Jahr wirksam)' }
                profile: { $ref: '#/components/schemas/ProfileVisibility' }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthdayResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Geburtstage]
      summary: Eigenen Geburtstag entfernen
      x-capability: member
      responses:
        '200':
          description: Entfernt (`birthday` ist null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthdayResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/join-year:
    get:
      tags: [Mitgliederliste]
      summary: Eigenes Eintrittsjahr mit der Anzeige auf der eigenen Seite in der Mitgliederliste
      x-capability: member
      responses:
        '200':
          description: OK; `join_year` null, wenn keines eingetragen ist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinYearResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Mitgliederliste]
      summary: Eigenen Eintritt eintragen oder ändern
      description: |
        `date` als TT.MM.JJJJ, JJJJ-MM-TT oder nur das Jahr JJJJ; ohne `date` gilt `year` (ältere Apps, nur das Jahr). Ab
        1800, nicht in der Zukunft (Zeitzone der Kompanie), sonst 400. Ohne `profile` bleibt die Anzeige; ein neuer
        Eintrag steht nur für Mitglieder auf der Seite (`profile: members`). Auf der Seite steht der Eintritt, wie er eingetragen ist.
      x-capability: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, examples: ['12.03.2005', '2005'] }
                year: { type: integer, minimum: 1800, description: 'Nur ohne date' }
                profile: { $ref: '#/components/schemas/ProfileVisibility' }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinYearResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Mitgliederliste]
      summary: Eigenes Eintrittsjahr entfernen
      x-capability: member
      responses:
        '200':
          description: Entfernt (`join_year` ist null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinYearResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/signature:
    get:
      tags: [Eigene Daten]
      summary: Eigene Signatur (Issue #172)
      description: Für Mitglieder, Anwärter und alle mit `post_board` oder `send_mail`; sonst `signature` null.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureResponse' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [Eigene Daten]
      summary: Signatur einrichten oder ändern
      description: |
        Formatierter Inhalt (HTML) mit Text und Bildern (`<img data-image="uid">`, s. `POST /rich-images`), bereinigt wie
        Nachrichten am Brett. Leerer Inhalt löscht die Signatur. Nicht mehr verwendete Bilder werden gelöscht. Bereits in
        Nachrichten eingefügte Signaturen ändern sich nicht.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Eigene Daten]
      summary: Signatur löschen (samt Bildern)
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/mail:
    get:
      tags: [Eigene Daten]
      summary: Nachrichten vom Schwarzen Brett per E-Mail (Issue #172)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailPreference' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [Eigene Daten]
      summary: Mails vom Brett ein- oder ausschalten (Standard an)
      x-capability: view_board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [board]
              properties:
                board: { type: boolean }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailPreference' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/account:
    get:
      tags: [Eigene Daten]
      summary: Eigene E-Mail-Adresse, Handynummer und Adresse (Meins → Konto)
      responses:
        '200': { $ref: '#/components/responses/OwnAccount' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Eigene Daten]
      summary: Eigene E-Mail-Adresse, Handynummer und Adresse ändern
      description: |
        Eine neue E-Mail-Adresse nur mit dem aktuellen Passwort (wie beim Passwortwechsel höchstens 5 Versuche in
        15 Minuten); die Adresse ohne. Felder, die fehlen, bleiben; Name und Benutzername ändert hier niemand. Erst wird
        alles geprüft, bei einem Fehler ändert sich nichts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, description: 'Leer entfernt sie' }
                phone: { type: string, maxLength: 30, description: 'Ziffern, Leerzeichen und + ( ) / -, 5 bis 20 Ziffern; leer entfernt sie' }
                address: { $ref: '#/components/schemas/AddressInput' }
                current_password: { type: string, description: 'Pflicht, wenn sich die E-Mail-Adresse ändert' }
      responses:
        '200': { $ref: '#/components/responses/OwnAccount' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /me/password:
    post:
      tags: [Eigene Daten]
      summary: Eigenes Passwort ändern
      description: Meldet alle anderen Geräte ab. Dieses Gerät bekommt eine neue Sitzung; danach ein neues CSRF-Token holen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /reports/form:
    get:
      tags: [Fehlermeldungen]
      summary: Formular „Fehler melden“ öffnen (auch ohne Anmeldung)
      description: |
        Zeitmarke für die Zeitfalle (frühestens `minSeconds`, spätestens 6 Stunden später absenden) und die Angaben,
        die der Server der Meldung beifügt. Ohne Empfänger (reportUrl) 404 `reports_unavailable`. Format der
        Weitergabe an die Betreuer: docs/FEHLERMELDUNGEN.md.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token, minSeconds, maxBytes, details]
                properties:
                  token: { type: string, description: 'Zeitpunkt.HMAC; beim Absenden mitschicken' }
                  minSeconds: { type: integer }
                  maxBytes: { type: integer, description: Höchstgröße des Bildschirmfotos (dekodiert) }
                  details:
                    type: object
                    required: [version, role]
                    properties:
                      version: { type: string }
                      role: { type: string, description: 'Bezeichnung der Rolle oder „ohne Anmeldung“' }
        '404': { $ref: '#/components/responses/Error' }

  /reports:
    post:
      tags: [Fehlermeldungen]
      summary: Fehler melden (auch ohne Anmeldung)
      description: |
        Reiht die Meldung für den Versand an die Betreuer der App ein; 201 erst, wenn sie gespeichert ist. Die
        Einwilligung (`consent: true`) ist Pflicht. Begrenzt je Anfragendem (IPv6: je /64) und Stunde, je Installation
        und Tag und durch die Größe der Warteschlange. Ist `website` (verstecktes Feld) gefüllt, antwortet der Server
        wie bei Erfolg, speichert aber nichts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, consent, description]
              properties:
                token: { type: string, description: Zeitmarke aus GET /reports/form }
                consent: { type: boolean, const: true }
                description: { type: string, maxLength: 2000 }
                expected: { type: string, maxLength: 2000 }
                page: { type: string, maxLength: 200, description: 'Seite in der App, z. B. #/termine/verwalten' }
                userAgent: { type: string, maxLength: 400 }
                lastError: { type: [string, 'null'], maxLength: 500, description: Letzte Fehlermeldung der App }
                includeName: { type: boolean, description: Nur angemeldet; dann geht der Name mit }
                screenshot:
                  type: [object, 'null']
                  properties:
                    type: { type: string, enum: [image/png, image/jpeg, image/webp] }
                    data: { type: string, description: 'Base64 (auch als data:-Adresse), dekodiert höchstens 2 MB, höchstens 10000 Pixel je Kante' }
                website: { type: string, description: Verstecktes Feld; muss leer bleiben }
      responses:
        '201':
          description: Gespeichert, wird im Hintergrund versandt
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /me/push/status:
    post:
      tags: [Benachrichtigungen]
      summary: Mögliche Arten und das Abo dieses Geräts (Konto)
      description: |
        POST, damit die Push-Adresse nicht in Protokollen von Adressen landet. Mit `auth` gibt das Gerät außerdem ein
        Abo frei, das einem anderen, hier nicht mehr angemeldeten Konto gehört (die App fragt dazu beim Start nach).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
                auth: { type: string, description: auth-Geheimnis des Geräts (base64url) }
      responses:
        '200': { $ref: '#/components/responses/PushStatus' }
        '401': { $ref: '#/components/responses/Error' }

  /push/status:
    post:
      tags: [Benachrichtigungen]
      summary: Mögliche Arten und das Abo dieses Geräts (Gast ohne Konto)
      description: Gibt wie `/me/push/status` das Abo eines hier nicht mehr angemeldeten Kontos frei.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
                auth: { type: string, description: auth-Geheimnis des Geräts (base64url) }
      responses:
        '200': { $ref: '#/components/responses/PushStatus' }

  /me/push:
    post:
      tags: [Benachrichtigungen]
      summary: Gerät für Benachrichtigungen anmelden (Konto)
      description: |
        Übernimmt ein vorhandenes Abo desselben Geräts (gleiches auth-Geheimnis), z. B. nach einem Kontowechsel.
        Höchstens 10 Geräte je Konto; das älteste fällt dann weg. Ohne `types` alle möglichen Arten; mindestens eine
        erlaubte Art muss übrig bleiben (sonst 400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscribe' }
      responses:
        '200': { $ref: '#/components/responses/PushSubscription' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
    put:
      tags: [Benachrichtigungen]
      summary: Arten und Details-Schalter ändern (Konto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
                types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
                details: { type: boolean, description: 'Bei Strafen Betrag und Grund in der Nachricht zeigen (sonst nur ein Hinweis); Punkte zeigen immer Wert und Grund' }
      responses:
        '200': { $ref: '#/components/responses/PushSubscription' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Benachrichtigungen]
      summary: Gerät abmelden (Konto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Error' }

  /push:
    post:
      tags: [Benachrichtigungen]
      summary: Gerät für öffentliche Benachrichtigungen anmelden (Gast ohne Konto)
      description: |
        Nur öffentliche Arten (Termine, Erinnerung, News). Neue Gast-Abos sind je Anfragendem (IPv6: je /64-Netz) und
        insgesamt begrenzt; ohne Änderung und ohne Nachricht verfallen sie nach 180 Tagen.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscribe' }
      responses:
        '200': { $ref: '#/components/responses/PushSubscription' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [Benachrichtigungen]
      summary: Arten ändern (Gast, nur mit dem auth-Geheimnis des Geräts)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, auth]
              properties:
                endpoint: { type: string }
                auth: { type: string }
                types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
      responses:
        '200': { $ref: '#/components/responses/PushSubscription' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Benachrichtigungen]
      summary: Gerät abmelden (Gast, nur mit dem auth-Geheimnis des Geräts)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, auth]
              properties:
                endpoint: { type: string }
                auth: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }

  /me/push/test:
    post:
      tags: [Benachrichtigungen]
      summary: Testnachricht an dieses Gerät (Konto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        '200': { $ref: '#/components/responses/PushTest' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /push/test:
    post:
      tags: [Benachrichtigungen]
      summary: Testnachricht an dieses Gerät (Gast)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, auth]
              properties:
                endpoint: { type: string }
                auth: { type: string }
      responses:
        '200': { $ref: '#/components/responses/PushTest' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /calendar:
    get:
      tags: [Termine]
      summary: Alle Termine aus Google Kalender / iCal (Mitglieder und Anwärter)
      description: |
        Der Server hält die letzte gute Fassung bereit (bis `calendar_cache_minutes` frisch) und erneuert sie
        im Hintergrund. Ist sie veraltet und der Kalender gerade nicht erreichbar, kommt die alte Fassung
        mit 200. 502 nur, wenn es noch keine Fassung gibt; ein solcher Fehler wird etwa 60 Sekunden gemerkt.
      x-capability: calendar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalendarEvent' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503':
          description: Kalender noch nicht eingerichtet (code not_configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events:
    get:
      tags: [Termine]
      summary: Kommende öffentliche Termine
      x-capability: 'view_events (ohne Anmeldung die Rechte der Rolle guest)'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicEvent' }
    post:
      tags: [Termine]
      summary: Öffentlichen Termin anlegen
      x-capability: manage_events
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Termine]
      summary: Öffentlichen Termin ändern
      x-capability: manage_events
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Termine]
      summary: Öffentlichen Termin löschen
      x-capability: manage_events
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /news:
    get:
      tags: [News]
      summary: Neuigkeiten, seitenweise
      x-capability: 'view_news (ohne Anmeldung die Rechte der Rolle guest)'
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: OK
          headers:
            X-Total-Pages:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NewsItem' }

  /news/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Kennung aus der News-Quelle (bei WordPress die Beitrags-ID).
        schema: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
    get:
      tags: [News]
      summary: Einzelne Neuigkeit mit Inhalt (HTML)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsItem' }
        '404': { $ref: '#/components/responses/Error' }

  /gallery:
    get:
      tags: [Galerie]
      summary: Alben nach Jahr. Gäste sehen nur öffentliche Bilder.
      x-capability: 'view_gallery oder view_gallery_internal (interne Bilder nur damit); ohne Anmeldung die Rechte der Rolle guest'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [years]
                properties:
                  years:
                    type: array
                    items: { $ref: '#/components/schemas/GalleryYear' }

  /gallery/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Galerie]
      summary: Album mit Bildern. Mitglieder bekommen die Bilder aus „intern“ dazu.
      x-capability: 'view_gallery oder view_gallery_internal'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GalleryAlbum' }
        '404': { $ref: '#/components/responses/Error' }

  /me/rank:
    get:
      tags: [Eigene Daten]
      summary: Eigener Dienstgrad, Liste und Verlauf (Bereich Dienstgrade)
      description: Mit dem Bereich Punkte zusätzlich Schwellen, nächster Dienstgrad und fehlende Punkte. Nur der eigene Verlauf.
      x-capability: view_own_rank
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RankStatus'
                  - type: object
                    properties:
                      ranks:
                        type: array
                        items: { $ref: '#/components/schemas/Rank' }
                      history:
                        type: array
                        items: { $ref: '#/components/schemas/RankHistoryEntry' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /ranks:
    get:
      tags: [Verwaltung]
      summary: Dienstgrade (aktive, vom niedrigsten zum höchsten)
      x-capability: 'view_ranks oder manage_ranks'
      parameters:
        - name: all
          in: query
          description: Auch inaktive, mit Anzahl der Vergaben (nur mit manage_ranks).
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rank' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Verwaltung]
      summary: Dienstgrad anlegen (ans obere Ende)
      description: Gesetzte Schwellen aktiver Dienstgrade müssen mit der Reihenfolge streng steigen, sonst 400.
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 60 }
                min_points: { type: [integer, 'null'], minimum: 0 }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rank' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /ranks/order:
    put:
      tags: [Verwaltung]
      summary: Reihenfolge festlegen (alle IDs vom niedrigsten zum höchsten)
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rank' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /ranks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Dienstgrad ändern (Bezeichnung, Schwelle, aktiv)
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 60 }
                min_points: { type: [integer, 'null'], minimum: 0 }
                active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rank' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Dienstgrad löschen (vergebene nur deaktivieren → 400)
      x-capability: manage_ranks
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /ranks/{id}/badge:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Verwaltung]
      summary: Abzeichen hochladen oder ersetzen (Issue #17)
      description: |
        PNG, JPG, WebP oder SVG, höchstens 1 MB, Base64 im JSON. Geprüft werden Endung und Signatur (Rasterbilder
        höchstens 4096 × 4096 Pixel). Rasterbilder werden zu PNG in 64, 128 und 256 Pixeln (längere Kante, nie
        vergrößert, Transparenz bleibt). SVGs werden bereinigt gespeichert (keine Skripte, keine Verweise nach außen,
        kein DOCTYPE); `png` ist dann optional eine in der App gezeichnete PNG-Fassung (256 Pixel) für Benachrichtigungen.
        Ein vorhandenes Abzeichen wird ersetzt und gelöscht; die Fassung (und damit `badge_url`) ändert sich.
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: object
                  required: [name, data]
                  properties:
                    name: { type: string, description: 'Dateiname; die Endung (.png, .jpg, .jpeg, .webp, .svg) bestimmt das Format' }
                    data: { type: string, description: 'Inhalt Base64-kodiert (auch als data:-Adresse)' }
                png: { type: string, description: 'Nur bei SVG, optional: PNG-Fassung Base64-kodiert, für das Bild in Benachrichtigungen' }
      responses:
        '200':
          description: Der Dienstgrad wie in GET /ranks?all=1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rank' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Abzeichen entfernen (löscht die Dateien)
      x-capability: manage_ranks
      responses:
        '200':
          description: Der Dienstgrad ohne Abzeichen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rank' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/rank:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Verwaltung]
      summary: Befördern oder degradieren
      description: |
        Ohne den Bereich Punkte frei. Mit Punkten (für alle, auch Admins): befördern erst ab der Schwelle des Ziels;
        degradieren immer, auch über der Schwelle. Dienstgrade ohne Schwelle frei. Schreibt den Verlauf.
        Wer kein Mitglied mehr ist (z. B. Gast), kann den Dienstgrad nur verlieren (`rank_id: null`, ohne Punkteregeln).
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rank_id: { type: [integer, 'null'], description: null = kein Dienstgrad }
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /promotions:
    get:
      tags: [Verwaltung]
      summary: Beförderungsübersicht (nur zusammen mit dem Bereich Punkte)
      description: |
        Nur Mitglieder (ohne Gäste und Anwärter). Erreichte Schwellen zuerst (älteste oben), dann nach fehlenden Punkten;
        ohne nächsten Dienstgrad mit Schwelle am Ende. Enthält die Punktestände, auch wenn der Abrufende selbst kein
        manage_points hat (die Übersicht braucht sie).
      x-capability: manage_ranks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/RankStatus'
                    - type: object
                      properties:
                        user_id: { type: integer }
                        name: { type: string }
        '403': { $ref: '#/components/responses/Error' }

  /lists:
    get:
      tags: [Listen]
      summary: Alle gespeicherten Listen (Issue #121), zuletzt geänderte zuerst
      description: Nur mit `manage_lists` (Standardrolle „Listen verwalten“, Admins). Bereich aus → 403 `feature_disabled`.
      x-capability: manage_lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PrintListSummary' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Listen]
      summary: Liste anlegen
      description: |
        Ohne `columns`: Name (Nachname), Vorname und eine breite leere Spalte „Unterschrift“. Ohne `rows` beginnt die Liste leer;
        Mitglieder kommen über `POST /lists/{id}/sync-members` dazu.
      x-capability: manage_lists
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrintListInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintList' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /lists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Listen]
      summary: Liste mit Spalten, Zeilen und den Werten der Datenspalten
      description: |
        Die Werte der Datenspalten werden beim Lesen ermittelt und nur geliefert, soweit die anfragende Person sie in der
        App ohnehin sehen darf (`available`): Rolle nur mit Zugang zur Mitgliederliste der Verwaltung, Dienstgrad und
        Titel mit öffentlicher Mitgliederliste (Bereich directory) oder dem Recht, sie zu pflegen, Geburtstag (Tag und
        Monat) nur für Mitglieder und nur, wenn die Person ihn freigegeben hat, Punkte nur mit `manage_points`, offene
        Strafen nur mit `manage_penalties`; jeweils nur bei eingeschaltetem Bereich.
      x-capability: manage_lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintList' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Listen]
      summary: Liste ganz ersetzen (Titel, Untertitel, Datum, Ausrichtung, Spalten, Zeilen)
      description: |
        Mitgliedszeilen nur für Konten, die schon in der Liste stehen (z. B. beim Umsortieren), oder für Mitglieder (Recht
        `member`); jedes Konto höchstens einmal. `user_id: null` steht für ein gelöschtes Konto. Mit `updated_at` (der
        geladene Stand) nur, wenn niemand die Liste inzwischen geändert hat, sonst 409 `conflict`.
      x-capability: manage_lists
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrintListInput' }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintList' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Listen]
      summary: Liste löschen
      x-capability: manage_lists
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /lists/{id}/copy:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Listen]
      summary: Liste kopieren (mit allen Spalten und Zeilen, Titel mit „(Kopie)“)
      x-capability: manage_lists
      responses:
        '201':
          description: Kopie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintList' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /lists/{id}/sync-members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Listen]
      summary: „Mitglieder aktualisieren“
      description: |
        Legt Zeilen für alle Mitglieder (Recht `member`, ohne Gäste und Anwärter) an, die noch keine haben, und löscht die
        Zeilen von Konten, die es nicht mehr gibt oder die kein Mitglied mehr sind. Freie Zeilen bleiben. Neue Zeilen
        werden nach Nachname vor die erste Mitgliedszeile eingeordnet, die nach Namen später kommt (sonst hinter die
        letzte; ohne Mitgliedszeilen an den Anfang). Ohne `apply` nur die Übersicht, was sich ändern würde.
      x-capability: manage_lists
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                apply: { type: boolean, default: false }
      responses:
        '200':
          description: Übersicht bzw. Ergebnis
          content:
            application/json:
              schema:
                type: object
                required: [added, removed, applied, list]
                properties:
                  added:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: integer }
                        name: { type: string }
                  removed:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: [integer, 'null'], description: null bei gelöschtem Konto }
                        name: { type: [string, 'null'] }
                  applied: { type: boolean, description: false ohne apply oder wenn es nichts zu ändern gab }
                  list:
                    oneOf:
                      - $ref: '#/components/schemas/PrintList'
                      - type: 'null'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /documents:
    get:
      tags: [Verwaltung]
      summary: Sichtbare Dokumente (nach Titel) und alle Kategorien (Issue #2)
      description: Dokumente mit Sichtbarkeit `managers` nur für wer `manage_documents` hat; für sie auch `max_bytes`.
      x-capability: 'view_documents oder manage_documents'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories: { type: array, items: { $ref: '#/components/schemas/DocCategory' } }
                  documents: { type: array, items: { $ref: '#/components/schemas/DocumentInfo' } }
                  max_bytes: { type: integer, description: 'Höchstgröße einer Datei: 20 MB oder weniger (post_max_size, memory_limit)' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Verwaltung]
      summary: Dokument hochladen
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date, file]
              properties:
                title: { type: string, maxLength: 191 }
                category_id: { type: [integer, 'null'] }
                date: { type: string, format: date }
                visibility: { type: string, enum: [members, managers], default: members }
                file: { $ref: '#/components/schemas/DocumentFile' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /documents/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Titel, Kategorie, Stand oder Sichtbarkeit ändern
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 191 }
                category_id: { type: [integer, 'null'] }
                date: { type: string, format: date }
                visibility: { type: string, enum: [members, managers] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Dokument und Datei löschen
      x-capability: manage_documents
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /documents/{id}/file:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Verwaltung]
      summary: Neue Fassung (ersetzt die Datei, auch mit anderer Endung; version ändert sich)
      x-capability: manage_documents
      requestBody:
        required: true
        content:

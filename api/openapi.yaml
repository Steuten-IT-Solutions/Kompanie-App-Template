      description: |
        PNG, JPG, WebP oder SVG, höchstens 1 MB, Base64 im JSON. Geprüft werden Endung und Signatur (Rasterbilder
        höchstens 4096 × 4096 Pixel). Rasterbilder werden zu PNG in 64, 128 und 256 Pixeln (längere Kante, nie
        vergrößert, Transparenz bleibt). SVGs werden bereinigt gespeichert (keine Skripte, keine Verweise nach außen,
        kein DOCTYPE); `png` ist dann optional eine in der App gezeichnete PNG-Fassung (256 Pixel) für Benachrichtigungen.
        Ein vorhandenes Abzeichen wird ersetzt und gelöscht; die Fassung (und damit `badge_url`) ändert sich.
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: object
                  required: [name, data]
                  properties:
                    name: { type: string, description: 'Dateiname; die Endung (.png, .jpg, .jpeg, .webp, .svg) bestimmt das Format' }
                    data: { type: string, description: 'Inhalt Base64-kodiert (auch als data:-Adresse)' }
                png: { type: string, description: 'Nur bei SVG, optional: PNG-Fassung Base64-kodiert, für das Bild in Benachrichtigungen' }
      responses:
        '200':
          description: Der Dienstgrad wie in GET /ranks?all=1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rank' }
        '400': { $ref: '#/components/responses/Error' }

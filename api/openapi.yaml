  /admin/roles:
    get:
      tags: [Einstellungen]
      summary: Rollen mit Rechten, Punktefaktor und Anzahl der Personen
      description: |
        Jede Person hat genau eine Grundrolle. Fest sind Gast, Mitglied (Rolle neuer Konten) und Admin (nur umbenennen;
        Mitglied und Admin auch mit Punktefaktor; Bezeichnungen bei der Ersteinrichtung aus `kompanie.json`), in der
        Reihenfolge, die der Admin festlegt (`PUT /admin/roles/order`; anfangs Gast, Mitglied, eigene Rollen, Admin).
        Anwärter (Issue #23) sind eine eigene Rolle; die frühere feste Rolle `candidate` bleibt in Installationen, die
        sie hatten, als eigene Rolle mit `new_accounts` und `promotable` erhalten. Schaltet der Admin einen Bereich mit eigenen Rechten ein
        (Termine, Punkte, Strafen), kommt dessen Standardrolle dazu; schaltet er ihn aus, verschwindet sie, wenn niemand sie hat.
        Wer Rollen vergeben darf, ohne Admin zu sein, vergibt nur Rollen mit eigenen Rechten, ohne `create_users` und `promote_users`.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Einstellungen]
      summary: Rolle anlegen
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/roles/order:
    put:
      tags: [Einstellungen]
      summary: Reihenfolge der Rollen
      description: |
        `keys`: alle Rollen, auch `guest`, `member` und `admin`, in der neuen Reihenfolge, jede genau einmal (sonst 400).
        Die Reihenfolge gilt überall, wo Rollen stehen (`/config`, Zusatzrollen; `counts_by_group` der Anwesenheit umgekehrt, von unten nach oben). Neue Rollen kommen ans Ende,
        vor `admin`, wenn der dort steht.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: array, items: { $ref: '#/components/schemas/Level' } }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/roles/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { $ref: '#/components/schemas/Level' } }
    patch:
      tags: [Einstellungen]
      summary: Rolle umbenennen, Rechte oder Punktefaktor ändern (nur mitgeschickte Felder)
      description: |
        Bei guest nur die Bezeichnung, bei member und admin Bezeichnung und Punktefaktor; `new_accounts` und `promotable`
        nur bei eigenen Rollen (`promotable` nur ohne `member`). Ein geänderter Faktor gilt für künftige Buchungen.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Einstellungen]
      summary: Rolle löschen
      description: Sind der Rolle noch Personen zugeordnet, bekommen sie `replacement`; ohne Angabe → 400.
      x-capability: manage_settings
      parameters:
        - { name: replacement, in: query, required: false, schema: { $ref: '#/components/schemas/Level' } }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/features:
    get:
      tags: [Einstellungen]
      summary: Bereiche der App mit Schalter, Bezeichnung und Einrichtungsstand
      description: |
        Welche Bereiche eine Kompanie nutzt, entscheidet allein ihr Admin (Ersteinrichtung bzw. Einstellungen → Bereiche).
        Neue Installationen starten ohne Bereiche. Ein ausgeschalteter Bereich verschwindet aus der App, seine Routen
        antworten mit 403 `feature_disabled`, seine Hintergrundaufgaben laufen nicht; die Daten bleiben erhalten.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Einstellungen]
      summary: Bereiche ein- und ausschalten
      description: Nur mitgeschickte Bereiche werden geändert. Unbekannte Bereiche oder Werte, die kein Wahrheitswert sind → 400.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
              example: { gallery: true, penalties: false }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/maintenance:
    get:
      tags: [Einstellungen]
      summary: Wartungsmodus mit Verlauf
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Einstellungen]
      summary: Wartungsmodus ein- oder ausschalten, Begründung ändern
      description: |
        Issue #42. Solange er an ist, antworten alle Routen außer `/config`, `/auth/login`, `/auth/logout` und
        `/auth/csrf` für alle ohne `manage_settings` mit 503 `maintenance` (samt `reason`), ebenso geschützte Fotos
        und Dokumente. Hintergrundaufgaben außer Updates und Statusmeldungen pausieren. Jede Änderung kommt in den Verlauf.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['on']
              properties:
                'on': { type: boolean }
                reason: { type: string, maxLength: 500, description: 'Klartext, Zeilenumbrüche bleiben; ohne Angabe bleibt die bisherige Begründung' }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/settings:
    get:
      tags: [Einstellungen]
      summary: Einstellungen für Google-Zugang, Kalender, Galerie und Neuigkeiten
      description: Geheime Werte (iCal-Adresse, API-Schlüssel, Dienstkonto, Client-Secret, Refresh-Token) werden nie zurückgegeben, nur ob sie gesetzt sind.
      x-capability: manage_settings
      responses:

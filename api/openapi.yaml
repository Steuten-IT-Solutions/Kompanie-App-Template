            former: { type: integer }
        existing: { type: integer }
        offices_linked: { type: integer }
        applied: { type: boolean }
        created:
          type: array
          items: { $ref: '#/components/schemas/CreatedUser' }
        error: { type: string, description: 'Anlegen mittendrin abgebrochen (nur mit apply)' }

    GrantableCapability:
      type: string
      description: Recht, das sich einer Rolle oder einer Person geben lässt (alle außer `manage_settings`).
      enum: [member, calendar, view_intern, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, post_board, manage_polls, manage_inventory, manage_offices, manage_lists, send_mail, view_personal, manage_personal, create_users, promote_users]

    MemberRights:
      type: object
      required: [role, grant, revoke, editable]
      properties:
        role:
          description: Rechte der Rolle (mit dem im Mitgliederbereich enthaltenen Kalender)
          type: array
          items: { $ref: '#/components/schemas/GrantableCapability' }
        grant:
          description: zusätzlich zur Rolle gegeben
          type: array
          items: { $ref: '#/components/schemas/GrantableCapability' }
        revoke:
          description: trotz der Rolle entzogen
          type: array
          items: { $ref: '#/components/schemas/GrantableCapability' }
        editable:
          description: Rechte, die der Betrachter hier ändern darf
          type: array
          items: { $ref: '#/components/schemas/GrantableCapability' }

    Birthday:
      type: object
      description: Geburtstag mit Jahr und Schaltern – nur für die Person selbst und in den Mitgliedsdetails.
      required: [month, day, year, visible, show_age, profile]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        year: { type: [integer, 'null'] }
        visible: { type: boolean, description: Anderen Mitgliedern zeigen }
        show_age: { type: boolean, description: Alter anzeigen }
        profile: { $ref: '#/components/schemas/ProfileVisibility' }

    BirthdayResponse:
      type: object
      required: [birthday]
      properties:
        birthday:
          oneOf:
            - $ref: '#/components/schemas/Birthday'
            - type: 'null'

    Address:
      type: object
      description: |
        Postanschrift (Domain\Address). Land als ISO 3166-1 alpha-2 aus der Auswahl (DE, AT, CH, NL, BE, LU, FR, DK, PL,
        CZ, IT, ES, GB, TR); leer heißt anderes Land, dann `country_name`.
      required: [street, house_number, extra, postal_code, city, country, country_name]
      properties:
        street: { type: string, maxLength: 100 }
        house_number: { type: string, maxLength: 10 }
        extra: { type: string, maxLength: 100, description: 'Adresszusatz, z. B. c/o' }
        postal_code: { type: string, maxLength: 12, description: 'Wie im Land üblich geschrieben (12345, 1234 AB, 00-950, 110 00, SW1A 1AA)' }
        city: { type: string, maxLength: 60 }
        country: { type: string, description: 'ISO-Code oder leer (anderes Land)' }
        country_name: { type: string, maxLength: 60, description: 'Nur bei anderem Land' }

    AddressInput:
      description: |
        Adresse zum Speichern; null oder alle Felder leer entfernt sie. Pflicht sind dann Straße, PLZ und Ort; ohne
        `country` gilt DE. Geglättet wird vorher: Leerzeichen, Hausnummer am Ende der Straße in ihr Feld, PLZ ohne
        Länderkennung (D-, L-, CH-) und wie im Land üblich. Die PLZ wird je Land geprüft (z. B. DE fünfstellig ohne die
        Leitregion 00, NL `1234 AB`, PL `00-950`); sonst 400 mit Grund.
      oneOf:
        - type: 'null'
        - type: object
          properties:
            street: { type: string }
            house_number: { type: string }
            extra: { type: string }
            postal_code: { type: string }
            city: { type: string }
            country: { type: string }
            country_name: { type: string }

    PersonalInfo:
      type: object
      required: [email, phone, address]
      properties:
        email: { type: string }
        phone: { type: string, description: 'Leer, wenn keine hinterlegt ist' }
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'

    BirthdayString:
      type: string
      pattern: '^(\d{4}-)?\d{2}-\d{2}$'
      description: 'Geburtstag (optional, nur mit Bereich Geburtstage, sonst 400): `JJJJ-MM-TT` oder ohne Jahr `MM-TT`. Prüfung wie bei `PUT /me/birthday`; die Schalter sind danach an (zeigen) bzw. aus (Alter), ändern kann sie nur die Person.'

    BirthdayEntry:
      type: object
      description: Sichtbarer Geburtstag eines Mitglieds, nie mit Geburtsjahr.
      required: [user_id, name, month, day, date, days_until, today, age]
      properties:
        user_id: { type: integer }
        name: { type: string }
        month: { type: integer }
        day: { type: integer }
        date: { type: string, format: date, description: 'Tag des nächsten Geburtstags (29.02. in Jahren ohne Schalttag: 28.02.)' }
        days_until: { type: integer, minimum: 0, description: 'Tage bis dahin; 0 = heute' }
        today: { type: boolean }
        age: { type: [integer, 'null'], description: 'Alter, das die Person an diesem Geburtstag erreicht; nur mit Jahr und „Alter anzeigen“' }

    Rank:
      type: object
      required: [id, title, sort, min_points, active]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 60 }
        sort: { type: integer, description: Reihenfolge, der niedrigste zuerst }
        min_points: { type: [integer, 'null'], description: 'Punkteschwelle; null = ohne. Für Mitglieder nur mit dem Bereich Punkte' }
        active: { type: boolean }
        assigned: { type: integer, description: 'Wie oft vergeben (nur mit all=1)' }
        badge_url: { $ref: '#/components/schemas/BadgeUrl' }
        badge_type: { type: [string, 'null'], enum: [png, jpg, webp, svg, null], description: 'Format des hochgeladenen Abzeichens (nur mit all=1)' }
        badge_push: { type: boolean, description: 'Es gibt eine PNG-Fassung für Benachrichtigungen (nur mit all=1; bei SVG nur, wenn die App eine mitgeschickt hat)' }

    PhotoFile:
      type: object
      required: [name, data]
      properties:
        name: { type: string, description: 'Dateiname; die Endung (.jpg, .jpeg, .png, .webp) bestimmt das Format' }
        data: { type: string, description: 'Inhalt Base64-kodiert (auch als data:-Adresse)' }

    PhotoUrl:
      type: [string, 'null']
      description: |
        Foto des Mitglieds oder null: `<App>/mitgliedsfoto/<id>?v=<Fassung>&s=128`. Die App ersetzt `s` bei Bedarf
        durch 480, 1024 oder 4096 (Originalauflösung, für die Großansicht nachgeladen; 404, wenn es sie nicht gibt). Ausgeliefert als image/jpeg an die Person selbst und an alle, die die Mitglieder in der Verwaltung
        sehen (manage_points, manage_penalties, manage_ranks, manage_titles, create_users oder promote_users); mit dem
        Bereich directory an alle, auch ohne Anmeldung, wenn das Foto zu einem Mitglied oder Anwärter gehört (Issue #112,
        dann `Cache-Control: public`); sonst 401/403, im Wartungsmodus 503. Sonst `Cache-Control: private`, bei passender
        Fassung einen Tag; immer `X-Robots-Tag: noindex`. Die Adresse wechselt mit jedem Foto.

    BadgeUrl:
      type: [string, 'null']
      description: |
        Abzeichen des Dienstgrads (Issue #17) oder null: `<App>/abzeichen/<id>?v=<Fassung>&s=128`. Die App ersetzt
        `s` bei Bedarf durch 64 oder 256 (PNG-Fassungen; bei SVG dieselbe Datei). Ausgeliefert an angemeldete
        Personen mit Mitgliederbereich oder internem Kalender und an alle mit Zugang zur Mitgliederliste der Verwaltung;
        mit dem Bereich directory (öffentliche Mitgliederliste, Issue #112) an alle, dann `Cache-Control: public` (sonst
        401/403, im Wartungsmodus 503, Bereich aus 404);
        SVG als image/svg+xml mit `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; sandbox`
        und `X-Content-Type-Options: nosniff`, sonst image/png. Die Adresse wechselt mit jeder Fassung.

    PrintListSummary:
      type: object
      required: [id, title, subtitle, date, rows, updated_by_name, updated_at]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 120 }
        subtitle: { type: [string, 'null'], maxLength: 200 }
        date: { type: [string, 'null'], format: date }
        rows: { type: integer, description: Zahl der Zeilen }
        updated_by_name: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }

    PrintListColumn:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [field, blank], description: 'field: Wert aus der App, blank: leer zum Ausfüllen auf Papier' }
        field:
          type: [string, 'null']
          enum: [nr, name, first_name, last_name, role, rank, titles, birthday, address, street, postal_code, city, country, phone, email, points, penalties, null]
          description: 'Nur bei field; nr zählt die Zeilen (macht die App)'
        label: { type: string, maxLength: 60, description: 'Überschrift; leer: die App nimmt die Standardbezeichnung' }
        width: { type: string, enum: [narrow, normal, wide], default: normal }
        checkbox: { type: boolean, description: Kästchen zum Abhaken (nur bei blank) }
        available: { type: boolean, description: 'Nur in Antworten: ob die anfragende Person die Werte sieht (blank immer)' }

    PrintListRow:
      oneOf:
        - type: object
          description: Mitgliedszeile
          required: [kind, user_id, name, deleted, values]
          properties:
            kind: { type: string, enum: [member] }
            user_id: { type: [integer, 'null'], description: null bei gelöschtem Konto }
            name: { type: string, description: Anzeigename; leer bei gelöschtem Konto }
            first_name: { type: string }
            last_name: { type: string }
            deleted: { type: boolean }
            values:
              type: object
              description: 'Werte der sichtbaren Datenspalten der Liste: name, first_name, last_name, role (Bezeichnung), rank (oder null), titles (Liste), birthday („TT.MM.“ oder null), mit view_personal address (ganze Adresse in einer Zeile, das Land nur außerhalb Deutschlands), street (Straße und Nr.), postal_code, city, country (Name des Landes), phone, email (je null ohne Eintrag), points (Zahl), penalties (offene Cent)'
              additionalProperties: true
        - type: object
          description: Freie Zeile
          required: [kind, name]
          properties:
            kind: { type: string, enum: [free] }
            name: { type: string, maxLength: 100, description: Freier Name oder leer }

    PrintList:
      type: object
      required: [id, title, subtitle, date, orientation, created_by_name, created_at, updated_by_name, updated_at, columns, rows, fields]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 120 }
        subtitle: { type: [string, 'null'], maxLength: 200 }
        date: { type: [string, 'null'], format: date }
        orientation: { type: string, enum: [portrait, landscape] }
        created_by_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_by_name: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
        columns:
          type: array
          items: { $ref: '#/components/schemas/PrintListColumn' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PrintListRow' }
        fields:
          type: array
          description: Alle Datenspalten mit der Angabe, ob die anfragende Person sie sieht (für die Auswahl)
          items:
            type: object
            properties:
              key: { type: string }
              available: { type: boolean }

    PrintListInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 200 }
        date: { type: [string, 'null'], format: date }
        orientation: { type: string, enum: [portrait, landscape], default: portrait }
        columns:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/PrintListColumn' }
        rows:
          type: array
          maxItems: 500
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [member, free] }
              user_id: { type: [integer, 'null'], description: Nur bei member }
              name: { type: string, maxLength: 100, description: Nur bei free }
        updated_at: { type: string, format: date-time, description: 'Nur beim Ersetzen (PUT): der geladene Stand' }

    OfficeGroup:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 60 }

    OfficeRef:
      type: object
      required: [id, group_id, title, singular, title_id]
      properties:
        id: { type: integer }
        group_id: { type: [integer, 'null'] }
        title: { type: string, maxLength: 60 }
        singular: { type: string, maxLength: 60, description: 'Eigene Einzahl („Kapitän“ zu „Kapitäne“); leer ohne' }
        title_id: { type: [integer, 'null'], description: Verknüpfter Titel }

    OfficeHolder:
      type: object
      required: [name]
      properties:
        name: { type: string, description: 'Anzeigename des Kontos, sonst der gespeicherte Name (auch nach dem Löschen des Kontos)' }
        user_id: { type: integer, description: 'Nur bei Personen der Mitgliederliste, für manage_offices und das eigene Konto' }
        photo_url: { $ref: '#/components/schemas/PhotoUrl' }

    OfficeTerm:
      type: object
      required: [id, kind, start_year, end_year, note, honor, current, holders]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [period, point], description: 'period: Zeitraum (ohne Ende bis heute), point: ein Jahr' }
        start_year: { type: integer }
        end_year: { type: [integer, 'null'] }
        note: { type: string, maxLength: 100 }
        honor: { type: boolean, description: 'Ehrung (Stern und Abzeichen im Zeitstrahl), bei jeder Art; vergibt keinen Titel' }
        current: { type: boolean, description: Zeitraum ohne Ende }
        office_id: { type: integer, description: Nur in Antworten der Pflege }
        holders:
          type: array
          items: { $ref: '#/components/schemas/OfficeHolder' }

    OfficeTermInput:
      type: object
      properties:
        kind: { type: string, enum: [period, point], default: period }
        start_year: { type: integer, minimum: 1800, description: Höchstens zehn Jahre in der Zukunft }
        end_year: { type: [integer, 'null'], description: 'Nicht vor dem Beginn; null: bis heute (bei point immer null)' }
        note: { type: string, maxLength: 100 }
        honor: { type: boolean, default: false, description: Ehrung; beim Ändern ohne Angabe bleibt der bisherige Wert }
        holders:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            description: Ein Konto (user_id) oder ein freier Name; jede Person nur einmal
            properties:
              user_id: { type: integer }
              name: { type: string, maxLength: 100 }

    Office:
      allOf:
        - $ref: '#/components/schemas/OfficeRef'
        - type: object
          required: [terms]
          properties:
            terms:
              type: array
              items: { $ref: '#/components/schemas/OfficeTerm' }
            holder_title:
              type: [string, 'null']
              description: Einzahl für den Zeitstrahl einer Person („Kompaniekönig“ statt „Kompaniekönige“) = eigene Einzahl (`singular`), sonst Name des verknüpften Titels (nur mit Bereich `titles`); null ohne beides
            linked_title: { type: [string, 'null'], description: Nur mit manage_offices }

    OfficesOverview:
      type: object
      required: [groups, offices]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/OfficeGroup' }
        offices:
          type: array
          items: { $ref: '#/components/schemas/Office' }

    OfficeTitleChange:
      type: object
      properties:
        name: { type: string }
        title: { type: string }

    OfficeImportResult:
      type: object
      required: [rows, groups_new, offices_new, terms_new, applied]
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              group: { type: string }
              office: { type: string }
              kind: { type: string, enum: [period, point] }
              start_year: { type: integer }
              end_year: { type: [integer, 'null'] }
              note: { type: string }
              honor: { type: boolean }
              holders:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    user_id: { type: [integer, 'null'] }
              duplicate: { type: boolean, description: Gibt es schon; wird übersprungen }
              error: { type: string }
        groups_new: { type: integer }
        offices_new: { type: integer }
        terms_new: { type: integer }
        applied: { type: boolean }

    Title:
      type: object
      required: [id, title, sort, active, assigned]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 60 }
        sort: { type: integer, description: Reihenfolge der Anzeige }
        active: { type: boolean, description: 'Deaktivierte werden nicht mehr neu vergeben; wer sie hat, behält sie' }
        assigned: { type: integer, description: Wie vielen Mitgliedern zugewiesen }
        office:
          description: 'Amt, das den Titel über die laufenden Amtszeiten vergibt (Issue #112); von Hand nicht vergebbar'
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: integer }
                title: { type: string }

    DocCategory:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 191 }
        sort: { type: integer }

    DocumentInfo:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 191 }
        category_id: { type: [integer, 'null'] }
        date: { type: string, format: date, description: Stand }
        visibility: { type: string, enum: [members, managers], description: 'managers: nur wer manage_documents hat' }
        ext: { type: string }
        kind: { type: string, enum: [pdf, image, file], description: 'pdf und image zeigt die App an, file nur herunterladen' }
        mime: { type: string }
        size: { type: integer }
        version: { type: string, description: Wechselt mit jeder neuen Fassung }
        url: { type: string, description: 'Auslieferung mit Prüfung der Anmeldung: <App>/dokument/<id>?v=<version>' }
        updated_at: { type: string }

    DocumentFile:
      type: object
      required: [name, data]
      description: Datei für das Hochladen (beide Adapter nehmen nur JSON an)
      properties:
        name: { type: string, description: 'Dateiname; die Endung bestimmt den Typ (pdf, jpg, jpeg, png, doc, docx, xls, xlsx, ppt, pptx, odt, ods, odp)' }
        data: { type: string, description: 'Inhalt Base64-kodiert, auch als data:-Adresse; die Signatur muss zur Endung passen' }

    AttendanceStatus:
      type: string
      enum: [present, excused, absent]
      description: anwesend, entschuldigt, fehlt

    AttendanceCounts:
      type: object
      properties:
        present: { type: integer }
        excused: { type: integer }
        absent: { type: integer }

    AttendanceSummary:
      type: object
      properties:
        id: { type: integer }
        source: { type: string, enum: [calendar, free] }
        title: { type: string, description: Momentaufnahme beim Anlegen }
        date: { type: string, format: date }
        counts: { $ref: '#/components/schemas/AttendanceCounts' }

    AttendanceDetail:
      allOf:
        - $ref: '#/components/schemas/AttendanceSummary'
        - type: object
          properties:
            event_key: { type: [string, 'null'], description: ID des Kalendertermins (nur source calendar) }
            updated_by_name: { type: [string, 'null'] }
            updated_at: { type: string }
            people:
              type: array
              description: Alle mit einer Rolle (ohne Gäste), nach Namen
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  role: { $ref: '#/components/schemas/Level' }
                  group: { type: string, description: Rolle, als die die Person im Zähler zählt }
                  member: { type: boolean, description: 'Mit Mitgliederbereich: Punkte und Strafen möglich' }
                  status:
                    oneOf:
                      - $ref: '#/components/schemas/AttendanceStatus'
                      - type: 'null'
                  booked: { type: boolean, description: Hat für diese Liste schon Punkte (ohne stornierte) }
            counts_by_group:
              type: object
              description: Je Status die Gruppen in der Reihenfolge der Rollen
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    group: { type: string }
                    label: { type: string }
                    count: { type: integer }

    TitleRef:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }

    RankRef:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        badge_url: { $ref: '#/components/schemas/BadgeUrl' }

    RankStatus:
      type: object
      description: |
        Dienstgrad eines Mitglieds; alle Felder nach rank nur, wenn auch der Bereich Punkte an ist. next_rank ist der
        nächste aktive Dienstgrad mit Schwelle (Dienstgrade ohne Schwelle werden übersprungen), sonst der nächste.
      properties:
        rank:
          oneOf:
            - $ref: '#/components/schemas/RankRef'
            - type: 'null'
        points: { type: number }
        next_rank:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/RankRef'
                - type: object
                  properties:
                    min_points: { type: [integer, 'null'] }
            - type: 'null'
        points_to_next: { type: [number, 'null'], description: '≤ 0: Schwelle erreicht; null ohne nächsten Dienstgrad oder ohne Schwelle' }
        reachable_rank:
          description: Höchster Dienstgrad mit erreichter Schwelle
          oneOf:
            - $ref: '#/components/schemas/RankRef'
            - type: 'null'
        threshold_reached_since: { type: [string, 'null'], format: date, description: 'Seit wann die Summe durchgehend die Schwelle des nächsten erreicht' }
        below_current_threshold: { type: boolean }

    RankHistoryEntry:
      type: object
      properties:
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        to_badge_url:
          description: Heutiges Abzeichen des neuen Dienstgrads (der Verlauf speichert nur Bezeichnungen); null ohne
          $ref: '#/components/schemas/BadgeUrl'
        kind: { type: string, enum: [promotion, demotion, initial] }
        points_at_change: { type: [number, 'null'], description: 'null ohne den Bereich Punkte' }
        reason: { type: string }
        changed_by_name: { type: [string, 'null'] }
        changed_at: { type: string, description: 'UTC, YYYY-MM-DD HH:MM:SS' }

    CreatedUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        username: { type: string }
        email: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        warning: { type: string, description: 'Konto angelegt, aber Anfangspunkte, Dienstgrad, Geburtstag bzw. Foto nicht übernommen' }
        photo_url: { $ref: '#/components/schemas/PhotoUrl' }
        password: { type: string, description: Startpasswort; steht nur in dieser Antwort }

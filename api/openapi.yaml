              schema: { $ref: '#/components/schemas/Poll' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /inventory:
    get:
      tags: [Inventar]
      summary: Alle Einträge des Inventars, nach Bezeichnung und Ort (Issue #6)
      description: |
        Nur mit `manage_inventory` (Standardrolle „Inventar verwalten“, Admins); Mitglieder ohne das Recht → 403. Ein Ort je
        Eintrag; dasselbe Material an zwei Orten sind zwei Einträge. Gelöschte Einträge fehlen. Die App gruppiert nach
        Bezeichnung (ohne Unterschied in Groß- und Kleinschreibung) und summiert je Einheit.
      x-capability: manage_inventory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryItem' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Inventar]
      summary: Eintrag anlegen
      description: |
        `title` und `location` sind Pflicht, `quantity` ≥ 0 (Standard 0). Unterscheidet sich ein Ort, eine Kategorie oder
        Einheit nur in Groß- und Kleinschreibung von einer vorhandenen, gilt deren Schreibweise. Verlauf: ein Eintrag
        `create` mit allen gesetzten Feldern (`old: null`).
      x-capability: manage_inventory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }


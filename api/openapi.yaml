        `gruppe;amt;beginn;ende;art;personen;zusatz;ehrung` (Kopfzeile erlaubt). ende: Jahr, „heute“ (laufend) oder leer
        (ein Jahr); art leer, „zeitraum“ oder „zeitpunkt“; personen mit „&“ getrennt; ehrung „ja“, „nein“ oder leer
        (optionale 8. Spalte; ohne sie keine Ehrung, auch nicht bei „zeitpunkt“). Der Wert der Ehrung zählt beim Erkennen
        gleicher Amtszeiten nicht mit. Gruppen und Ämter werden nach Namen gefunden oder angelegt, gleiche Amtszeiten
        übersprungen. Mit `link` werden Namen, die genau einem Konto entsprechen, damit verknüpft. Mit `apply` alles in

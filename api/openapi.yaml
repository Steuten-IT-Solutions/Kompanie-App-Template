      parameters:
        - $ref: '#/components/parameters/InventoryLogLimit'
        - $ref: '#/components/parameters/InventoryLogBefore'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryLogEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /inventory/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Inventar]
      summary: Eintrag ändern
      description: |
        Nur genannte Felder ändern sich. Menge absolut (`quantity`) oder als Änderung (`adjust`, z. B. 1 oder -1 für die
        Knöpfe − und +); beides zusammen → 400, unter 0 → 400. `location` berichtigt nur den Ort (ohne Zusammenführen);
        Bestand an einen anderen Ort bringt `POST /inventory/{id}/move`. Verlauf: ein Eintrag `update` mit den geänderten
        Feldern; ändert sich nichts, kein Eintrag. Gelöscht oder unbekannt → 404.
      x-capability: manage_inventory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryPatch' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Inventar]
      summary: Eintrag löschen
      description: |
        Weich gelöscht: Der Eintrag fehlt danach in der Liste, sein Verlauf bleibt lesbar. Verlauf: ein Eintrag `delete`.
        Optional `reason` im Inhalt (oder als Query-Parameter).
      x-capability: manage_inventory
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /inventory/{id}/log:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Inventar]
      summary: Verlauf eines Eintrags, neueste zuerst (auch nach dem Löschen)
      x-capability: manage_inventory
      parameters:
        - $ref: '#/components/parameters/InventoryLogLimit'
        - $ref: '#/components/parameters/InventoryLogBefore'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryLogEntry' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /inventory/{id}/move:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Inventar]
      summary: Einen Teil oder alles an einen anderen Ort umlagern
      description: |
        In einer Transaktion. Gibt es am Zielort schon einen Eintrag mit derselben Bezeichnung und Einheit (ohne Unterschied
        in Groß- und Kleinschreibung), kommt die Menge dazu; sonst entsteht ein neuer Eintrag (Kategorie und Notiz
        übernommen). Alles umgelagert: Die Quelle verschwindet (beim Zusammenführen weich gelöscht); ohne passendes Ziel
        ändert sich nur ihr Ort. Mehr als vorhanden, Menge 0 oder derselbe Ort → 400 ohne jede Änderung.

        Verlauf: genau ein Eintrag `move` je betroffenem Eintrag, beide mit demselben `changes.move`
        (`from`, `to`, `quantity`, `source_id`, `target_id`). Teilmenge: Quelle `quantity {old, new}`, Ziel
        `quantity {old, new}` bzw. `{old: null, new}` beim neuen Eintrag. Alles mit Ziel: Quelle `quantity {old, new: 0}` und
        `move.source_removed: true`. Alles ohne Ziel: ein einziger Eintrag mit `location {old, new}`
        (`source_id` = `target_id`).
      x-capability: manage_inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, location]
              properties:
                quantity:
                  oneOf:
                    - { type: number, exclusiveMinimum: 0 }
                    - { type: string, description: 'z. B. „2,5“' }
                location: { type: string, maxLength: 100, description: Zielort }
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Umgelagert
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    description: Was am alten Ort bleibt; null, wenn dort nichts mehr steht.
                    oneOf:
                      - $ref: '#/components/schemas/InventoryItem'
                      - type: 'null'
                  target: { $ref: '#/components/schemas/InventoryItem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /attendance:
    get:
      tags: [Verwaltung]
      summary: Die letzten 50 Anwesenheitslisten (Issue #21)
      x-capability: manage_attendance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceSummary' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Verwaltung]
      summary: Liste anlegen oder ändern und Status setzen
      description: |
        Mit `id` eine vorhandene Liste (bei freien Listen auch Titel und Datum). Ohne `id` neu: `source: calendar` mit
        `event_key` (gibt es schon eine Liste zu diesem Termin, wird sie genommen, 200) oder `source: free` mit `title` und
        `date`. Titel und Datum sind eine Momentaufnahme. `entries` setzt den Status je Person (null entfernt ihn);
        nur Personen mit einer Rolle (keine Gäste).
      x-capability: manage_attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                source: { type: string, enum: [calendar, free] }
                event_key: { type: string }
                title: { type: string, maxLength: 191 }
                date: { type: string, format: date }
                entries:
                  type: object
                  description: Benutzer-ID → Status
                  additionalProperties:
                    oneOf:
                      - $ref: '#/components/schemas/AttendanceStatus'
                      - type: 'null'
      responses:
        '200':
          description: Geändert bzw. vorhandene Liste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceDetail' }
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }


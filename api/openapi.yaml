          type: array
          items: { $ref: '#/components/schemas/TitleRef' }
        joined_on:
          description: Eintritt als JJJJ-MM-TT oder nur das Jahr JJJJ (unabhängig von der Anzeige auf der eigenen Seite), leer ohne Eintrag; nur mit Recht create_users
          type: string

    DirectoryEntry:
      type: object

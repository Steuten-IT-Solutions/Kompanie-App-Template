        degradieren immer, auch über der Schwelle. Dienstgrade ohne Schwelle frei. Schreibt den Verlauf.
        Wer kein Mitglied mehr ist (z. B. Gast), kann den Dienstgrad nur verlieren (`rank_id: null`, ohne Punkteregeln).
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rank_id: { type: [integer, 'null'], description: null = kein Dienstgrad }
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }


        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Verwaltung]
      summary: Vor- und Nachname, E-Mail und Benutzername ändern; ein neuer Benutzername meldet das Konto auf allen Geräten ab
      description: Der Anzeigename wird „Vorname Nachname“. Felder, die fehlen, bleiben.

          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /document-categories:
    post:
      tags: [Verwaltung]
      summary: Kategorie anlegen (kommt ans Ende)
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 191 }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocCategory' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /document-categories/order:
    put:
      tags: [Verwaltung]
      summary: Reihenfolge der Kategorien
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer }, description: Alle IDs in der gewünschten Reihenfolge }
      responses:
        '200':
          description: Neue Reihenfolge
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocCategory' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /document-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Kategorie umbenennen
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 191 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocCategory' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Kategorie löschen (ihre Dokumente stehen danach ohne Kategorie da)
      x-capability: manage_documents
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /board:
    get:
      tags: [Schwarzes Brett]
      summary: Gültige Einträge am Schwarzen Brett, neueste zuerst (Issue #5, #172)
      description: |
        Für Mitglieder und Anwärter (Recht `member` oder `calendar`) sowie für alle mit `post_board`. Nur Einträge, deren
        `expires_at` noch nicht erreicht ist und die nicht gelöscht wurden. Abgelaufene und gelöschte Nachrichten bleiben
        30 Tage im Verlauf (`GET /board/history`, nur `post_board`); danach löscht die Hintergrundaufgabe `board_cleanup`
        sie endgültig. Die App blendet Einträge anhand von `expires_at` auch selbst aus (offline aus dem Speicher).
        Erst die Nachrichten (`kind: message`), neueste zuerst; danach für Mitglieder (Recht `member`) mit eingeschaltetem
        Bereich Umfragen jede laufende Umfrage (`kind: poll`, Issue #4) mit `has_voted`. Später können weitere Arten
        dazukommen – Clients überspringen unbekannte. Mit `post_board` zusätzlich `last_edit` und `mail`.
      x-capability: 'view_board oder post_board'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/BoardItem'
                        - $ref: '#/components/schemas/BoardPollItem'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Schwarzes Brett]
      summary: Nachricht ans Schwarze Brett schreiben
      description: |
        Sichtbar bis `expires_at` (ohne Angabe 24 Stunden ab jetzt; keine Obergrenze). Alle Mitglieder und Anwärter
        außer dem Verfasser bekommen eine Benachrichtigung (Art `board`, Urgency high, Überschrift „Schwarzes Brett:
        Verfasser“, Text = Titel, TTL bis `expires_at`, höchstens 28 Tage), sofern sie die Art für das Gerät eingeschaltet
        haben und `push` nicht false ist. Mit `mail` zusätzlich je eine Mail an alle Mitglieder und Anwärter mit
        Mailadresse, die den Empfang nicht abgeschaltet haben (auch an den Verfasser), im Hintergrund. Meldet der
        Mailserver eine Höchstgröße und ist die fertige Mail größer, wird nichts veröffentlicht (400 mit Erklärung).
      x-capability: post_board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardInput' }
      responses:
        '201':
          description: Veröffentlicht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /board/mail:
    get:
      tags: [Schwarzes Brett]
      summary: Haken „E-Mail senden“ – eingerichtet, Zahl der Empfänger (Issue #172)
      x-capability: post_board
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [available, recipients, reason]
                properties:
                  available: { type: boolean, description: 'Kompanieadresse und SMTP eingerichtet, PHPMailer vorhanden' }
                  recipients: { type: integer, description: Zahl der Empfänger einer neuen Nachricht (ohne den Verfasser) }
                  reason: { type: [string, 'null'], description: 'Warum nicht verfügbar' }
                  server_max_size: { type: [integer, 'null'], description: 'Vom Mailserver gemeldete Höchstgröße (SIZE) in Bytes' }
        '403': { $ref: '#/components/responses/Error' }

  /board/history:
    get:
      tags: [Schwarzes Brett]
      summary: Abgelaufene und gelöschte Nachrichten der letzten 30 Tage (Verlauf, Issue #172)
      x-capability: post_board
      responses:
        '200':
          description: OK, zuletzt beendete zuerst
          content:
            application/json:
              schema:
                type: object
                required: [items, keep_days]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BoardEndedItem' } }
                  keep_days: { type: integer, description: 'Aufbewahrung des Verlaufs in Tagen (30)' }
        '403': { $ref: '#/components/responses/Error' }

  /board/{id}/history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Schwarzes Brett]
      summary: Verlauf einer Nachricht (auch abgelaufen oder gelöscht, solange aufbewahrt)
      description: |
        Jede Erstellung, Titel-, Inhalts- und Enddatumsänderung, jeder Mailversand und das vorzeitige Löschen mit Konto
        und Zeitpunkt, mit vorherigem und neuem Stand; dazu das Protokoll des Mailversands je Empfänger.
      x-capability: post_board
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [message, revisions, mail, mail_log]
                properties:
                  message: { $ref: '#/components/schemas/BoardEndedItem' }
                  revisions: { type: array, items: { $ref: '#/components/schemas/BoardRevision' } }
                  mail: { oneOf: [{ $ref: '#/components/schemas/BoardMailSummary' }, { type: 'null' }] }
                  mail_log:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: [string, 'null'] }
                        email: { type: string }
                        status: { type: string, enum: [pending, sent, failed, cancelled] }
                        attempts: { type: integer }
                        error: { type: [string, 'null'], description: Grund bei Fehlschlag }
                        at: { type: [string, 'null'], format: date-time }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /board/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Schwarzes Brett]
      summary: Titel, Inhalt und/oder Enddatum einer gültigen Nachricht ändern
      description: |
        Jede und jeder mit `post_board`, nicht nur der Verfasser. Ohne neue Benachrichtigung und ohne neue Mail. Die
        Felder einzeln oder zusammen; mindestens eins. `updated_at` wechselt nur, wenn sich Titel oder Inhalt ändern (auf
        Geräten ausgeblendete Nachrichten erscheinen dann wieder); ein neues Enddatum allein lässt es unverändert.
        Jede Änderung steht im Verlauf. Abgelaufene oder gelöschte Nachrichten → 404.
      x-capability: post_board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                text: { type: string, description: Formatierter Inhalt (HTML), wird bereinigt }
                expires_at: { type: string, description: 'Wie bei POST; muss in der Zukunft liegen' }
                attachments:
                  type: array
                  items: { type: string }
                  description: 'Alle Anhänge danach (Kennungen): bisherige behalten, neue Entwürfe kommen dazu, fehlende werden gelöscht; steht im Verlauf'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardItem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Schwarzes Brett]
      summary: Nachricht vorzeitig löschen
      description: Mit Konto und Zeitpunkt im Verlauf; noch nicht verschickte Mails gehen nicht mehr raus.
      x-capability: post_board
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /mails/options:
    get:
      tags: [E-Mails]
      summary: Formular „E-Mail schreiben“ – eingerichtet, Absender, wählbare Rollen und Mitglieder
      description: |
        Nur mit `send_mail` (Standardrolle „E-Mails verwalten“, Admins). Bereich `mail` aus → 403 `feature_disabled`.
        Rollen ohne Gäste mit der Zahl der Personen und davon mit Mailadresse; Konten ohne Gäste mit ihren Rollen (Grund-
        und Zusatzrollen) und ob eine Adresse hinterlegt ist. Die Adressen selbst werden nicht ausgeliefert.
      x-capability: send_mail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [available, reason, from, from_name, groups, roles, members]
                properties:
                  available: { type: boolean, description: 'Kompanieadresse und SMTP eingerichtet, PHPMailer vorhanden' }
                  reason: { type: [string, 'null'], description: 'Warum nicht verfügbar' }
                  from: { type: string, description: Kompanieadresse (Absender) }
                  from_name: { type: string, description: Absendername }
                  groups: { type: array, items: { $ref: '#/components/schemas/MailGroup' }, description: 'Mailgruppen (wie `GET /mails/groups`)' }
                  roles:
                    type: array
                    items:
                      type: object
                      required: [key, label, members, with_email]
                      properties:
                        key: { type: string }
                        label: { type: string }
                        members: { type: integer }
                        with_email: { type: integer }
                  members:
                    type: array
                    items:
                      type: object
                      required: [id, name, roles, email]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        roles: { type: array, items: { type: string } }
                        email: { type: boolean, description: Gültige Adresse hinterlegt }
                  server_max_size: { type: [integer, 'null'], description: 'Vom Mailserver gemeldete Höchstgröße (SIZE) in Bytes' }
        '403': { $ref: '#/components/responses/Error' }

  /mails/preview:
    post:
      tags: [E-Mails]
      summary: Wer die Mail bekäme (für die Bestätigung vor dem Senden)
      description: |
        Jede Adresse einmal; steht sie in mehreren Feldern, gilt An vor Cc vor Bcc. `skipped`: ausgewählte Konten ohne
        gültige Adresse (Namen), sie bekommen nichts.
      x-capability: send_mail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailSelectionInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [recipients, to, cc, bcc, skipped]
                properties:
                  recipients: { type: integer }
                  to: { type: integer }
                  cc: { type: integer }
                  bcc: { type: integer }
                  skipped: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /mails:
    get:
      tags: [E-Mails]
      summary: Verlauf der versendeten E-Mails, neueste zuerst
      description: Aufbewahrt werden die Mails ein Jahr (`keep_days`); danach löscht die Aufgabe `mailing_cleanup` sie samt Protokoll und Bildern.
      x-capability: send_mail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, keep_days]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, subject, author_name, created_at, mail]
                      properties:
                        id: { type: integer }
                        subject: { type: string }
                        author_name: { type: [string, 'null'] }
                        created_at: { type: string, format: date-time }
                        mail: { $ref: '#/components/schemas/BoardMailSummary' }
                  keep_days: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [E-Mails]
      summary: E-Mail schreiben und versenden
      description: |
        Absender ist die Kompanieadresse (Einstellungen → E-Mail), Antworten gehen dorthin. Empfänger je An, Cc und Bcc
        (wie `POST /mails/preview`). Jeder Empfänger bekommt die Mail einzeln zugestellt; die Kopfzeilen To und Cc zeigen
        alle Empfänger aus An und Cc, Bcc-Empfänger nie (nur Bcc: „undisclosed-recipients:;“). Versand im Hintergrund
        (Aufgabe `board_mail`, gemeinsam mit den Mails vom Schwarzen Brett, in Portionen), vorübergehende Fehler werden
        erneut versucht. Bilder im Inhalt werden eingebettet. Ohne erreichbaren Empfänger, ohne Betreff oder Text, mit
        ungültiger Adresse, unbekannter Gruppe oder Rolle oder Gast → 400; meldet der Mailserver eine Höchstgröße und ist die Mail
        größer → 400, nichts wird gespeichert.
      x-capability: send_mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MailSelectionInput'
                - type: object
                  required: [subject, text]
                  properties:
                    subject: { type: string, maxLength: 255 }
                    text: { type: string, description: Formatierter Inhalt (HTML), wird bereinigt }
                    attachments: { type: array, items: { type: string }, description: 'Kennungen eigener Entwürfe aus `POST /attachments`' }
      responses:
        '201':
          description: Zum Versand eingereiht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /mails/groups:
    get:
      tags: [E-Mails]
      summary: Mailgruppen mit Zahl der erreichbaren Konten
      description: |
        Zuerst die Standardgruppen `members` („Alle Mitglieder“: alle Konten, deren Grundrolle den Mitgliederbereich hat,
        auch Admins und eigene Rollen; ohne Anwärter) und `all` („Alle Konten“: alle außer Gästen), dann die eigenen nach
        Bezeichnung. Wer dazugehört, ermittelt die App beim Senden; Ehemalige (Rolle Gast) gehören nie dazu und fallen auch
        aus dem Inhalt eigener Gruppen. Gespeichert als Einstellung `mail_groups` (in der Datensicherung).
      x-capability: send_mail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MailGroup' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [E-Mails]
      summary: Eigene Mailgruppe anlegen
      description: Bezeichnung (eindeutig, auch gegenüber den Standardgruppen) und Inhalt wie ein Empfängerfeld, ohne Gruppen. Höchstens 100 Gruppen.
      x-capability: send_mail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailGroupInput' }
      responses:
        '201':
          description: Angelegt; Antwort ist die neue Liste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MailGroup' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /mails/groups/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string }, description: 'members, all oder Kennung einer eigenen Gruppe' }
    patch:
      tags: [E-Mails]
      summary: Mailgruppe ändern
      description: Standardgruppen nur umbenennen (`label`; Inhalt → 400). Bei eigenen bleibt, was nicht mitkommt.
      x-capability: send_mail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailGroupInput' }
      responses:
        '200':
          description: Antwort ist die neue Liste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MailGroup' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [E-Mails]
      summary: Eigene Mailgruppe löschen
      description: Standardgruppen lassen sich nicht löschen (400). Versendete Mails zeigen sie danach als „Gelöschte Gruppe“.
      x-capability: send_mail
      responses:
        '200':
          description: Antwort ist die neue Liste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MailGroup' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /mails/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [E-Mails]
      summary: Eine versendete E-Mail mit Inhalt, Auswahl der Empfänger und Protokoll je Empfänger
      x-capability: send_mail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /attachments:
    post:
      tags: [Schwarzes Brett]
      summary: Dateianhang hochladen (Schwarzes Brett, E-Mails)
      description: |
        Für alle mit `post_board` oder `send_mail`. Jeder Dateityp, höchstens `max_bytes` (`GET /attachments/limits`,
        20 MB oder weniger, wenn der Server kleinere Anfragen annimmt). Die Datei ist zunächst ein Entwurf des Kontos;
        `POST /board`, `PATCH /board/{id}` bzw. `POST /mails` übernehmen sie über ihre Kennung. Nie gespeicherte
        Entwürfe werden nach 7 Tagen gelöscht.
      x-capability: 'post_board oder send_mail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: object
                  required: [name, data]
                  properties:
                    name: { type: string }
                    data: { type: string, description: 'Inhalt als Base64 (auch als data:-Adresse)' }
      responses:
        '201':
          description: Hochgeladen (Entwurf)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /attachments/limits:
    get:
      tags: [Schwarzes Brett]
      summary: Höchstgröße eines Anhangs
      x-capability: 'post_board oder send_mail'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [max_bytes]
                properties:
                  max_bytes: { type: integer }
        '403': { $ref: '#/components/responses/Error' }

  /rich-images:
    post:
      tags: [Eigene Daten]
      summary: Bild für einen formatierten Inhalt hochladen (Signatur, Schwarzes Brett; Issue #172)
      description: |
        Für Mitglieder, Anwärter und alle mit `post_board` oder `send_mail`. JPG, PNG oder WebP; gespeichert wird eine neu kodierte Fassung
        ohne Metadaten in Originalgröße (PNG bleibt PNG). Keine eigene Grenze für Größe oder Pixel; die technischen Grenzen
        des Servers (`GET /rich-images/limits`) werden verständlich gemeldet. Das Bild ist zunächst ein Entwurf des Kontos;
        im Inhalt steht es als `<img data-image="uid">`. Nie gespeicherte Entwürfe werden nach 7 Tagen gelöscht.
      x-capability: 'member, calendar, post_board oder send_mail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: object
                  required: [name, data]
                  properties:
                    name: { type: string, description: 'Dateiname mit Endung (.jpg, .jpeg, .png, .webp)' }
                    data: { type: string, description: 'Base64, auch als data:-Adresse' }
      responses:
        '201':
          description: Hochgeladen
          content:
            application/json:
              schema:

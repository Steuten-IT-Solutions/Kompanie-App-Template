          type: array
          items: { $ref: '#/components/schemas/GalleryAlbumSummary' }

    GalleryPhoto:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [image, video] }
        video:
          type: string
          description: |
            Nur bei Videos (MP4, WebM): Adresse zum Abspielen über die App (`…/foto/<id>/video`, außerhalb der API, auch
            bei öffentlichen Videos). Der Server reicht den mit `Range` angefragten Bereich aus Google Drive durch und
            speichert nichts: **206** mit `Content-Range`, `Accept-Ranges: bytes` und höchstens 4 MB je Antwort (ohne
            `Range` ab dem Anfang; der Browser fordert den Rest nach). 416 mit `Content-Range: bytes */<Größe>`, wenn der
            Bereich hinter dem Ende beginnt; interne Videos ohne Mitgliedschaft 401/403; 503 mit `Retry-After`, wenn
            gerade zu viele Abrufe laufen; 502, wenn Google den Bereich nicht liefert.
        mime: { type: string, description: 'Nur bei Videos: Dateityp (video/mp4 oder video/webm)' }
        duration: { type: integer, description: 'Nur bei Videos: Dauer in Sekunden, 0 unbekannt' }
        thumb:
          type: string
          description: |
            Adresse des Vorschaubilds. Öffentliche fertige Bilder als statische Datei, sonst über die App
            (`…/foto/<id>/thumb`, außerhalb der API). Bilder, die noch nicht aufbereitet sind, erzeugt der
            Server dort während der Anfrage (beide Größen; höchstens zwei Anfragen gleichzeitig, je Bild nur
            eine). Ist gerade kein Platz frei, antwortet er mit **202**, einem grauen SVG-Platzhalter im
            Seitenverhältnis des Fotos, `Cache-Control: no-store` und `Retry-After` (Sekunden); dann läuft
            die Aufbereitung im Hintergrund. Fertige Bilder: 200 mit JPEG. Interne Bilder ohne
            Mitgliedschaft: 401/403. Scheitert die Aufbereitung: 404.
        large: { type: string, description: 'Adresse der Großansicht (Verhalten wie thumb). Bei Videos das Vorschaubild aus Google Drive; leer, wenn Drive keines hat' }
        original:
          type: string
          description: |
            Nur bei Bildern. Originalauflösung für die Großansicht, nach `large` nachzuladen. Erst erzeugt, wenn jemand sie abruft (aus
            dem Original in Drive, als JPEG ohne Metadaten, höchstens 8192 Pixel); bis dahin über die App
            (`…/foto/<id>/original`), danach bei öffentlichen Bildern als statische Datei. 404, wenn es sie nicht gibt
            (Bild noch nicht aufbereitet, gerade kein Platz frei, Erzeugung gescheitert): dann bleibt `large`.
        width: { type: integer }
        height: { type: integer }
        intern: { type: boolean }
        name: { type: string }
        ready:
          type: boolean
          description: false, solange das Bild noch aufbereitet wird (die Adressen erzeugen das Bild oder liefern den Platzhalter). Die App lädt das Album dann alle 10 s neu.

    GalleryAlbum:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        year: { type: string }
        photos:
          type: array
          items: { $ref: '#/components/schemas/GalleryPhoto' }

    MemberSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: 'Anzeigename „Vorname Nachname“' }

openapi: 3.1.0
info:
  title: Kompanie-App API
  version: 0.1.0
  description: |
    Vertrag zwischen der PWA und dem Server. Beide Adapter setzen ihn um:
    - WordPress: `/wp-json/kompanie-app/v1`
    - Standalone: `/api/v1`

    Abgeleitet aus der REST-API der ersten Umsetzung (Plugin 0.3.0). Neu sind
    `/config` und `/auth/*`; sie ersetzen die bisher von PHP eingespeiste Konfiguration, den WordPress-Nonce und
    den festen Weg über `wp-login.php`.

    **Anmeldung:** Sitzungs-Cookie. Jede Anfrage, die Daten ändert, braucht das
    CSRF-Token in dem Header, den `/config` unter `csrf.header` nennt (WordPress:
    `X-WP-Nonce`, Standalone: `X-CSRF-Token`). Ist es abgelaufen, antwortet der
    Server mit 403 und `code: csrf_invalid` (WordPress: `rest_cookie_invalid_nonce`);
    die App holt dann über `csrf.refreshUrl` aus `/config` ein neues und wiederholt die
    Anfrage einmal.

    **Rechte:** Die `/me`-Routen lesen die Benutzer-ID immer aus der Sitzung.
    Mitglieder sehen nur ihre eigenen Punkte und Strafen.

    **Beträge** sind immer ganze Cent. **Datumsangaben** `YYYY-MM-DD`, Uhrzeiten `HH:MM`
    in der Zeitzone der Kompanie.
servers:
  - url: /wp-json/kompanie-app/v1
    description: WordPress-Plugin
  - url: /api/v1
    description: Eigenständige Version

tags:
  - name: App
  - name: Anmeldung
  - name: Eigene Daten
  - name: Termine
  - name: News
  - name: Galerie
  - name: Verwaltung
  - name: Einstellungen
  - name: Wartung

paths:
  /config:
    get:
      tags: [App]
      summary: Laufzeit-Konfiguration und angemeldeter Benutzer
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }

  /auth/csrf:
    get:
      tags: [Anmeldung]
      summary: Neues CSRF-Token
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Anmeldung]
      summary: Anmelden (nur bei `auth.mode = form`)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, description: Benutzername oder E-Mail-Adresse }
                password: { type: string }
                remember: { type: boolean, default: true, description: "„Angemeldet bleiben“: 400 Tage, verlängert sich beim Öffnen der App" }
      responses:
        '200':
          description: Angemeldet; setzt das Sitzungs-Cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Anmeldung]
      summary: Abmelden (dieses Gerät)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged_out: { type: boolean }

  /me:
    get:
      tags: [Eigene Daten]
      summary: Eigene Übersicht
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }

  /me/points:
    get:
      tags: [Eigene Daten]
      summary: Eigene Punkte
      x-capability: member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointEntry' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/penalties:
    get:
      tags: [Eigene Daten]
      summary: Eigene Strafen
      x-capability: member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Penalty' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/password:
    post:
      tags: [Eigene Daten]
      summary: Eigenes Passwort ändern
      description: Meldet alle anderen Geräte ab. Dieses Gerät bekommt eine neue Sitzung; danach ein neues CSRF-Token holen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /calendar:
    get:
      tags: [Termine]
      summary: Alle Termine aus Google Kalender / iCal (nur Mitglieder)
      description: |
        Der Server hält die letzte gute Fassung bereit (bis `calendar_cache_minutes` frisch) und erneuert sie
        im Hintergrund. Ist sie veraltet und der Kalender gerade nicht erreichbar, kommt die alte Fassung
        mit 200. 502 nur, wenn es noch keine Fassung gibt; ein solcher Fehler wird etwa 60 Sekunden gemerkt.
      x-capability: member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalendarEvent' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503':
          description: Kalender noch nicht eingerichtet (code not_configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events:
    get:
      tags: [Termine]
      summary: Kommende öffentliche Termine
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicEvent' }
    post:
      tags: [Termine]
      summary: Öffentlichen Termin anlegen
      x-capability: manage_events
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Termine]
      summary: Öffentlichen Termin ändern
      x-capability: manage_events
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Termine]
      summary: Öffentlichen Termin löschen
      x-capability: manage_events
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /news:
    get:
      tags: [News]
      summary: Neuigkeiten, seitenweise
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: OK
          headers:
            X-Total-Pages:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NewsItem' }

  /news/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Kennung aus der News-Quelle (bei WordPress die Beitrags-ID).
        schema: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
    get:
      tags: [News]
      summary: Einzelne Neuigkeit mit Inhalt (HTML)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsItem' }
        '404': { $ref: '#/components/responses/Error' }

  /gallery:
    get:
      tags: [Galerie]
      summary: Alben nach Jahr. Gäste sehen nur öffentliche Bilder.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [years]
                properties:
                  years:
                    type: array
                    items: { $ref: '#/components/schemas/GalleryYear' }

  /gallery/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Galerie]
      summary: Album mit Bildern. Mitglieder bekommen die Bilder aus „intern“ dazu.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GalleryAlbum' }
        '404': { $ref: '#/components/responses/Error' }

  /catalog:
    get:
      tags: [Verwaltung]
      summary: Punktekatalog
      parameters:
        - name: all
          in: query
          description: Auch inaktive Einträge (nur mit Recht `manage`).
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogItem' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Verwaltung]
      summary: Katalogeintrag anlegen
      x-capability: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, points]
              properties:
                title: { type: string }
                points: { type: integer }
                sort: { type: integer }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /catalog/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Katalogeintrag ändern
      x-capability: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                points: { type: integer }
                active: { type: boolean }
                sort: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members:
    get:
      tags: [Verwaltung]
      summary: Mitglieder mit Summen
      x-capability: manage
      parameters:
        - name: all
          in: query
          description: Auch Gast-Konten (nur mit Recht `promote_users`).
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberSummary' }
        '403': { $ref: '#/components/responses/Error' }

  /members/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Verwaltung]
      summary: Mitglied mit Punkten und Strafen
      x-capability: manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/role:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Rolle in der App setzen (nicht die eigene)
      description: |
        `admin` ist nur in der eigenständigen Version erlaubt; bei WordPress werden
        Admin-Rechte nur im WP-Backend vergeben. Der letzte Admin kann nicht
        herabgestuft werden.
      x-capability: promote_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: string
                  enum: [guest, member, organizer, manager, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  level: { $ref: '#/components/schemas/Level' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/password:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Verwaltung]
      summary: Neues Startpasswort für ein Mitglied erzeugen
      description: |
        Neu gegenüber der ersten Umsetzung. Ersetzt „Passwort vergessen“ per E-Mail: Ein Admin erzeugt ein
        neues Startpasswort, das nur in dieser Antwort steht. Alle Geräte des Mitglieds
        werden abgemeldet.
      x-capability: create_users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [password]
                properties:
                  password: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /users:
    post:
      tags: [Verwaltung]
      summary: Mitglied anlegen
      description: Erzeugt ein zufälliges Startpasswort, das nur in dieser Antwort steht. Es wird keine E-Mail verschickt.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                username: { type: string, description: 'Optional; erlaubt sind a–z, Ziffern, . _ - @' }
                email: { type: string, format: email }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUser' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /points:
    post:
      tags: [Verwaltung]
      summary: Punkte an ein oder mehrere Mitglieder vergeben
      x-capability: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                points: { type: integer, description: 'Ohne Angabe: Punkte des Katalogeintrags. Nicht 0.' }
                catalog_id: { type: integer }
                reason: { type: string, description: 'Ohne Angabe: Titel des Katalogeintrags.' }
                date: { type: string, format: date }
      responses:
        '201':
          description: Angelegt (ein Eintrag pro Mitglied)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /points/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Verwaltung]
      summary: Punkte stornieren (wird nur ausgeblendet)
      x-capability: manage
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /penalties:
    post:
      tags: [Verwaltung]
      summary: Strafe an ein oder mehrere Mitglieder vergeben
      x-capability: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, amount_cents, reason]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                amount_cents: { type: integer, minimum: 1, maximum: 100000 }
                reason: { type: string }
                date: { type: string, format: date }
      responses:
        '201':
          description: Angelegt (eine Strafe pro Mitglied)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Penalty' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /penalties/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Strafe als bezahlt/offen markieren
      x-capability: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, paid] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Penalty' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Strafe stornieren (wird nur ausgeblendet)
      x-capability: manage
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/features:
    get:
      tags: [Einstellungen]
      summary: Bereiche der App mit Schalter, Bezeichnung und Einrichtungsstand
      description: |
        Welche Bereiche eine Kompanie nutzt, entscheidet allein ihr Admin (Ersteinrichtung bzw. Einstellungen → Bereiche).
        Neue Installationen starten ohne Bereiche. Ein ausgeschalteter Bereich verschwindet aus der App, seine Routen
        antworten mit 403 `feature_disabled`, seine Hintergrundaufgaben laufen nicht; die Daten bleiben erhalten.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Einstellungen]
      summary: Bereiche ein- und ausschalten
      description: Nur mitgeschickte Bereiche werden geändert. Unbekannte Bereiche oder Werte, die kein Wahrheitswert sind → 400.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
              example: { gallery: true, penalties: false }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/settings:
    get:
      tags: [Einstellungen]
      summary: Einstellungen für Kalender, Galerie und Neuigkeiten
      description: Geheime Werte (iCal-Adresse, API-Schlüssel, Dienstkonto) werden nie zurückgegeben, nur ob sie gesetzt sind.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Einstellungen]
      summary: Einstellungen ändern
      description: Nur mitgeschickte Felder werden übernommen; ein leerer Text löscht den Wert.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                calendar_ics_url: { type: string, description: 'Geheime iCal-Adresse; webcal:// wird als https:// gespeichert' }
                google_api_key: { type: string }
                calendar_ids: { type: string, description: Kommagetrennte Kalender-IDs (nur mit API-Schlüssel) }
                calendar_cache_minutes: { type: integer, minimum: 1, maximum: 1440 }
                drive_service_account: { type: string, description: JSON-Schlüssel des Dienstkontos }
                gallery_root: { type: string, description: Link oder ID des Galerie-Ordners in Google Drive }
                news_source: { type: string, enum: [none, wordpress, rss], description: Nur eigenständige Version }
                news_url: { type: string, description: Nur eigenständige Version }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/calendar/test:
    post:
      tags: [Einstellungen]
      summary: Kalender ohne Zwischenspeicher abrufen
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, sample]
                properties:
                  count: { type: integer }
                  sample:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      properties:
                        start: { type: string }
                        title: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/news/test:
    post:
      tags: [Einstellungen]
      summary: Quelle der Neuigkeiten ohne Zwischenspeicher abrufen (nur eigenständige Version)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, description: Beiträge auf der ersten Seite }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/gallery/sync:
    post:
      tags: [Einstellungen]
      summary: Galerie von Hand abgleichen und Bilder aufbereiten
      description: |
        Gleicht mit Google Drive ab und bereitet Bilder auf, solange das Zeitbudget reicht (etwa 20 Sekunden).
        Steht danach noch etwas aus (`pending` > 0), ruft die App mit `only_process: true` erneut auf.
      x-capability: manage_settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                only_process: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums: { type: integer }
                  photos: { type: integer }
                  processed: { type: integer }
                  pending: { type: integer }
                  failed: { type: integer, description: Bilder, die sich nicht laden ließen (werden beim nächsten Abgleich erneut versucht) }
                  error: { type: string, description: Fehler des Abgleichs, sonst leer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/status:
    get:
      tags: [Wartung]
      summary: Zustand der Installation (Ampel), Updates, Statusmeldungen
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, support, updates, statusReports, setupDone]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, label, level, text]
                      properties:
                        key: { type: string, description: 'z. B. updates, gallery, calendar, backup, server' }
                        label: { type: string }
                        level: { type: string, enum: [ok, warn, error, off] }
                        text: { type: string }
                  support: { type: string, description: Kontakt für Hilfe (E-Mail oder Webadresse), sonst leer }
                  updates: { $ref: '#/components/schemas/UpdateStatus' }
                  statusReports:
                    type: object
                    properties:
                      enabled: { type: boolean, description: Der Admin hat Statusmeldungen zugestimmt }
                      available: { type: boolean, description: Das Paket nennt einen Empfänger }
                      payload: { type: object, description: 'Genau das, was gesendet würde (ohne Namen oder Inhalte)' }
                  setupDone: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/update/check:
    post:
      tags: [Wartung]
      summary: Update-Liste jetzt laden und prüfen (Signatur, Kompanie, laufende Nummer)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update/install:
    post:
      tags: [Wartung]
      summary: Eine Version aus der geprüften Liste einspielen
      description: |
        Vorher wird bei Datenbank-Änderungen und vor einer neuen Hauptversion automatisch gesichert. Eine neue
        Hauptversion nur mit `major` true. Im Kanal stable nur schon freigegebene Versionen. 409, wenn gerade
        schon ein Update läuft.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: 1.4.0.3 }
                major: { type: boolean, default: false }
      responses:
        '200':
          description: Eingespielt
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update/rollback:
    post:
      tags: [Wartung]
      summary: Auf eine ältere Version derselben Hauptversion zurück
      description: Die bisherige Version wird danach beim automatischen Update übersprungen, bis eine neuere erscheint.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
      responses:
        '200':
          description: Eingespielt
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update:
    patch:
      tags: [Wartung]
      summary: Automatische Updates und Statusmeldungen ein- oder ausschalten
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto: { type: boolean }
                status_reports: { type: boolean, description: Zustimmung zu täglichen Statusmeldungen }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/backup:
    get:
      tags: [Wartung]
      summary: Datensicherung herunterladen
      description: |
        Gemeinsames Format `kompanie-app-backup` (Tabellen und Einstellungen; eigenständige Version
        auch Konten mit Passwort-Hashes). Enthält Zugangsschlüssel – sicher aufbewahren.
      x-capability: manage_settings
      responses:
        '200':
          description: Sicherung (mit Content-Disposition attachment)
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Wartung]
      summary: Sicherung wiederherstellen (ersetzt alle Daten)
      description: |
        Eigenständige Version: nur Sicherungen der eigenständigen Version mit mindestens einem Admin;
        alle Sitzungen enden. WordPress: nur Sicherungen derselben Website.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup, confirm]
              properties:
                backup: { type: string, description: Inhalt der Sicherungsdatei }
                confirm: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Wiederhergestellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/setup/done:
    post:
      tags: [Wartung]
      summary: Einrichtungsassistent abschließen (setupPending wird danach false)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  done: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

security:
  - session: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Name und Inhalt des Cookies hängen vom Adapter ab (WordPress-Anmelde-Cookie bzw. eigene Sitzung).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Error:
      description: Fehler
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Deleted:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean }

  schemas:
    Feature:
      type: object
      required: [key, label, description, enabled, requires, configured, setup]
      properties:
        key:
          type: string
          enum: [events, calendar, news, gallery, points, penalties]
        label: { type: string, description: Bezeichnung (aus kompanie.json oder Standard) }
        description: { type: string, description: Ein Satz, wofür der Bereich da ist }
        enabled: { type: boolean }
        requires:
          type: array
          items: { type: string }
          description: Bereiche, die eingeschaltet sein müssen
        configured:
          type: [boolean, 'null']
          description: Ob der Bereich eingerichtet ist (z. B. Kalender mit Adresse); null = braucht keine Einrichtung
        setup:
          type: [string, 'null']
          description: Abschnitt der Einstellungen bzw. Schritt der Ersteinrichtung, z. B. `kalender`
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            z. B. `not_logged_in` (401), `forbidden` (403), `invalid` (400), `not_found` (404),
            `feature_disabled` (403, Bereich vom Admin ausgeschaltet), `method_not_allowed` (405),
            `csrf_invalid` (403), `upstream_error` (502), `not_configured` (503), `internal_error` (500).
            Nur eigenständige Version: `login_failed` (400), `too_many_attempts` (429),
            `unsupported_media_type` (415, Änderungen nur als JSON), `not_installed` (503).
            Nur WordPress: `use_login_page` (400).
        message: { type: string, description: Für Menschen lesbar, in der Sprache der Kompanie }

    AdminSettings:
      type: object
      required: [calendar, gallery, news]
      properties:
        calendar:
          type: object
          properties:
            source: { type: string, enum: [ics, google, none] }
            ics_url_set: { type: boolean }
            google_api_key_set: { type: boolean }
            calendar_ids: { type: string }
            cache_minutes: { type: integer }
        gallery:
          type: object
          properties:
            configured: { type: boolean }
            root: { type: string }
            service_account_email: { type: string }
            status:
              type: object
              description: Stand des letzten Abgleichs (albums, photos, new, pending, last_sync, error)
        news:
          type: [object, 'null']
          description: null, wenn die Neuigkeiten aus den Beiträgen der WordPress-Seite kommen.
          properties:
            source: { type: string, enum: [none, wordpress, rss] }
            url: { type: string }

    Level:
      type: string
      enum: [admin, manager, organizer, member, guest]
      description: Rolle in der App. Die Anzeigenamen stehen in `kompanie.json` (`roleLabels`).

    AppUser:
      type: object
      required: [id, name, level, capabilities]
      properties:
        id: { type: integer }
        name: { type: string }
        login: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        capabilities:
          type: array
          items:
            type: string
            enum: [member, manage, manage_events, manage_documents, create_users, promote_users, manage_settings]

    UpdateStatus:
      type: object
      properties:
        configured: { type: boolean, description: Paket mit Update-Adresse und der Adapter kann einspielen }
        current: { type: string }
        channel: { type: string, enum: [early, stable] }
        auto: { type: boolean }
        checked_at: { type: [integer, 'null'] }
        error: { type: string, description: Fehler der letzten Prüfung, sonst leer }
        latest: { type: [string, 'null'] }
        available: { type: boolean, description: Neuere Version derselben Hauptversion verfügbar }
        major: { type: boolean, description: Neue Hauptversion verfügbar (nur mit Bestätigung) }
        majorVersion: { type: string }
        withdrawn: { type: boolean, description: Die installierte Version wurde zurückgezogen }
        fallback: { type: [string, 'null'], description: 'Bei withdrawn: Ziel des automatischen Wechsels; null = keins vorhanden' }
        skipped: { type: boolean, description: 'latest wird nach dem Zurückrollen nicht automatisch eingespielt' }
        autoAllowed: { type: boolean, description: 'Automatische Updates sind hier erlaubt (WordPress kann sie sperren)' }
        problems: { type: array, items: { type: string }, description: Gründe, warum die neue Version hier nicht läuft }
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: string }
              published: { type: string }
        last:
          type: [object, 'null']
          description: Letzter Update-Versuch
          properties:
            from: { type: string }
            to: { type: string }
            kind: { type: string, enum: [auto, manual, rollback, withdrawn] }
            at: { type: integer }
            ok: { type: boolean }
            error: { type: string }

    AppConfig:
      type: object
      required: [apiBase, appUrl, swUrl, auth, csrf, features, user, version]
      properties:
        apiBase: { type: string }
        appUrl: { type: string }
        swUrl: { type: string, description: 'Adresse des Service Workers (Bereich: appUrl)' }
        version: { type: string, description: 'Version der Installation, z. B. 1.4.0.3' }
        variant: { type: string, enum: [wordpress, standalone], description: Art der Installation }
        siteUrl: { type: [string, 'null'], description: Startseite der Webseite, falls vorhanden }
        setupPending: { type: boolean, description: 'Nur für Admins true: Einrichtungsassistent noch nicht abgeschlossen' }
        csrf:
          type: object
          required: [header, token, refreshUrl]
          properties:
            header: { type: string, description: 'Name des Headers, z. B. X-CSRF-Token oder X-WP-Nonce' }
            token: { type: string, description: Leer für Gäste ohne Anmeldung }
            refreshUrl:
              type: string
              description: |
                GET liefert {token}. Funktioniert allein mit dem Sitzungs-Cookie, auch wenn das
                alte Token abgelaufen ist (WordPress: /app/csrf, Standalone: {apiBase}auth/csrf).
        auth:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [form, redirect]
            loginUrl: { type: [string, 'null'], description: Nur bei `redirect` }
            logoutUrl: { type: [string, 'null'], description: Nur bei `redirect` und Anmeldung }
        features:
          type: object
          description: Bereiche, die der Admin eingeschaltet hat **und** die auf dem Server eingerichtet sind.
          properties:
            events: { type: boolean }
            calendar: { type: boolean }
            news: { type: boolean }
            gallery: { type: boolean }
            points: { type: boolean }
            penalties: { type: boolean }
        user:
          oneOf:
            - $ref: '#/components/schemas/AppUser'
            - type: 'null'
          description: null = Gast ohne Anmeldung

    Me:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        points: { type: integer }
        open_cents: { type: integer }

    PointEntry:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        points: { type: integer }
        reason: { type: string }
        catalog_id: { type: [integer, 'null'] }
        date: { type: string, format: date }
        created_by_name: { type: [string, 'null'] }

    Penalty:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        amount_cents: { type: integer }
        reason: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [open, paid] }
        paid_at: { type: [string, 'null'] }
        created_by_name: { type: [string, 'null'] }

    CatalogItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        points: { type: integer }
        active: { type: boolean }
        sort: { type: integer }

    CalendarEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        start: { type: string, description: ISO 8601 }
        end: { type: string, description: ISO 8601 }
        all_day: { type: boolean }
        location: { type: string }
        description: { type: string }

    PublicEvent:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        start: { type: string }
        end: { type: string }
        all_day: { type: boolean }
        location: { type: string }
        description: { type: string }
        start_date: { type: string, format: date }
        start_time: { type: [string, 'null'] }
        end_date: { type: [string, 'null'] }
        end_time: { type: [string, 'null'] }
        url: { type: string }

    EventInput:
      type: object
      required: [title, start_date]
      properties:
        title: { type: string }
        start_date: { type: string, format: date }
        start_time: { type: string, description: 'HH:MM oder leer' }
        end_date: { type: string, description: 'YYYY-MM-DD oder leer' }
        end_time: { type: string, description: 'HH:MM oder leer' }
        location: { type: string }
        description: { type: string }
        url: { type: string }

    NewsItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string, description: 'ISO 8601 (UTC); leer, wenn die Quelle kein lesbares Datum liefert' }
        excerpt: { type: string }
        image: { type: [string, 'null'] }
        link: { type: string }
        content: { type: string, description: Nur bei der Einzelansicht }

    GalleryAlbumSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        count: { type: integer }
        intern_count: { type: integer }
        cover: { type: [string, 'null'] }

    GalleryYear:
      type: object
      properties:
        year: { type: string }
        albums:
          type: array
          items: { $ref: '#/components/schemas/GalleryAlbumSummary' }

    GalleryPhoto:
      type: object
      properties:
        id: { type: integer }
        thumb:
          type: string
          description: |
            Adresse des Vorschaubilds. Öffentliche fertige Bilder als statische Datei, sonst über die App
            (`…/foto/<id>/thumb`, außerhalb der API). Dort antwortet der Server für Bilder, die noch nicht
            aufbereitet sind, mit **202**, einem grauen SVG-Platzhalter im Seitenverhältnis des Fotos,
            `Cache-Control: no-store` und `Retry-After` (Sekunden); die Aufbereitung läuft im Hintergrund.
            Fertige Bilder: 200 mit JPEG. Interne Bilder ohne Mitgliedschaft: 401/403.
        large: { type: string, description: Adresse der Großansicht (Verhalten wie thumb) }
        width: { type: integer }
        height: { type: integer }
        intern: { type: boolean }
        name: { type: string }

    GalleryAlbum:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        year: { type: string }
        photos:
          type: array
          items: { $ref: '#/components/schemas/GalleryPhoto' }

    MemberSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        points: { type: integer }
        open_cents: { type: integer }

    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          properties:
            point_list:
              type: array
              items: { $ref: '#/components/schemas/PointEntry' }
            penalties:
              type: array
              items: { $ref: '#/components/schemas/Penalty' }

    CreatedUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        email: { type: string }
        password: { type: string, description: Startpasswort; steht nur in dieser Antwort }

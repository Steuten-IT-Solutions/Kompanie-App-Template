openapi: 3.1.0
info:
  title: Kompanie-App API
  version: 0.1.0
  description: |
    Vertrag zwischen der PWA und dem Server. Beide Adapter setzen ihn um:
    - WordPress: `/wp-json/kompanie-app/v1`
    - Standalone: `/api/v1`

    Abgeleitet aus der REST-API der ersten Umsetzung (Plugin 0.3.0). Neu sind
    `/config` und `/auth/*`; sie ersetzen die bisher von PHP eingespeiste Konfiguration, den WordPress-Nonce und
    den festen Weg über `wp-login.php`.

    **Anmeldung:** Sitzungs-Cookie. Jede Anfrage, die Daten ändert, braucht das
    CSRF-Token in dem Header, den `/config` unter `csrf.header` nennt (WordPress:
    `X-WP-Nonce`, Standalone: `X-CSRF-Token`). Ist es abgelaufen, antwortet der
    Server mit 403 und `code: csrf_invalid` (WordPress: `rest_cookie_invalid_nonce`);
    die App holt dann über `csrf.refreshUrl` aus `/config` ein neues und wiederholt die
    Anfrage einmal.

    **Rechte:** Die `/me`-Routen lesen die Benutzer-ID immer aus der Sitzung.
    Mitglieder sehen nur ihre eigenen Punkte und Strafen.

    **Beträge** sind immer ganze Cent. **Datumsangaben** `YYYY-MM-DD`, Uhrzeiten `HH:MM`
    in der Zeitzone der Kompanie.
servers:
  - url: /wp-json/kompanie-app/v1
    description: WordPress-Plugin
  - url: /api/v1
    description: Eigenständige Version

tags:
  - name: App
  - name: Anmeldung
  - name: Eigene Daten
  - name: Benachrichtigungen
  - name: Termine
  - name: News
  - name: Galerie
  - name: Verwaltung
  - name: Einstellungen
  - name: Wartung

paths:
  /config:
    get:
      tags: [App]
      summary: Laufzeit-Konfiguration und angemeldeter Benutzer
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }

  /auth/csrf:
    get:
      tags: [Anmeldung]
      summary: Neues CSRF-Token
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Anmeldung]
      summary: Anmelden (nur bei `auth.mode = form`)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, description: Benutzername oder E-Mail-Adresse }
                password: { type: string }
                remember: { type: boolean, default: true, description: "„Angemeldet bleiben“: 400 Tage, verlängert sich beim Öffnen der App" }
      responses:
        '200':
          description: Angemeldet; setzt das Sitzungs-Cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Anmeldung]
      summary: Abmelden (dieses Gerät)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged_out: { type: boolean }

  /me:
    get:
      tags: [Eigene Daten]
      summary: Eigene Übersicht
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }

  /me/attendance:
    get:
      tags: [Eigene Daten]
      summary: Eigene Anwesenheit (jüngste Termine zuerst) mit Summen
      x-capability: member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        list_id: { type: integer }
                        title: { type: string }
                        date: { type: string, format: date }
                        status: { $ref: '#/components/schemas/AttendanceStatus' }
                  counts: { $ref: '#/components/schemas/AttendanceCounts' }
        '403': { $ref: '#/components/responses/Error' }

  /me/points:
    get:
      tags: [Eigene Daten]
      summary: Eigene Punkte
      x-capability: member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointEntry' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/penalties:
    get:
      tags: [Eigene Daten]
      summary: Eigene Strafen
      x-capability: member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Penalty' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/password:
    post:
      tags: [Eigene Daten]
      summary: Eigenes Passwort ändern
      description: Meldet alle anderen Geräte ab. Dieses Gerät bekommt eine neue Sitzung; danach ein neues CSRF-Token holen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /push/key:
    get:
      tags: [Benachrichtigungen]
      summary: Öffentlicher VAPID-Schlüssel des Servers
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [supported, publicKey]
                properties:
                  supported: { type: boolean, description: Der Server kann Push-Nachrichten verschlüsseln und signieren }
                  publicKey: { type: string, description: 'applicationServerKey (base64url, unkomprimierter P-256-Punkt); leer, wenn nicht unterstützt' }

  /me/push/status:
    post:
      tags: [Benachrichtigungen]
      summary: Mögliche Arten und das Abo dieses Geräts (Konto)
      description: |
        POST, damit die Push-Adresse nicht in Protokollen von Adressen landet. Mit `auth` gibt das Gerät außerdem ein
        Abo frei, das einem anderen, hier nicht mehr angemeldeten Konto gehört (die App fragt dazu beim Start nach).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
                auth: { type: string, description: auth-Geheimnis des Geräts (base64url) }
      responses:
        '200': { $ref: '#/components/responses/PushStatus' }
        '401': { $ref: '#/components/responses/Error' }

  /push/status:
    post:
      tags: [Benachrichtigungen]
      summary: Mögliche Arten und das Abo dieses Geräts (Gast ohne Konto)
      description: Gibt wie `/me/push/status` das Abo eines hier nicht mehr angemeldeten Kontos frei.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
                auth: { type: string, description: auth-Geheimnis des Geräts (base64url) }
      responses:
        '200': { $ref: '#/components/responses/PushStatus' }

  /me/push:
    post:
      tags: [Benachrichtigungen]
      summary: Gerät für Benachrichtigungen anmelden (Konto)
      description: |
        Übernimmt ein vorhandenes Abo desselben Geräts (gleiches auth-Geheimnis), z. B. nach einem Kontowechsel.
        Höchstens 10 Geräte je Konto; das älteste fällt dann weg. Ohne `types` alle möglichen Arten; mindestens eine
        erlaubte Art muss übrig bleiben (sonst 400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscribe' }
      responses:
        '200': { $ref: '#/components/responses/PushSubscription' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
    put:
      tags: [Benachrichtigungen]
      summary: Arten und Details-Schalter ändern (Konto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
                types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
                details: { type: boolean, description: 'Bei Strafen Betrag und Grund in der Nachricht zeigen (sonst nur ein Hinweis); Punkte zeigen immer Wert und Grund' }
      responses:
        '200': { $ref: '#/components/responses/PushSubscription' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Benachrichtigungen]
      summary: Gerät abmelden (Konto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Error' }

  /push:
    post:
      tags: [Benachrichtigungen]
      summary: Gerät für öffentliche Benachrichtigungen anmelden (Gast ohne Konto)
      description: |
        Nur öffentliche Arten (Termine, Erinnerung, News). Neue Gast-Abos sind je Anfragendem (IPv6: je /64-Netz) und
        insgesamt begrenzt; ohne Änderung und ohne Nachricht verfallen sie nach 180 Tagen.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscribe' }
      responses:
        '200': { $ref: '#/components/responses/PushSubscription' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [Benachrichtigungen]
      summary: Arten ändern (Gast, nur mit dem auth-Geheimnis des Geräts)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, auth]
              properties:
                endpoint: { type: string }
                auth: { type: string }
                types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
      responses:
        '200': { $ref: '#/components/responses/PushSubscription' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Benachrichtigungen]
      summary: Gerät abmelden (Gast, nur mit dem auth-Geheimnis des Geräts)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, auth]
              properties:
                endpoint: { type: string }
                auth: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }

  /me/push/test:
    post:
      tags: [Benachrichtigungen]
      summary: Testnachricht an dieses Gerät (Konto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        '200': { $ref: '#/components/responses/PushTest' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /push/test:
    post:
      tags: [Benachrichtigungen]
      summary: Testnachricht an dieses Gerät (Gast)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, auth]
              properties:
                endpoint: { type: string }
                auth: { type: string }
      responses:
        '200': { $ref: '#/components/responses/PushTest' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /calendar:
    get:
      tags: [Termine]
      summary: Alle Termine aus Google Kalender / iCal (Mitglieder und Anwärter)
      description: |
        Der Server hält die letzte gute Fassung bereit (bis `calendar_cache_minutes` frisch) und erneuert sie
        im Hintergrund. Ist sie veraltet und der Kalender gerade nicht erreichbar, kommt die alte Fassung
        mit 200. 502 nur, wenn es noch keine Fassung gibt; ein solcher Fehler wird etwa 60 Sekunden gemerkt.
      x-capability: calendar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalendarEvent' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503':
          description: Kalender noch nicht eingerichtet (code not_configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events:
    get:
      tags: [Termine]
      summary: Kommende öffentliche Termine
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicEvent' }
    post:
      tags: [Termine]
      summary: Öffentlichen Termin anlegen
      x-capability: manage_events
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Termine]
      summary: Öffentlichen Termin ändern
      x-capability: manage_events
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Termine]
      summary: Öffentlichen Termin löschen
      x-capability: manage_events
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /news:
    get:
      tags: [News]
      summary: Neuigkeiten, seitenweise
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: OK
          headers:
            X-Total-Pages:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NewsItem' }

  /news/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Kennung aus der News-Quelle (bei WordPress die Beitrags-ID).
        schema: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
    get:
      tags: [News]
      summary: Einzelne Neuigkeit mit Inhalt (HTML)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsItem' }
        '404': { $ref: '#/components/responses/Error' }

  /gallery:
    get:
      tags: [Galerie]
      summary: Alben nach Jahr. Gäste sehen nur öffentliche Bilder.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [years]
                properties:
                  years:
                    type: array
                    items: { $ref: '#/components/schemas/GalleryYear' }

  /gallery/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Galerie]
      summary: Album mit Bildern. Mitglieder bekommen die Bilder aus „intern“ dazu.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GalleryAlbum' }
        '404': { $ref: '#/components/responses/Error' }

  /me/rank:
    get:
      tags: [Eigene Daten]
      summary: Eigener Dienstgrad, Liste und Verlauf (Bereich Dienstgrade)
      description: Mit dem Bereich Punkte zusätzlich Schwellen, nächster Dienstgrad und fehlende Punkte. Nur der eigene Verlauf.
      x-capability: member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RankStatus'
                  - type: object
                    properties:
                      ranks:
                        type: array
                        items: { $ref: '#/components/schemas/Rank' }
                      history:
                        type: array
                        items: { $ref: '#/components/schemas/RankHistoryEntry' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /ranks:
    get:
      tags: [Verwaltung]
      summary: Dienstgrade (aktive, vom niedrigsten zum höchsten)
      x-capability: member
      parameters:
        - name: all
          in: query
          description: Auch inaktive, mit Anzahl der Vergaben (nur mit manage_ranks).
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rank' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Verwaltung]
      summary: Dienstgrad anlegen (ans obere Ende)
      description: Gesetzte Schwellen aktiver Dienstgrade müssen mit der Reihenfolge streng steigen, sonst 400.
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 60 }
                min_points: { type: [integer, 'null'], minimum: 0 }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rank' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /ranks/order:
    put:
      tags: [Verwaltung]
      summary: Reihenfolge festlegen (alle IDs vom niedrigsten zum höchsten)
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rank' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /ranks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Dienstgrad ändern (Bezeichnung, Schwelle, aktiv)
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 60 }
                min_points: { type: [integer, 'null'], minimum: 0 }
                active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rank' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Dienstgrad löschen (vergebene nur deaktivieren → 400)
      x-capability: manage_ranks
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /ranks/{id}/badge:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Verwaltung]
      summary: Abzeichen hochladen oder ersetzen (Issue #17)
      description: |
        PNG, JPG, WebP oder SVG, höchstens 1 MB, Base64 im JSON. Geprüft werden Endung und Signatur (Rasterbilder
        höchstens 4096 × 4096 Pixel). Rasterbilder werden zu PNG in 64, 128 und 256 Pixeln (längere Kante, nie
        vergrößert, Transparenz bleibt). SVGs werden bereinigt gespeichert (keine Skripte, keine Verweise nach außen,
        kein DOCTYPE); `png` ist dann optional eine in der App gezeichnete PNG-Fassung (256 Pixel) für Benachrichtigungen.
        Ein vorhandenes Abzeichen wird ersetzt und gelöscht; die Fassung (und damit `badge_url`) ändert sich.
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: object
                  required: [name, data]
                  properties:
                    name: { type: string, description: 'Dateiname; die Endung (.png, .jpg, .jpeg, .webp, .svg) bestimmt das Format' }
                    data: { type: string, description: 'Inhalt Base64-kodiert (auch als data:-Adresse)' }
                png: { type: string, description: 'Nur bei SVG, optional: PNG-Fassung Base64-kodiert, für das Bild in Benachrichtigungen' }
      responses:
        '200':
          description: Der Dienstgrad wie in GET /ranks?all=1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rank' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Abzeichen entfernen (löscht die Dateien)
      x-capability: manage_ranks
      responses:
        '200':
          description: Der Dienstgrad ohne Abzeichen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rank' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/rank:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Verwaltung]
      summary: Befördern oder degradieren
      description: |
        Ohne den Bereich Punkte frei. Mit Punkten (für alle, auch Admins): befördern erst ab der Schwelle des Ziels,
        degradieren nur unter der Schwelle des aktuellen Dienstgrads; Dienstgrade ohne Schwelle frei. Schreibt den Verlauf.
        Wer kein Mitglied mehr ist (z. B. Gast), kann den Dienstgrad nur verlieren (`rank_id: null`, ohne Punkteregeln).
      x-capability: manage_ranks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rank_id: { type: [integer, 'null'], description: null = kein Dienstgrad }
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /promotions:
    get:
      tags: [Verwaltung]
      summary: Beförderungsübersicht (nur zusammen mit dem Bereich Punkte)
      description: |
        Nur Mitglieder (ohne Gäste und Anwärter). Erreichte Schwellen zuerst (älteste oben), dann nach fehlenden Punkten;
        ohne nächsten Dienstgrad mit Schwelle am Ende. Enthält die Punktestände, auch wenn der Abrufende selbst kein
        manage_points hat (die Übersicht braucht sie).
      x-capability: manage_ranks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/RankStatus'
                    - type: object
                      properties:
                        user_id: { type: integer }
                        name: { type: string }
        '403': { $ref: '#/components/responses/Error' }

  /documents:
    get:
      tags: [Verwaltung]
      summary: Sichtbare Dokumente (nach Titel) und alle Kategorien (Issue #2)
      description: Dokumente mit Sichtbarkeit `managers` nur für wer `manage_documents` hat; für sie auch `max_bytes`.
      x-capability: member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories: { type: array, items: { $ref: '#/components/schemas/DocCategory' } }
                  documents: { type: array, items: { $ref: '#/components/schemas/DocumentInfo' } }
                  max_bytes: { type: integer, description: 'Höchstgröße einer Datei: 20 MB oder weniger (post_max_size, memory_limit)' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Verwaltung]
      summary: Dokument hochladen
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date, file]
              properties:
                title: { type: string, maxLength: 191 }
                category_id: { type: [integer, 'null'] }
                date: { type: string, format: date }
                visibility: { type: string, enum: [members, managers], default: members }
                file: { $ref: '#/components/schemas/DocumentFile' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /documents/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Titel, Kategorie, Stand oder Sichtbarkeit ändern
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 191 }
                category_id: { type: [integer, 'null'] }
                date: { type: string, format: date }
                visibility: { type: string, enum: [members, managers] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Dokument und Datei löschen
      x-capability: manage_documents
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /documents/{id}/file:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Verwaltung]
      summary: Neue Fassung (ersetzt die Datei, auch mit anderer Endung; version ändert sich)
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file: { $ref: '#/components/schemas/DocumentFile' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /document-categories:
    post:
      tags: [Verwaltung]
      summary: Kategorie anlegen (kommt ans Ende)
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 191 }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocCategory' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /document-categories/order:
    put:
      tags: [Verwaltung]
      summary: Reihenfolge der Kategorien
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer }, description: Alle IDs in der gewünschten Reihenfolge }
      responses:
        '200':
          description: Neue Reihenfolge
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocCategory' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /document-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Kategorie umbenennen
      x-capability: manage_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 191 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocCategory' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Kategorie löschen (ihre Dokumente stehen danach ohne Kategorie da)
      x-capability: manage_documents
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /attendance:
    get:
      tags: [Verwaltung]
      summary: Die letzten 50 Anwesenheitslisten (Issue #21)
      x-capability: manage_attendance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceSummary' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Verwaltung]
      summary: Liste anlegen oder ändern und Status setzen
      description: |
        Mit `id` eine vorhandene Liste (bei freien Listen auch Titel und Datum). Ohne `id` neu: `source: calendar` mit
        `event_key` (gibt es schon eine Liste zu diesem Termin, wird sie genommen, 200) oder `source: free` mit `title` und
        `date`. Titel und Datum sind eine Momentaufnahme. `entries` setzt den Status je Person (null entfernt ihn);
        nur Personen mit einer Rolle (keine Gäste).
      x-capability: manage_attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                source: { type: string, enum: [calendar, free] }
                event_key: { type: string }
                title: { type: string, maxLength: 191 }
                date: { type: string, format: date }
                entries:
                  type: object
                  description: Benutzer-ID → Status
                  additionalProperties:
                    oneOf:
                      - $ref: '#/components/schemas/AttendanceStatus'
                      - type: 'null'
      responses:
        '200':
          description: Geändert bzw. vorhandene Liste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceDetail' }
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /attendance/events:
    get:
      tags: [Verwaltung]
      summary: Termine aus dem internen Kalender der letzten 90 Tage bis heute (jüngste zuerst)
      description: Ohne Bereich Kalender bzw. ohne eingerichteten Kalender eine leere Liste.
      x-capability: manage_attendance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    title: { type: string }
                    date: { type: string, format: date }
                    start: { type: string }
                    end: { type: string }
                    all_day: { type: boolean }
                    list_id: { type: [integer, 'null'], description: Schon angelegte Liste }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /attendance/groups:
    get:
      tags: [Einstellungen]
      summary: Gruppen im Zähler je Rolle (ohne Gast)
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/AttendanceGroups' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Einstellungen]
      summary: Gruppen im Zähler ändern
      description: |
        Je Rolle null (eigene Gruppe) oder die Rolle, als die sie zählt. Ziele müssen selbst als eigene Gruppe zählen
        (keine Ketten, sonst 400). Nicht genannte Rollen bleiben, wie sie sind. Ohne Einstellung zählen Rollen mit
        Mitgliederbereich als Mitglied, die übrigen als eigene Gruppe.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groups]
              properties:
                groups:
                  type: object
                  additionalProperties: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/AttendanceGroups' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /attendance/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Verwaltung]
      summary: Liste mit allen Personen, Status, gebuchten Punkten und Zählern
      x-capability: manage_attendance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Liste löschen (gebuchte Punkte bleiben)
      x-capability: manage_attendance
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /titles:
    get:
      tags: [Verwaltung]
      summary: Titelliste (Ehrentitel und Ämter, Issue #22)
      x-capability: manage_titles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Title' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Verwaltung]
      summary: Titel anlegen (kommt ans Ende der Liste)
      x-capability: manage_titles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 60, description: Eindeutig ohne Groß-/Kleinschreibung }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Title' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /titles/order:
    put:
      tags: [Verwaltung]
      summary: Reihenfolge der Titel
      x-capability: manage_titles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer }, description: Alle IDs in der gewünschten Reihenfolge }
      responses:
        '200':
          description: Neue Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Title' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /titles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Titel umbenennen oder (de)aktivieren
      x-capability: manage_titles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 60 }
                active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Title' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Titel löschen (zugewiesene nur umbenennen oder deaktivieren → 400)
      x-capability: manage_titles
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/titles:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Verwaltung]
      summary: Titel eines Mitglieds ersetzen
      description: |
        Neu vergeben werden nur aktive Titel und nur an Mitglieder; deaktivierte, die das Mitglied schon hat, darf es
        behalten. Wer kein Mitglied mehr ist (z. B. Gast), kann Titel nur verlieren. Neu verliehene Titel lösen eine Benachrichtigung (Art `titles`) aus, entfernte nicht.
      x-capability: manage_titles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title_ids]
              properties:
                title_ids: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Neue Titel des Mitglieds
          content:
            application/json:
              schema:
                type: object
                properties:
                  titles: { type: array, items: { $ref: '#/components/schemas/TitleRef' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /catalog:
    get:
      tags: [Verwaltung]
      summary: Punktekatalog
      parameters:
        - name: all
          in: query
          description: Auch inaktive Einträge (nur mit Recht `manage`).
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogItem' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Verwaltung]
      summary: Katalogeintrag anlegen
      x-capability: manage_points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, points]
              properties:
                title: { type: string }
                points: { type: integer }
                sort: { type: integer }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /catalog/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Katalogeintrag ändern
      x-capability: manage_points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                points: { type: integer }
                active: { type: boolean }
                sort: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members:
    get:
      tags: [Verwaltung]
      summary: Mitglieder mit Summen
      description: Wer Dienstgrade bzw. Titel verwaltet, sieht zusätzlich frühere Mitglieder, die noch einen Dienstgrad bzw. Titel haben.
      x-capability: 'manage_points, manage_penalties, manage_ranks, manage_titles, create_users oder promote_users (Punkte bzw. offene Beträge nur mit dem jeweiligen Recht, sonst null)'
      parameters:
        - name: all
          in: query
          description: Auch Gast-Konten (nur mit Recht `promote_users`).
          schema: { type: string, enum: ['1'] }
        - name: candidates
          in: query
          description: Auch Anwärter (Rolle `candidate`) und Personen mit eigenen Rollen nur mit dem internen Kalender.
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberSummary' }
        '403': { $ref: '#/components/responses/Error' }

  /members/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Verwaltung]
      summary: Mitglied mit Punkten und Strafen
      x-capability: 'manage_points, manage_penalties, manage_ranks, manage_titles, create_users oder promote_users (Punkte bzw. Strafen nur mit dem jeweiligen Recht)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

    delete:
      tags: [Verwaltung]
      summary: Konto löschen mit allen eigenen Daten (Issue #24)
      description: |
        Standalone: Das Konto wird gelöscht. WordPress: Der Benutzer der Webseite bleibt, verliert aber seine Rolle in der
        App. In beiden Fällen werden Punkte, Strafen, Anwesenheit, Dienstgrad mit Verlauf, Titel und Push-Abos der Person
        gelöscht und alle Sitzungen beendet; was sie für andere eingetragen hat, bleibt. Nicht das eigene Konto, nicht der
        letzte Admin; Grenzen wie beim Passwort-Zurücksetzen.
      x-capability: create_users
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /members/{id}/role:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Rolle in der App setzen (nicht die eigene)
      description: |
        `admin` ist nur in der eigenständigen Version erlaubt; bei WordPress werden
        Admin-Rechte nur im WP-Backend vergeben. Der letzte Admin kann nicht
        herabgestuft werden.
      x-capability: promote_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { $ref: '#/components/schemas/Level' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  level: { $ref: '#/components/schemas/Level' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/promote:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Verwaltung]
      summary: Anwärter als Mitglied aufnehmen
      description: Nur von `candidate` zu `member`; andere Rollenwechsel gehen über `/members/{id}/role`.
      x-capability: create_users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  level: { $ref: '#/components/schemas/Level' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/account:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Verwaltung]
      summary: Angaben eines Kontos zum Bearbeiten (Issue #24)
      description: Mit denselben Grenzen wie beim Passwort-Zurücksetzen (Admins nur für Admins usw.).
      x-capability: create_users
      responses:
        '200': { $ref: '#/components/responses/AccountProfile' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Verwaltung]
      summary: Name, E-Mail und (nicht bei WordPress) Benutzername ändern
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                username: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AccountProfile' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /members/{id}/password:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Verwaltung]
      summary: Neues Startpasswort für ein Mitglied erzeugen
      description: |
        Neu gegenüber der ersten Umsetzung. Ersetzt „Passwort vergessen“ per E-Mail: Ein Admin erzeugt ein
        neues Startpasswort, das nur in dieser Antwort steht. Alle Geräte des Mitglieds
        werden abgemeldet. Wer kein Admin ist, darf das nur bei Anwärtern (auch eigenen Rollen nur mit dem Kalender)
        und Mitgliedern, deren Rechte er selbst hat (ohne create_users und promote_users), nicht bei Gästen und Admins.
      x-capability: create_users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [password]
                properties:
                  password: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /users:
    post:
      tags: [Verwaltung]
      summary: Mitglied oder Anwärter anlegen
      description: Erzeugt ein zufälliges Startpasswort, das nur in dieser Antwort steht. Es wird keine E-Mail verschickt.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                username: { type: string, description: 'Optional; erlaubt sind a–z, Ziffern, . _ - @' }
                email: { type: string, format: email }
                level: { type: string, enum: [member, candidate], default: member }
                initial_points: { type: integer, minimum: 0, description: 'Anfangsbestand (nur Mitglieder, Bereich Punkte und Recht manage_points)' }
                initial_points_date: { type: string, format: date, description: Datum der Buchung (Standard heute) }
                rank_id: { type: integer, description: 'Dienstgrad (Bereich Dienstgrade, Recht manage_ranks); mit Punkten muss der Anfangsbestand die Schwelle erreichen' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUser' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /users/bulk:
    post:
      tags: [Verwaltung]
      summary: Mehrere Mitglieder bzw. Anwärter auf einmal anlegen (Issue #24)
      description: |
        Höchstens 50. Erst werden alle Einträge geprüft (Namen, Benutzernamen und E-Mail auch untereinander,
        Anfangspunkte, Dienstgrad); bei einem Fehler wird keiner angelegt, die Meldung nennt die Zeile. Scheitert danach
        doch eines, steht es mit `error` im Ergebnis.
      x-capability: create_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                level: { type: string, enum: [member, candidate], default: member }
                people:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      username: { type: string }
                      email: { type: string, format: email }
                      initial_points: { type: integer, minimum: 0 }
                      initial_points_date: { type: string, format: date }
                      rank_id: { type: integer }
      responses:
        '201':
          description: Ergebnis je Person (angelegt mit Startpasswort oder mit Grund nicht)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/CreatedUser'
                    - type: object
                      properties:
                        name: { type: string }
                        username: { type: string }
                        error: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /points:
    post:
      tags: [Verwaltung]
      summary: Punkte an ein oder mehrere Mitglieder vergeben
      x-capability: manage_points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                points: { type: integer, description: 'Ohne Angabe: Punkte des Katalogeintrags. Nicht 0.' }
                catalog_id: { type: integer }
                reason: { type: string, description: 'Ohne Angabe: Titel des Katalogeintrags.' }
                date: { type: string, format: date }
                attendance_id: { type: integer, description: 'Aus dem Vorschlag einer Anwesenheitsliste (Issue #21): bucht nur für, wer für diese Liste noch keine Punkte hat; sonst 400' }
                apply_factor:
                  type: boolean
                  default: true
                  description: Punktefaktor der Rolle anwenden (z. B. 0,5). false bucht für alle mit Faktor 1.
      responses:
        '201':
          description: Angelegt (ein Eintrag pro Mitglied)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /points/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Verwaltung]
      summary: Punkte stornieren (wird nur ausgeblendet)
      x-capability: manage_points
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /penalties:
    post:
      tags: [Verwaltung]
      summary: Strafe an ein oder mehrere Mitglieder vergeben
      x-capability: manage_penalties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, amount_cents, reason]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                amount_cents: { type: integer, minimum: 1, maximum: 100000 }
                reason: { type: string }
                date: { type: string, format: date }
      responses:
        '201':
          description: Angelegt (eine Strafe pro Mitglied)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Penalty' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /penalties/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Verwaltung]
      summary: Strafe als bezahlt/offen markieren
      x-capability: manage_penalties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, paid] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Penalty' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Verwaltung]
      summary: Strafe stornieren (wird nur ausgeblendet)
      x-capability: manage_penalties
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/roles:
    get:
      tags: [Einstellungen]
      summary: Rollen mit Rechten, Punktefaktor und Anzahl der Personen
      description: |
        Jede Person hat genau eine Rolle. Fest sind Gast, Mitglied (Rolle neuer Konten) und Admin (nur umbenennen;
        Bezeichnungen bei der Ersteinrichtung aus `kompanie.json`). Schaltet der Admin einen Bereich mit eigenen Rechten ein
        (Termine, Punkte, Strafen), kommt dessen Standardrolle dazu; schaltet er ihn aus, verschwindet sie, wenn niemand sie hat.
        Wer Rollen vergeben darf, ohne Admin zu sein, vergibt nur Rollen mit eigenen Rechten, ohne `create_users` und `promote_users`.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Einstellungen]
      summary: Rolle anlegen
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/roles/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { $ref: '#/components/schemas/Level' } }
    patch:
      tags: [Einstellungen]
      summary: Rolle umbenennen, Rechte oder Punktefaktor ändern (nur mitgeschickte Felder)
      description: Bei guest und admin nur die Bezeichnung, bei member Bezeichnung und Punktefaktor. Ein geänderter Faktor gilt für künftige Buchungen.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Einstellungen]
      summary: Rolle löschen
      description: Sind der Rolle noch Personen zugeordnet, bekommen sie `replacement`; ohne Angabe → 400.
      x-capability: manage_settings
      parameters:
        - { name: replacement, in: query, required: false, schema: { $ref: '#/components/schemas/Level' } }
      responses:
        '200':
          description: Neuer Stand aller Rollen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleAdmin' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/features:
    get:
      tags: [Einstellungen]
      summary: Bereiche der App mit Schalter, Bezeichnung und Einrichtungsstand
      description: |
        Welche Bereiche eine Kompanie nutzt, entscheidet allein ihr Admin (Ersteinrichtung bzw. Einstellungen → Bereiche).
        Neue Installationen starten ohne Bereiche. Ein ausgeschalteter Bereich verschwindet aus der App, seine Routen
        antworten mit 403 `feature_disabled`, seine Hintergrundaufgaben laufen nicht; die Daten bleiben erhalten.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Einstellungen]
      summary: Bereiche ein- und ausschalten
      description: Nur mitgeschickte Bereiche werden geändert. Unbekannte Bereiche oder Werte, die kein Wahrheitswert sind → 400.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
              example: { gallery: true, penalties: false }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/maintenance:
    get:
      tags: [Einstellungen]
      summary: Wartungsmodus mit Verlauf
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Einstellungen]
      summary: Wartungsmodus ein- oder ausschalten, Begründung ändern
      description: |
        Issue #42. Solange er an ist, antworten alle Routen außer `/config`, `/auth/login`, `/auth/logout` und
        `/auth/csrf` für alle ohne `manage_settings` mit 503 `maintenance` (samt `reason`), ebenso geschützte Fotos
        und Dokumente. Hintergrundaufgaben außer Updates und Statusmeldungen pausieren. Jede Änderung kommt in den Verlauf.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['on']
              properties:
                'on': { type: boolean }
                reason: { type: string, maxLength: 500, description: 'Klartext, Zeilenumbrüche bleiben; ohne Angabe bleibt die bisherige Begründung' }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/settings:
    get:
      tags: [Einstellungen]
      summary: Einstellungen für Kalender, Galerie und Neuigkeiten
      description: Geheime Werte (iCal-Adresse, API-Schlüssel, Dienstkonto) werden nie zurückgegeben, nur ob sie gesetzt sind.
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Einstellungen]
      summary: Einstellungen ändern
      description: Nur mitgeschickte Felder werden übernommen; ein leerer Text löscht den Wert.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                calendar_ics_url: { type: string, description: 'Geheime iCal-Adresse; webcal:// wird als https:// gespeichert' }
                google_api_key: { type: string }
                calendar_ids: { type: string, description: Kommagetrennte Kalender-IDs (nur mit API-Schlüssel) }
                calendar_cache_minutes: { type: integer, minimum: 1, maximum: 1440 }
                drive_service_account: { type: string, description: JSON-Schlüssel des Dienstkontos }
                drive_oauth: { type: string, enum: [''], description: Leer trennt eine bestehende OAuth-Verbindung zu Google (etwa aus einer Übernahme) }
                gallery_root: { type: string, description: Link oder ID des Galerie-Ordners in Google Drive }
                news_source: { type: string, enum: [none, wordpress, rss], description: Nur eigenständige Version }
                news_url: { type: string, description: Nur eigenständige Version }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/calendar/test:
    post:
      tags: [Einstellungen]
      summary: Kalender ohne Zwischenspeicher abrufen
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, sample]
                properties:
                  count: { type: integer }
                  sample:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      properties:
                        start: { type: string }
                        title: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/news/test:
    post:
      tags: [Einstellungen]
      summary: Quelle der Neuigkeiten ohne Zwischenspeicher abrufen (nur eigenständige Version)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, description: Beiträge auf der ersten Seite }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/gallery/sync:
    post:
      tags: [Einstellungen]
      summary: Galerie von Hand abgleichen und Bilder aufbereiten
      description: |
        Gleicht mit Google Drive ab und bereitet Bilder auf, solange das Zeitbudget reicht (etwa 20 Sekunden).
        Steht danach noch etwas aus (`pending` > 0), ruft die App mit `only_process: true` erneut auf.
      x-capability: manage_settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                only_process: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums: { type: integer }
                  photos: { type: integer }
                  processed: { type: integer }
                  pending: { type: integer }
                  failed: { type: integer, description: Bilder, die sich nicht laden ließen (werden beim nächsten Abgleich erneut versucht) }
                  error: { type: string, description: Fehler des Abgleichs, sonst leer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/push:
    get:
      tags: [Einstellungen]
      summary: Stand der Benachrichtigungen (Geräte, Warteschlange, Uhrzeit der Erinnerung)
      x-capability: manage_settings
      responses:
        '200': { $ref: '#/components/responses/PushAdmin' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Einstellungen]
      summary: Uhrzeit der Erinnerung an Termine am nächsten Tag ändern
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reminder_hour: { type: integer, minimum: 0, maximum: 23 }
      responses:
        '200': { $ref: '#/components/responses/PushAdmin' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/status:
    get:
      tags: [Wartung]
      summary: Zustand der Installation (Ampel), Updates, Statusmeldungen
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, support, updates, statusReports, setupDone]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, label, level, text]
                      properties:
                        key: { type: string, description: 'z. B. updates, gallery, calendar, backup, server' }
                        label: { type: string }
                        level: { type: string, enum: [ok, warn, error, off] }
                        text: { type: string }
                  support: { type: string, description: Kontakt für Hilfe (E-Mail oder Webadresse), sonst leer }
                  updates: { $ref: '#/components/schemas/UpdateStatus' }
                  statusReports:
                    type: object
                    properties:
                      enabled: { type: boolean, description: Der Admin hat Statusmeldungen zugestimmt }
                      available: { type: boolean, description: Das Paket nennt einen Empfänger }
                      payload: { type: object, description: 'Genau das, was gesendet würde (ohne Namen oder Inhalte)' }
                  setupDone: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/update/check:
    post:
      tags: [Wartung]
      summary: Update-Liste jetzt laden und prüfen (Signatur, Kompanie, laufende Nummer)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update/install:
    post:
      tags: [Wartung]
      summary: Eine Version aus der geprüften Liste einspielen
      description: |
        Vorher wird bei Datenbank-Änderungen und vor einer neuen Hauptversion automatisch gesichert. Eine neue
        Hauptversion nur mit `major` true. Im Kanal stable nur schon freigegebene Versionen. 409, wenn gerade
        schon ein Update läuft.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: 1.4.0.3 }
                major: { type: boolean, default: false }
      responses:
        '200':
          description: Eingespielt
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update/rollback:
    post:
      tags: [Wartung]
      summary: Auf eine ältere Version derselben Hauptversion zurück
      description: Die bisherige Version wird danach beim automatischen Update übersprungen, bis eine neuere erscheint.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
      responses:
        '200':
          description: Eingespielt
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /admin/update:
    patch:
      tags: [Wartung]
      summary: Automatische Updates und Statusmeldungen ein- oder ausschalten
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto: { type: boolean }
                status_reports: { type: boolean, description: Zustimmung zu täglichen Statusmeldungen }
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/backup:
    get:
      tags: [Wartung]
      summary: Datensicherung herunterladen
      description: |
        Gemeinsames Format `kompanie-app-backup` (Tabellen und Einstellungen; eigenständige Version
        auch Konten mit Passwort-Hashes). Enthält Zugangsschlüssel – sicher aufbewahren.
      x-capability: manage_settings
      responses:
        '200':
          description: Sicherung (mit Content-Disposition attachment)
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Wartung]
      summary: Sicherung wiederherstellen (ersetzt alle Daten)
      description: |
        Eigenständige Version: nur Sicherungen der eigenständigen Version mit mindestens einem Admin;
        alle Sitzungen enden. WordPress: nur Sicherungen derselben Website.
      x-capability: manage_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup, confirm]
              properties:
                backup: { type: string, description: Inhalt der Sicherungsdatei }
                confirm: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Wiederhergestellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/setup/done:
    post:
      tags: [Wartung]
      summary: Einrichtungsassistent abschließen (setupPending wird danach false)
      x-capability: manage_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  done: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

security:
  - session: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Name und Inhalt des Cookies hängen vom Adapter ab (WordPress-Anmelde-Cookie bzw. eigene Sitzung).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    PushStatus:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [supported, publicKey, types, subscription]
            properties:
              supported: { type: boolean }
              publicKey: { type: string }
              types:
                type: array
                description: Arten, die dieser Anfragende abonnieren kann (nach Bereichen und Rechten)
                items:
                  type: object
                  required: [key, label]
                  properties:
                    key: { $ref: '#/components/schemas/PushType' }
                    label: { type: string }
              subscription:
                oneOf:
                  - type: 'null'
                  - $ref: '#/components/schemas/PushSubscriptionInfo'
    PushSubscription:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PushSubscriptionInfo' }
    PushTest:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              sent: { type: boolean }
    PushAdmin:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [supported, missing, devices, accounts, guests, queued, reminderHour]
            properties:
              supported: { type: boolean }
              missing: { type: array, items: { type: string }, description: Fehlende PHP-Voraussetzungen }
              devices: { type: integer }
              accounts: { type: integer }
              guests: { type: integer }
              queued: { type: integer, description: Nachrichten in der Warteschlange }
              reminderHour: { type: integer, minimum: 0, maximum: 23 }
    Error:
      description: Fehler
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountProfile:
      description: Angaben eines Kontos
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              login: { type: string }
              email: { type: string }
              can_change_login: { type: boolean, description: 'false bei WordPress' }
    AttendanceGroups:
      description: Je Rolle (ohne Gast), als welche sie im Zähler zählt
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                key: { type: string }
                label: { type: string }
                counts_as: { type: [string, 'null'], description: null = eigene Gruppe }
    Deleted:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean }

  schemas:
    PushType:
      type: string
      enum: [penalties, points, ranks, titles, events, reminder, news]
    PushSubscribe:
      type: object
      required: [endpoint, keys]
      description: Angaben aus `PushSubscription.toJSON()` des Browsers, dazu die gewünschten Arten.
      properties:
        endpoint: { type: string, description: https-Adresse des Push-Dienstes }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
        details: { type: boolean }
    PushSubscriptionInfo:
      type: object
      required: [types, details]
      properties:
        types: { type: array, items: { $ref: '#/components/schemas/PushType' } }
        details: { type: boolean }
    Feature:
      type: object
      required: [key, label, description, enabled, requires, configured, setup]
      properties:
        key:
          type: string
          enum: [events, calendar, news, gallery, points, penalties, ranks, titles, attendance, documents]
        label: { type: string, description: Bezeichnung (aus kompanie.json oder Standard) }
        description: { type: string, description: Ein Satz, wofür der Bereich da ist }
        enabled: { type: boolean }
        requires:
          type: array
          items: { type: string }
          description: Bereiche, die eingeschaltet sein müssen
        configured:
          type: [boolean, 'null']
          description: Ob der Bereich eingerichtet ist (z. B. Kalender mit Adresse); null = braucht keine Einrichtung
        setup:
          type: [string, 'null']
          description: Abschnitt der Einstellungen bzw. Schritt der Ersteinrichtung, z. B. `kalender`
    MaintenanceInfo:
      type: object
      required: ['on', reason, since]
      properties:
        'on': { type: boolean }
        reason: { type: string, description: 'Begründung (Klartext), leer wenn keine' }
        since: { type: integer, description: 'Eingeschaltet seit (Unix-Zeit), 0 wenn aus' }
    Maintenance:
      allOf:
        - $ref: '#/components/schemas/MaintenanceInfo'
        - type: object
          required: [by, log]
          properties:
            by: { type: integer, description: Konto, das eingeschaltet hat }
            log:
              type: array
              description: Verlauf, neueste zuerst (höchstens 20)
              items:
                type: object
                required: [at, by, by_name, 'on', reason]
                properties:
                  at: { type: integer }
                  by: { type: integer }
                  by_name: { type: string }
                  'on': { type: boolean }
                  reason: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        reason: { type: string, description: 'Nur bei `maintenance`: Begründung des Wartungsmodus' }
        code:
          type: string
          description: |
            z. B. `not_logged_in` (401), `forbidden` (403), `invalid` (400), `not_found` (404),
            `feature_disabled` (403, Bereich vom Admin ausgeschaltet), `method_not_allowed` (405),
            `csrf_invalid` (403), `upstream_error` (502), `not_configured` (503), `internal_error` (500),
            `maintenance` (503, Wartungsmodus, mit `reason`).
            Push (Issue #19): `push_unsupported` (501), `push_full` (503), `too_many_attempts` (429),
            `push_gone` (410) und `push_key_mismatch` (409, Gerät neu anmelden) bei der Testnachricht.
            Nur eigenständige Version: `login_failed` (400), `too_many_attempts` (429),
            `unsupported_media_type` (415, Änderungen nur als JSON), `not_installed` (503).
            Nur WordPress: `use_login_page` (400).
        message: { type: string, description: Für Menschen lesbar, in der Sprache der Kompanie }

    AdminSettings:
      type: object
      required: [calendar, gallery, news]
      properties:
        calendar:
          type: object
          properties:
            source: { type: string, enum: [ics, google, none] }
            ics_url_set: { type: boolean }
            google_api_key_set: { type: boolean }
            calendar_ids: { type: string }
            cache_minutes: { type: integer }
        gallery:
          type: object
          properties:
            configured: { type: boolean }
            root: { type: string }
            service_account_email: { type: string }
            oauth_connected: { type: boolean, description: Bestehende OAuth-Verbindung zu Google (geht dem Dienstkonto vor) }
            oauth_email: { type: string, description: Google-Konto der OAuth-Verbindung, leer wenn unbekannt }
            status:
              type: object
              description: Stand des letzten Abgleichs (albums, photos, new, pending, last_sync, error)
        news:
          type: [object, 'null']
          description: null, wenn die Neuigkeiten aus den Beiträgen der WordPress-Seite kommen.
          properties:
            source: { type: string, enum: [none, wordpress, rss] }
            url: { type: string }

    Level:
      type: string
      maxLength: 10
      description: |
        Schlüssel der Rolle. Fest sind `guest` (keine Rechte), `candidate` (Anwärter: nur interner Kalender), `member`
        (Mitgliederbereich mit Kalender, Rolle neuer Konten) und `admin` (alle Rechte). Standardrollen der Bereiche heißen wie der Bereich (`events`, `points`, `penalties`), eigene Rollen
        `r1`, `r2`, …; ältere Installationen haben außerdem `organizer` und `manager`. Bezeichnungen und Punktefaktor stehen in
        `/config` (`roles`), Rechte unter `/admin/roles`.

    RoleInfo:
      type: object
      required: [key, label, points_factor]
      properties:
        key: { $ref: '#/components/schemas/Level' }
        label: { type: string }
        points_factor: { type: number, description: 'Gilt beim Buchen von Punkten, z. B. 0.5' }

    RoleAdmin:
      allOf:
        - $ref: '#/components/schemas/RoleInfo'
        - type: object
          required: [capabilities, users, system, deletable]
          properties:
            capabilities:
              type: array
              items: { type: string, enum: [member, calendar, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, create_users, promote_users, manage_settings] }
              description: 'Ausdrücklich gegebene Rechte (member schließt calendar ein und wird ohne es angezeigt); bei admin alle; vergebbar sind alle außer manage_settings. Ohne member nur calendar.'
            users: { type: integer, description: Anzahl der Personen mit dieser Rolle }
            system: { type: boolean, description: 'guest, candidate, member und admin: Rechte fest, nicht löschbar' }
            deletable: { type: boolean, description: 'false für guest, candidate, member und admin' }

    RoleInput:
      type: object
      properties:
        label: { type: string, maxLength: 30 }
        capabilities:
          type: array
          items: { type: string, enum: [member, calendar, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, create_users, promote_users] }
          description: 'Verwaltungsrechte nur zusammen mit member; calendar geht auch allein (wie bei Anwärtern).'
        points_factor: { type: [number, string], description: 'Zwischen 0 und 10, z. B. 0.5 oder "0,5"' }

    AppUser:
      type: object
      required: [id, name, level, capabilities]
      properties:
        id: { type: integer }
        name: { type: string }
        login: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        capabilities:
          type: array
          items:
            type: string
            enum: [member, calendar, manage_points, manage_penalties, manage_ranks, manage_titles, manage_attendance, manage_events, manage_documents, create_users, promote_users, manage_settings]
          description: 'Wirksame Rechte; member bringt calendar mit.'

    UpdateStatus:
      type: object
      properties:
        configured: { type: boolean, description: Paket mit Update-Adresse und der Adapter kann einspielen }
        current: { type: string }
        channel: { type: string, enum: [early, stable] }
        auto: { type: boolean }
        checked_at: { type: [integer, 'null'] }
        error: { type: string, description: Fehler der letzten Prüfung, sonst leer }
        latest: { type: [string, 'null'] }
        available: { type: boolean, description: Neuere Version derselben Hauptversion verfügbar }
        major: { type: boolean, description: Neue Hauptversion verfügbar (nur mit Bestätigung) }
        majorVersion: { type: string }
        withdrawn: { type: boolean, description: Die installierte Version wurde zurückgezogen }
        fallback: { type: [string, 'null'], description: 'Bei withdrawn: Ziel des automatischen Wechsels; null = keins vorhanden' }
        skipped: { type: boolean, description: 'latest wird nach dem Zurückrollen nicht automatisch eingespielt' }
        autoAllowed: { type: boolean, description: 'Automatische Updates sind hier erlaubt (WordPress kann sie sperren)' }
        problems: { type: array, items: { type: string }, description: Gründe, warum die neue Version hier nicht läuft }
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: string }
              published: { type: string }
        last:
          type: [object, 'null']
          description: Letzter Update-Versuch
          properties:
            from: { type: string }
            to: { type: string }
            kind: { type: string, enum: [auto, manual, rollback, withdrawn] }
            at: { type: integer }
            ok: { type: boolean }
            error: { type: string }

    AppConfig:
      type: object
      required: [apiBase, appUrl, swUrl, auth, csrf, features, user, version]
      properties:
        apiBase: { type: string }
        appUrl: { type: string }
        swUrl: { type: string, description: 'Adresse des Service Workers (Bereich: appUrl)' }
        version: { type: string, description: 'Version der Installation, z. B. 1.4.0.3' }
        variant: { type: string, enum: [wordpress, standalone], description: Art der Installation }
        siteUrl: { type: [string, 'null'], description: Startseite der Webseite, falls vorhanden }
        handbookUrl: { type: [string, 'null'], description: 'Handbuch der Kompanie auf ihrer GitHub-Pages-Seite (…/handbuch/), aus der Adresse der Update-Liste abgeleitet; sonst null' }
        setupPending: { type: boolean, description: 'Nur für Admins true: Einrichtungsassistent noch nicht abgeschlossen' }
        maintenance: { $ref: '#/components/schemas/MaintenanceInfo' }
        csrf:
          type: object
          required: [header, token, refreshUrl]
          properties:
            header: { type: string, description: 'Name des Headers, z. B. X-CSRF-Token oder X-WP-Nonce' }
            token: { type: string, description: Leer für Gäste ohne Anmeldung }
            refreshUrl:
              type: string
              description: |
                GET liefert {token}. Funktioniert allein mit dem Sitzungs-Cookie, auch wenn das
                alte Token abgelaufen ist (WordPress: /app/csrf, Standalone: {apiBase}auth/csrf).
        auth:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [form, redirect]
            loginUrl: { type: [string, 'null'], description: Nur bei `redirect` }
            logoutUrl: { type: [string, 'null'], description: Nur bei `redirect` und Anmeldung }
        roles:
          type: array
          description: Rollen der Installation in der Reihenfolge der Anzeige (Bezeichnungen, Punktefaktor).
          items: { $ref: '#/components/schemas/RoleInfo' }
        features:
          type: object
          description: Bereiche, die der Admin eingeschaltet hat **und** die auf dem Server eingerichtet sind.
          properties:
            events: { type: boolean }
            calendar: { type: boolean }
            news: { type: boolean }
            gallery: { type: boolean }
            points: { type: boolean }
            penalties: { type: boolean }
            ranks: { type: boolean }
            titles: { type: boolean }
            attendance: { type: boolean }
            documents: { type: boolean }
        user:
          oneOf:
            - $ref: '#/components/schemas/AppUser'
            - type: 'null'
          description: null = Gast ohne Anmeldung

    Me:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        points: { type: number, description: 'Summe mit Punktefaktor, höchstens zwei Nachkommastellen' }
        open_cents: { type: integer }
        rank:
          description: Eigener Dienstgrad (nur mit Bereich Dienstgrade)
          oneOf:
            - $ref: '#/components/schemas/RankRef'
            - type: 'null'
        titles:
          description: Eigene Titel in der Reihenfolge der Titelliste (nur mit Bereich Titel)
          type: array
          items: { $ref: '#/components/schemas/TitleRef' }

    PointEntry:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        points: { type: number, description: 'Was zählt: base_points × factor (höchstens zwei Nachkommastellen)' }
        base_points: { type: integer, description: Gebuchte Punktzahl }
        factor: { type: number, description: Punktefaktor der Rolle beim Buchen }
        reason: { type: string }
        catalog_id: { type: [integer, 'null'] }
        attendance_id: { type: [integer, 'null'], description: 'Anwesenheitsliste, aus deren Vorschlag gebucht wurde (Issue #21)' }
        date: { type: string, format: date }
        created_by_name: { type: [string, 'null'] }

    Penalty:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        amount_cents: { type: integer }
        reason: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [open, paid] }
        paid_at: { type: [string, 'null'] }
        created_by_name: { type: [string, 'null'] }

    CatalogItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        points: { type: integer }
        active: { type: boolean }
        sort: { type: integer }

    CalendarEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        start: { type: string, description: ISO 8601 }
        end: { type: string, description: ISO 8601 }
        all_day: { type: boolean }
        location: { type: string }
        description: { type: string }

    PublicEvent:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        start: { type: string }
        end: { type: string }
        all_day: { type: boolean }
        location: { type: string }
        description: { type: string }
        start_date: { type: string, format: date }
        start_time: { type: [string, 'null'] }
        end_date: { type: [string, 'null'] }
        end_time: { type: [string, 'null'] }
        url: { type: string }

    EventInput:
      type: object
      required: [title, start_date]
      properties:
        title: { type: string }
        start_date: { type: string, format: date }
        start_time: { type: string, description: 'HH:MM oder leer' }
        end_date: { type: string, description: 'YYYY-MM-DD oder leer' }
        end_time: { type: string, description: 'HH:MM oder leer' }
        location: { type: string }
        description: { type: string }
        url: { type: string }

    NewsItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string, description: 'ISO 8601 (UTC); leer, wenn die Quelle kein lesbares Datum liefert' }
        excerpt: { type: string }
        image: { type: [string, 'null'] }
        link: { type: string }
        content: { type: string, description: Nur bei der Einzelansicht }

    GalleryAlbumSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        count: { type: integer }
        intern_count: { type: integer }
        cover: { type: [string, 'null'] }

    GalleryYear:
      type: object
      properties:
        year: { type: string }
        albums:
          type: array
          items: { $ref: '#/components/schemas/GalleryAlbumSummary' }

    GalleryPhoto:
      type: object
      properties:
        id: { type: integer }
        thumb:
          type: string
          description: |
            Adresse des Vorschaubilds. Öffentliche fertige Bilder als statische Datei, sonst über die App
            (`…/foto/<id>/thumb`, außerhalb der API). Dort antwortet der Server für Bilder, die noch nicht
            aufbereitet sind, mit **202**, einem grauen SVG-Platzhalter im Seitenverhältnis des Fotos,
            `Cache-Control: no-store` und `Retry-After` (Sekunden); die Aufbereitung läuft im Hintergrund.
            Fertige Bilder: 200 mit JPEG. Interne Bilder ohne Mitgliedschaft: 401/403.
        large: { type: string, description: Adresse der Großansicht (Verhalten wie thumb) }
        width: { type: integer }
        height: { type: integer }
        intern: { type: boolean }
        name: { type: string }
        ready:
          type: boolean
          description: false, solange das Bild noch aufbereitet wird (die Adressen liefern dann den Platzhalter). Die App lädt das Album dann alle 30 s neu.

    GalleryAlbum:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        year: { type: string }
        photos:
          type: array
          items: { $ref: '#/components/schemas/GalleryPhoto' }

    MemberSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        member: { type: boolean, description: 'Mit Mitgliederbereich (Punkte und Strafen möglich); false bei Anwärtern, Rollen nur mit Kalender und Gästen' }
        points: { type: [number, 'null'], description: 'Summe mit Punktefaktor, höchstens zwei Nachkommastellen; null ohne manage_points' }
        open_cents: { type: [integer, 'null'], description: 'null ohne manage_penalties' }
        rank_title: { type: [string, 'null'], description: 'Dienstgrad (nur mit Bereich Dienstgrade und Recht manage_ranks)' }
        rank_badge_url: { $ref: '#/components/schemas/BadgeUrl' }
        titles:
          description: Titel in der Reihenfolge der Titelliste (nur mit Bereich Titel und Recht manage_titles)
          type: array
          items: { $ref: '#/components/schemas/TitleRef' }

    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          properties:
            point_list:
              type: array
              items: { $ref: '#/components/schemas/PointEntry' }
            penalties:
              type: array
              items: { $ref: '#/components/schemas/Penalty' }
            rank: { $ref: '#/components/schemas/RankStatus' }
            rank_history:
              type: array
              items: { $ref: '#/components/schemas/RankHistoryEntry' }
            titles:
              description: Titel (nur mit Bereich Titel und Recht manage_titles)
              type: array
              items: { $ref: '#/components/schemas/TitleRef' }

    Rank:
      type: object
      required: [id, title, sort, min_points, active]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 60 }
        sort: { type: integer, description: Reihenfolge, der niedrigste zuerst }
        min_points: { type: [integer, 'null'], description: 'Punkteschwelle; null = ohne. Für Mitglieder nur mit dem Bereich Punkte' }
        active: { type: boolean }
        assigned: { type: integer, description: 'Wie oft vergeben (nur mit all=1)' }
        badge_url: { $ref: '#/components/schemas/BadgeUrl' }
        badge_type: { type: [string, 'null'], enum: [png, jpg, webp, svg, null], description: 'Format des hochgeladenen Abzeichens (nur mit all=1)' }
        badge_push: { type: boolean, description: 'Es gibt eine PNG-Fassung für Benachrichtigungen (nur mit all=1; bei SVG nur, wenn die App eine mitgeschickt hat)' }

    BadgeUrl:
      type: [string, 'null']
      description: |
        Abzeichen des Dienstgrads (Issue #17) oder null: `<App>/abzeichen/<id>?v=<Fassung>&s=128`. Die App ersetzt
        `s` bei Bedarf durch 64 oder 256 (PNG-Fassungen; bei SVG dieselbe Datei). Ausgeliefert nur an angemeldete
        Personen mit Mitgliederbereich oder internem Kalender (sonst 401/403, im Wartungsmodus 503, Bereich aus 404);
        SVG als image/svg+xml mit `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; sandbox`
        und `X-Content-Type-Options: nosniff`, sonst image/png. Die Adresse wechselt mit jeder Fassung.

    Title:
      type: object
      required: [id, title, sort, active, assigned]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 60 }
        sort: { type: integer, description: Reihenfolge der Anzeige }
        active: { type: boolean, description: 'Deaktivierte werden nicht mehr neu vergeben; wer sie hat, behält sie' }
        assigned: { type: integer, description: Wie vielen Mitgliedern zugewiesen }

    DocCategory:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 191 }
        sort: { type: integer }

    DocumentInfo:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 191 }
        category_id: { type: [integer, 'null'] }
        date: { type: string, format: date, description: Stand }
        visibility: { type: string, enum: [members, managers], description: 'managers: nur wer manage_documents hat' }
        ext: { type: string }
        kind: { type: string, enum: [pdf, image, file], description: 'pdf und image zeigt die App an, file nur herunterladen' }
        mime: { type: string }
        size: { type: integer }
        version: { type: string, description: Wechselt mit jeder neuen Fassung }
        url: { type: string, description: 'Auslieferung mit Prüfung der Anmeldung: <App>/dokument/<id>?v=<version>' }
        updated_at: { type: string }

    DocumentFile:
      type: object
      required: [name, data]
      description: Datei für das Hochladen (beide Adapter nehmen nur JSON an)
      properties:
        name: { type: string, description: 'Dateiname; die Endung bestimmt den Typ (pdf, jpg, jpeg, png, doc, docx, xls, xlsx, ppt, pptx, odt, ods, odp)' }
        data: { type: string, description: 'Inhalt Base64-kodiert, auch als data:-Adresse; die Signatur muss zur Endung passen' }

    AttendanceStatus:
      type: string
      enum: [present, excused, absent]
      description: anwesend, entschuldigt, fehlt

    AttendanceCounts:
      type: object
      properties:
        present: { type: integer }
        excused: { type: integer }
        absent: { type: integer }

    AttendanceSummary:
      type: object
      properties:
        id: { type: integer }
        source: { type: string, enum: [calendar, free] }
        title: { type: string, description: Momentaufnahme beim Anlegen }
        date: { type: string, format: date }
        counts: { $ref: '#/components/schemas/AttendanceCounts' }

    AttendanceDetail:
      allOf:
        - $ref: '#/components/schemas/AttendanceSummary'
        - type: object
          properties:
            event_key: { type: [string, 'null'], description: ID des Kalendertermins (nur source calendar) }
            updated_by_name: { type: [string, 'null'] }
            updated_at: { type: string }
            people:
              type: array
              description: Alle mit einer Rolle (ohne Gäste), nach Namen
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  role: { $ref: '#/components/schemas/Level' }
                  group: { type: string, description: Rolle, als die die Person im Zähler zählt }
                  member: { type: boolean, description: 'Mit Mitgliederbereich: Punkte und Strafen möglich' }
                  status:
                    oneOf:
                      - $ref: '#/components/schemas/AttendanceStatus'
                      - type: 'null'
                  booked: { type: boolean, description: Hat für diese Liste schon Punkte (ohne stornierte) }
            counts_by_group:
              type: object
              description: Je Status die Gruppen in der Reihenfolge der Rollen
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    group: { type: string }
                    label: { type: string }
                    count: { type: integer }

    TitleRef:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }

    RankRef:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        badge_url: { $ref: '#/components/schemas/BadgeUrl' }

    RankStatus:
      type: object
      description: |
        Dienstgrad eines Mitglieds; alle Felder nach rank nur, wenn auch der Bereich Punkte an ist. next_rank ist der
        nächste aktive Dienstgrad mit Schwelle (Dienstgrade ohne Schwelle werden übersprungen), sonst der nächste.
      properties:
        rank:
          oneOf:
            - $ref: '#/components/schemas/RankRef'
            - type: 'null'
        points: { type: number }
        next_rank:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/RankRef'
                - type: object
                  properties:
                    min_points: { type: [integer, 'null'] }
            - type: 'null'
        points_to_next: { type: [number, 'null'], description: '≤ 0: Schwelle erreicht; null ohne nächsten Dienstgrad oder ohne Schwelle' }
        reachable_rank:
          description: Höchster Dienstgrad mit erreichter Schwelle
          oneOf:
            - $ref: '#/components/schemas/RankRef'
            - type: 'null'
        threshold_reached_since: { type: [string, 'null'], format: date, description: 'Seit wann die Summe durchgehend die Schwelle des nächsten erreicht' }
        below_current_threshold: { type: boolean }

    RankHistoryEntry:
      type: object
      properties:
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        to_badge_url:
          description: Heutiges Abzeichen des neuen Dienstgrads (der Verlauf speichert nur Bezeichnungen); null ohne
          $ref: '#/components/schemas/BadgeUrl'
        kind: { type: string, enum: [promotion, demotion, initial] }
        points_at_change: { type: [number, 'null'], description: 'null ohne den Bereich Punkte' }
        reason: { type: string }
        changed_by_name: { type: [string, 'null'] }
        changed_at: { type: string, description: 'UTC, YYYY-MM-DD HH:MM:SS' }

    CreatedUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        email: { type: string }
        level: { type: string, enum: [member, candidate] }
        warning: { type: string, description: 'Konto angelegt, aber Anfangspunkte bzw. Dienstgrad nicht übernommen' }
        password: { type: string, description: Startpasswort; steht nur in dieser Antwort }
